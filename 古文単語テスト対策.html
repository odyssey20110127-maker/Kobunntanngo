function clearTestTimers(){ T.timers.forEach(clearTimeout); T.timers = []; }

const qWrap = $('qWrap'), qNo = $('qNo'), qSentence = $('qSentence'), qChoices = $('qChoices'), qFeedback = $('qFeedback');
const testIntro = $('testIntro'), testResult = $('testResult');

function startTest(roundId, onlyKeys){
  const round = ROUNDS.find(r=>r.id===roundId);
  if(!round) return;
  clearTestTimers();
  T.round = round;
  T.qs = buildQuestions(round, onlyKeys);
  T.i = 0; T.correct = 0; T.streak = 0; T.best = 0; T.wrong = []; T.locked = true;
  T.review = !!onlyKeys;

  testResult.classList.remove('show');
  $('testCorrect').textContent = '0';
  $('testStreak').classList.remove('on');
  $('testBarFill').style.width = '0%';
  qFeedback.classList.remove('show'); qFeedback.innerHTML = '';
  qChoices.innerHTML = ''; qSentence.innerHTML = '';
  qNo.textContent = '';
  $('testProgressLabel').textContent = '第'+numToKanji(round.id)+'回 ・ '+(T.review?'おさらい':'テスト');

  // intro（画面が切り替わってから文字が並ぶ）
  testIntro.classList.add('hide');
  showScreen('test');
  const title = '第'+numToKanji(round.id)+'回　'+(T.review?'おさらい':'力試し');
  $('tiTitle').innerHTML = [...title].map((ch,i)=>'<span class="c" style="animation-delay:'+(0.4+i*0.09).toFixed(2)+'s">'+(ch==='　'?'&nbsp;&nbsp;':ch)+'</span>').join('');
  $('tiSub').textContent = '全 '+T.qs.length+' 問';
  void testIntro.offsetWidth;
  testIntro.classList.remove('hide');

  later(()=>{ testIntro.classList.add('hide'); renderQuestion(true); }, 3000);
}

function renderQuestion(first){
  const q = T.qs[T.i];
  const N = T.qs.length;
  T.locked = true;
  qFeedback.classList.remove('show'); qFeedback.innerHTML = '';
  qWrap.classList.remove('leaving');
  qWrap.classList.remove('entering'); void qWrap.offsetWidth; qWrap.classList.add('entering');

  qNo.textContent = '問 '+(T.i+1)+' ／ '+N;
  $('testProgressLabel').textContent = '第'+numToKanji(T.round.id)+'回 ・ '+(T.review?'おさらい':'テスト')+' ・ '+(T.i+1)+' / '+N;
  $('testBarFill').style.width = ((T.i)/N*100)+'%';

  // sentence (char-by-char reveal + underline sweep)
  const m = q.s.t.match(/^([\s\S]*?)\[\[([\s\S]+?)\]\]([\s\S]*)$/);
  const pre = m[1], hit = m[2], post = m[3];
  const step = 0.028;
  let n = 0;
  const mk = (s)=>[...s].map(ch=>'<span class="c" style="animation-delay:'+((n++)*step).toFixed(3)+'s">'+ch+'</span>').join('');
  const preH = mk(pre);
  const hitH = mk(hit);
  const postH = mk(post);
  const ud = (n*step + 0.12).toFixed(2);
  qSentence.innerHTML = preH + '<span class="q-hit" style="--ud:'+ud+'s">'+hitH+'</span>' + postH;

  // choices
  const base = n*step + 0.55;
  qChoices.classList.remove('ready');
  qChoices.innerHTML = q.options.map((o,i)=>
    '<button class="choice" data-i="'+i+'" style="--cd:'+(base+i*0.09).toFixed(2)+'s">'
    + '<span class="lab">'+LABELS[i]+'</span><span class="txt">'+o.m+'</span></button>'
  ).join('');
  qChoices.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click', ()=> answer(Number(btn.dataset.i)));
  });
  later(()=>{ qChoices.classList.add('ready'); T.locked = false; }, (base + 3*0.09 + 0.45)*1000);
}

function answer(i){
  if(T.locked) return;
  T.locked = true;
  const q = T.qs[T.i];
  const N = T.qs.length;
  const chosen = q.options[i];
  const ok = !!chosen.ok;
  const btns = [...qChoices.querySelectorAll('.choice')];
  const ci = q.options.findIndex(o=>o.ok);

  btns.forEach((b,bi)=>{ b.classList.add('locked'); if(bi!==i && bi!==ci) b.classList.add('dim'); });

  const addMaru = (b, delay)=>{
    const W = b.offsetWidth, H = b.offsetHeight;
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','mark maru');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', maruPath(W,H)); p.setAttribute('pathLength','1');
    p.style.animationDelay = delay+'s';
    svg.appendChild(p); b.appendChild(svg);
  };
  const addBatsu = (b)=>{
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','mark batsu');
    svg.setAttribute('viewBox','0 0 40 40');
    ['M 6 6 L 34 34','M 34 6 L 6 34'].forEach(d=>{
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', d); p.setAttribute('pathLength','1');
      svg.appendChild(p);
    });
    b.appendChild(svg);
  };

  if(ok){
    btns[i].classList.add('correct');
    addMaru(btns[i], 0.05);
    T.correct++; T.streak++; T.best = Math.max(T.best, T.streak);
  } else {
    btns[i].classList.add('wrong');
    addBatsu(btns[i]);
    later(()=>{ btns[ci].classList.add('correct'); btns[ci].classList.remove('dim'); addMaru(btns[ci], 0); }, 520);
    T.streak = 0;
    T.wrong.push({ key:q.key, w:q.w.w, m:q.s.m, tr:q.s.tr });
  }

  const cEl = $('testCorrect');
  cEl.textContent = String(T.correct);
  cEl.classList.remove('pop'); void cEl.offsetWidth; if(ok) cEl.classList.add('pop');
  const sEl = $('testStreak');
  if(T.streak >= 2){ sEl.textContent = '🔥 '+T.streak+' 連続'; sEl.classList.add('on'); }
  else { sEl.classList.remove('on'); }
  $('testBarFill').style.width = ((T.i+1)/N*100)+'%';

  const last = (T.i+1 >= N);
  const fbDelay = ok ? 450 : 900;
  later(()=>{
    qFeedback.innerHTML =
      '<div class="fb-inner">'
      + '<div class="fb-verdict '+(ok?'ok':'ng')+'">'+(ok?'正解！':'残念…')+'</div>'
      + '<div class="fb-body">'
      +   '<b>訳</b>　'+q.s.tr+'<br>'
      +   '<span class="fb-w">'+q.w.w+'</span> ＝ '+q.w.mean+'<br>'
      +   '<b>覚え方</b>　'+q.w.mne
      + '</div>'
      + '<button class="fb-next" id="fbNext">'+(last?'結果を見る':'つぎへ')+'<span class="ar">▷</span></button>'
      + '</div>';
    $('fbNext').addEventListener('click', nextQuestion);
    requestAnimationFrame(()=> qFeedback.classList.add('show'));
    later(()=>{
      const st = $('testStage');
      if(st.scrollHeight > st.clientHeight + 4) st.scrollTo({ top: st.scrollHeight, behavior:'smooth' });
    }, 320);
    T.locked = 'fb';
  }, fbDelay);
}

function nextQuestion(){
  if(T.locked !== 'fb') return;
  T.locked = true;
  if(T.i+1 >= T.qs.length){ showResult(); return; }
  qWrap.classList.remove('entering');
  qWrap.classList.add('leaving');
  later(()=>{ T.i++; renderQuestion(); }, 380);
}

document.addEventListener('keydown', (e)=>{
  if(!isActive('test')) return;
  if(testResult.classList.contains('show')) return;
  if(['1','2','3','4'].includes(e.key) && T.locked===false){ answer(Number(e.key)-1); }
  else if((e.key==='Enter' || e.key===' ' || e.key==='ArrowRight') && T.locked==='fb'){ e.preventDefault(); nextQuestion(); }
});

/* --- result --- */
function showResult(){
  const N = T.qs.length;
  const pct = Math.round(T.correct / N * 100);
  $('rsOf').textContent = '／ '+N+' 問';
  $('rsKicker').textContent = '第'+numToKanji(T.round.id)+'回　'+(T.review?'おさらい':'テスト')+' 結果';
  let comment = '';
  if(pct===100) comment = '全問正解！お見事です。';
  else if(pct>=90) comment = 'ほぼ完璧。あと一歩！';
  else if(pct>=70) comment = 'いい調子。もう一息です。';
  else if(pct>=50) comment = '半分は越えました。復習しましょう。';
  else comment = 'まずは学習でおさらいしよう。';
  $('rsComment').textContent = comment;
  $('rsPct').textContent = '正答率 '+pct+' ％　／　最高連続正解 '+T.best;

  const wrongBox = $('rsWrongBox'), wrongEl = $('rsWrong');
  wrongEl.innerHTML = '';
  if(T.wrong.length){
    wrongBox.style.display = '';
    T.wrong.forEach((x,k)=>{
      const row = document.createElement('div');
      row.className = 'wi'; row.style.setProperty('--wd', (0.9+k*0.07).toFixed(2)+'s');
      row.innerHTML = '<b>'+x.w+'</b><span>'+x.m+'</span>';
      wrongEl.appendChild(row);
    });
    $('rsRetryWrong').style.display = '';
  } else {
    wrongBox.style.display = 'none';
    $('rsRetryWrong').style.display = 'none';
  }

  $('rsNum').textContent = '0';
  const fg = $('rsFg');
  fg.style.transition = 'none'; fg.style.strokeDashoffset = '1'; void fg.getBoundingClientRect(); fg.style.transition = '';
  testResult.classList.add('show');
  requestAnimationFrame(()=>{ fg.style.strokeDashoffset = String(1 - T.correct/N); });

  // count-up
  const t0 = performance.now(), dur = 1300, target = T.correct;
  (function tick(now){
    const p = Math.min(1, (now - t0 - 350)/dur);
    if(p > 0) $('rsNum').textContent = String(Math.round(target * (1 - Math.pow(1-p,3))));
    if(p < 1) requestAnimationFrame(tick); else $('rsNum').textContent = String(target);
  })(performance.now());

  if(pct >= 90) burstPetals();
}
function burstPetals(){
  for(let i=0;i<30;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random()*100)+'%';
    p.style.animationDuration = (3.2+Math.random()*2.6)+'s';
    p.style.animationDelay = (0.4+Math.random()*1.4)+'s';
    p.style.setProperty('--dr', (Math.random()*160-80)+'px');
    p.style.width = p.style.height = (9+Math.random()*10)+'px';
    testResult.appendChild(p);
    setTimeout(()=>p.remove(), 8000);
  }
}

$('rsRetryAll').addEventListener('click', ()=> startTest(T.round.id));
$('rsRetryWrong').addEventListener('click', ()=> startTest(T.round.id, T.wrong.map(x=>x.key)));
$('rsToStudy').addEventListener('click', ()=>{ testResult.classList.remove('show'); openStudy(T.round.id); });
$('rsToRounds').addEventListener('click', ()=>{ testResult.classList.remove('show'); clearTestTimers(); showScreen('rounds'); });
$('backFromTest').addEventListener('click', ()=>{ testResult.classList.remove('show'); backToMode(); });

/* ---------- init ---------- */
// 画面外のはみ出しで外枠が勝手にスクロールしないように固定
const appEl = $('app');
appEl.addEventListener('scroll', ()=>{ if(appEl.scrollTop || appEl.scrollLeft) appEl.scrollTo(0,0); });
buildRoundGrid();
</script>
