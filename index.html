 {w:"ねんず", pos:"動（サ変）", mean:"祈る・念じる／我慢する", expl:"『念ず』の字を当て、心の中で強く願う、または堪え忍ぶ様子を表す。", mne:"『念（ねん）ず』＝念じる＝祈る、我慢もその延長と覚える。", senses:[{m:"祈る・念じる",ex:[{t:"仏に[[ねんじ]]て、無事を祈る。",tr:"仏に念じて、無事を祈る。"},{t:"仏を[[ねんじ]]て、船出す。",tr:"仏に念じて、船出する。"},{t:"神に[[ねんじ]]申して、病を癒さむとす。",tr:"神に祈り申し上げて、病を治そうとする。"}]},{m:"我慢する・こらえる",ex:[{t:"痛みを[[ねんじ]]て、堪へ忍ぶ。",tr:"痛みを我慢して、堪え忍ぶ。"},{t:"痛みを[[ねんじ]]て、物も言はず。",tr:"痛みを我慢して、物も言わない。"},{t:"悲しさを[[ねんじ]]て、笑みを作る。",tr:"悲しさをこらえて、笑顔を作る。"}]}]},
 {w:"～のがり（がり）", pos:"連語", mean:"～のもとへ", expl:"人を表す語に付いて、その人のいる場所への方向を示す。", mne:"『のがり』＝『の（もとへ）＋あり』の意、と訪問先を示す語として覚える。", senses:[{m:"～のもとへ",ex:[{t:"人の[[がり]]言ふべき事ありて文をやるとて",tr:"人のもとへ言わなければならないことがあって手紙をやるというので",s:"徒然草（第三十一段）"},{t:"友の[[がり]]行きて、文を渡す。",tr:"友のもとへ行って、手紙を渡す。"},{t:"姫の[[がり]]、文を遣る。",tr:"姫のもとへ、手紙を送る。"}]}]},
 {w:"のたまふ", pos:"動（四段）", mean:"おっしゃる（尊敬）", expl:"『言ふ』の尊敬語で、貴人の発言を敬って表す代表的な敬語動詞。", mne:"『言ふ』の尊敬語として『言ふ→のたまふ』と対応させて覚える。", senses:[{m:"おっしゃる",ex:[{t:"一筆[[のたまは]]せぬほどの",tr:"一筆おっしゃらないほどの",s:"徒然草（第三十一段）"},{t:"帝、かくなむ[[のたまふ]]。",tr:"帝は、このようにおっしゃる。"},{t:"宮、かくぞ[[のたまふ]]。",tr:"宮は、このようにおっしゃる。"}]}]},
 {w:"ののしる", pos:"動（四段）", mean:"大声で騒ぐ・評判になる", expl:"現代語『罵る（悪口を言う）』とは異なり、単に大声で騒ぎ立てる、または世間で評判になる意味を表す。", mne:"現代語との意味ずれに注意し、まず『大騒ぎする』を覚える。", senses:[{m:"大声で騒ぐ",ex:[{t:"人々[[ののしり]]さわぎて、夜も明けぬ。",tr:"人々が大声で騒いで、夜も明けてしまった。"},{t:"子ども、庭に出でて[[ののしる]]。",tr:"子どもたちが、庭に出て大声で騒ぐ。"},{t:"祭りの日、人々[[ののしり]]あへり。",tr:"祭りの日、人々が大声で騒ぎ合っている。"}]},{m:"評判になる・名高い",ex:[{t:"世に[[ののしる]]高名の僧なり。",tr:"世間で評判の高名な僧である。"},{t:"その名世に[[ののしる]]歌人なり。",tr:"その名が世に評判の歌人である。"},{t:"都に[[ののしる]]美女なり。",tr:"都で評判の美女である。"}]}]},
 {w:"はかなし", pos:"形", mean:"頼りない・むなしい・ちょっとした", expl:"『はか（目安・成果）』が『無し』で、頼りにならず、あっけなく消えてしまう様子を表す。", mne:"『はか（成果）が無し』＝手ごたえがない＝頼りない・むなしい、と覚える。", senses:[{m:"頼りない・むなしい",ex:[{t:"夢よりも[[はかなき]]世の中を",tr:"夢よりもはかない（頼りない）男女の仲を",s:"和泉式部日記"},{t:"いと[[ものはかなく]]",tr:"たいそう頼りなく",s:"蜻蛉日記"},{t:"[[はかなき]]世の中を、嘆く。",tr:"頼りないむなしい世の中を、嘆く。"}]},{m:"ちょっとした・取るに足りない",ex:[{t:"[[はかなき]]ことにも、人は涙す。",tr:"ちょっとしたことにも、人は涙を流す。"},{t:"[[はかなき]]戯れにも、涙ぐむ。",tr:"ちょっとした戯れにも、涙ぐむ。"},{t:"[[はかなき]]ことを、深く恨む。",tr:"取るに足りないことを、深く恨む。"}]}]},
 {w:"はかばかし", pos:"形", mean:"てきぱきしている・はっきりしている・頼りになる", expl:"物事が順調にはかどる様子、または頼りがいのある様子を表す。", mne:"『捗（はかど）る』と同源、『てきぱき進む』とつなげて覚える。", senses:[{m:"頼りになる・しっかりしている",ex:[{t:"[[はかばかしき]]後見しなければ",tr:"しっかりした後見人がいないので",s:"源氏物語（桐壺）"},{t:"[[はかばかしき]]後見もなく、心細し。",tr:"頼りになる後見人もなく、心細い。"},{t:"[[はかばかしき]]返事もなくて、日を過ごす。",tr:"はっきりした返事もなくて、日を過ごす。"}]}]},
 {w:"はしたなし", pos:"形", mean:"きまりが悪い・中途半端だ・そっけない", expl:"どっちつかずで落ち着かない、居心地の悪い気まずさを表す。", mne:"『端（はした）』＝中途半端な端数、と考え『きまりが悪い』を導く。", senses:[{m:"きまりが悪い",ex:[{t:"[[はしたなき]]もの。こと人を呼ぶに、我ぞとてさし出でたる。",tr:"きまりが悪いもの。別の人を呼んだのに、私のことかと思って出てきた。",s:"枕草子（はしたなきもの）"},{t:"人の中にて恥をかき、[[はしたなく]]思ふ。",tr:"人の中で恥をかいて、きまり悪く思う。"},{t:"人前で転びて、[[はしたなく]]思ふ。",tr:"人前で転んで、きまり悪く思う。"}]},{m:"中途半端だ",ex:[{t:"[[はしたなき]]年ごろにて、子とも大人ともつかず。",tr:"中途半端な年頃で、子どもとも大人ともつかない。"},{t:"[[はしたなき]]数にて、使ひにくし。",tr:"中途半端な数で、使いにくい。"},{t:"[[はしたなく]]言葉を切りて、立ち去る。",tr:"中途半端に言葉を切って、立ち去る。"}]},{m:"そっけない・無愛想だ",ex:[{t:"[[はしたなく]]言ひ放ちて立ちぬ。",tr:"そっけなく言い放って立ち去った。"},{t:"[[はしたなく]]答へて、人を怒らす。",tr:"そっけなく答えて、人を怒らせる。"},{t:"[[はしたなき]]もてなしに、客も帰りぬ。",tr:"そっけないもてなしに、客も帰った。"}]}]},
 {w:"はづかし", pos:"形", mean:"（こちらが気後れするほど）立派だ／恥ずかしい", expl:"相手が優れすぎていて、こちらが気後れするような立派さを表す用法が重要。", mne:"『相手が立派すぎて自分が恥ずかしくなる』という発想の転換で覚える。", senses:[{m:"立派だ（こちらが気後れするほど）",ex:[{t:"[[はづかしき]]人の前にて、物も言はれず。",tr:"気後れするほど立派な人の前で、物も言えない。"},{t:"[[はづかしき]]師の前にて、手も震ふ。",tr:"気後れするほど立派な師の前で、手も震える。"},{t:"[[はづかしき]]人の目に、心して書く。",tr:"気後れするほど立派な人の目に、心して書く。"}]},{m:"恥ずかしい",ex:[{t:"人に見られて、いと[[はづかし]]。",tr:"人に見られて、とても恥ずかしい。"},{t:"人前に出でて、[[はづかし]]。",tr:"人前に出て、恥ずかしい。"},{t:"過ちを見られて、[[はづかしく]]思ふ。",tr:"過ちを見られて、恥ずかしく思う。"}]}]},
 {w:"はやく", pos:"副", mean:"以前に・かつて／なんと～だったのだなあ（気づき）", expl:"過去の出来事を指すほか、後に気づいた事実に対する感慨を表すこともある。", mne:"『早く』が『以前に』の意味になる古語用法、と現代語とのズレを意識する。", senses:[{m:"以前に・とっくに",ex:[{t:"[[はやく]]この家に住みし人なり。",tr:"以前にこの家に住んでいた人である。"},{t:"[[はやく]]この寺に住みし僧なり。",tr:"以前この寺に住んでいた僧である。"},{t:"[[はやく]]見し人にて、懐かしがる。",tr:"とっくに見知った人で、懐かしがる。"}]},{m:"実は～だったのだ（気づき）",ex:[{t:"見れば、[[はやく]]死にたる人なりけり。",tr:"見ると、なんと死んでいた人だったのだなあ。"},{t:"聞けば、[[はやく]]わが兄なりけり。",tr:"聞くと、なんと私の兄であったのだなあ。"},{t:"近づけば、[[はやく]]枯れ木なりけり。",tr:"近づくと、なんと枯れ木であったのだなあ。"}]}]},
 {w:"はべり", pos:"動（ラ変）", mean:"お仕えする（謙譲）／あります・ございます（丁寧）", expl:"『あり・をり』の丁寧語・謙譲語として非常に多用される最重要敬語動詞。", mne:"『侍（はべ）り』＝おそばに控える→丁寧に『あります』、と『さぶらふ』と同じ仲間で覚える。", senses:[{m:"お仕えする",ex:[{t:"宮の御前に[[はべる]]人々なり。",tr:"宮の御前にお仕えする人々である。"},{t:"宮に[[はべり]]て、年を経ぬ。",tr:"宮にお仕えして、年を経た。"},{t:"御前に[[はべる]]女房ども、笑ふ。",tr:"御前に控える女房たちが、笑う。"}]},{m:"あります・ございます（丁寧）",ex:[{t:"言葉をかけ[[侍り]]しを",tr:"言葉をかけましたところ",s:"徒然草（第百九段）"},{t:"いみじき骨は得て[[はべれ]]",tr:"すばらしい骨を手に入れております",s:"枕草子（中納言参りたまひて）"},{t:"かく申す者は、都の者にて[[はべり]]。",tr:"こう申す者は、都の者でございます。"}]}]},
 {w:"ひがごと", pos:"名", mean:"間違ったこと・道理に外れたこと", expl:"『僻（ひが）事』の字を当て、正しくない、ひねくれたことを指す。", mne:"『僻（ひが）む』の『僻』＝ひねくれ＝間違い、と漢字から覚える。", senses:[{m:"間違ったこと・道理に外れたこと",ex:[{t:"人の[[ひがごと]]をば、笑ふべからず。",tr:"人の間違いを、笑ってはならない。"},{t:"[[ひがごと]]を言ひて、人に笑はる。",tr:"間違ったことを言って、人に笑われる。"},{t:"己が[[ひがごと]]を悟りて、恥づ。",tr:"自分の間違いを悟って、恥じる。"}]}]},

 {w:"びんなし", pos:"形", mean:"不都合だ・都合が悪い・気の毒だ", expl:"『便（びん）無し』で、都合が悪く具合の良くない様子を表す。", mne:"『便（びん）』が『無し』＝都合が無い＝不都合、と漢字構成で覚える。", senses:[{m:"不都合だ・具合が悪い",ex:[{t:"[[びんなき]]ことなれば、人に語らず。",tr:"不都合なことなので、人に語らない。"},{t:"[[びんなき]]ことにて、人に告げず。",tr:"都合の悪いことで、人に告げない。"},{t:"[[びんなく]]思ひて、断りぬ。",tr:"不都合だと思って、断った。"}]},{m:"気の毒だ・かわいそうだ",ex:[{t:"[[びんなく]]思ひて、衣を与ふ。",tr:"気の毒に思って、着物を与える。"},{t:"親なき子を見て、[[びんなし]]と思ふ。",tr:"親のない子を見て、気の毒だと思う。"},{t:"[[びんなき]]身の上を聞き、涙ぐむ。",tr:"気の毒な身の上を聞き、涙ぐむ。"}]}]},
 {w:"ふ（経）", pos:"動（下二段）", mean:"（時が）経過する", expl:"時間が過ぎ去っていくことを表す動詞。", mne:"『経（ふ）』＝『経過』の『経』、と漢字一字から時間の経過を覚える。", senses:[{m:"（時が）経過する・過ごす",ex:[{t:"世に[[経る]]人ありけり",tr:"世に過ごしている人がいた",s:"蜻蛉日記"},{t:"多くの年を[[へ]]て、故郷に帰る。",tr:"多くの年月を経て、故郷に帰る。"},{t:"年月[[へ]]て、故郷に帰る。",tr:"年月が経って、故郷に帰る。"}]}]},

 {w:"ふみ", pos:"名", mean:"手紙／書物・漢籍", expl:"『文（ふみ）』の字が示す通り、手紙のほか学問的な書物・漢文の書を指す。", mne:"『文（ふみ）』＝文字で書かれたもの全般＝手紙・書物、と覚える。", senses:[{m:"手紙",ex:[{t:"恋しき人の[[ふみ]]を、いくたびも読む。",tr:"恋しい人の手紙を、何度も読む。"},{t:"人の[[ふみ]]を、懐に入る。",tr:"人の手紙を、懐に入れる。"},{t:"[[ふみ]]を書きて、使ひに持たす。",tr:"手紙を書いて、使いに持たせる。"}]},{m:"書物・漢籍",ex:[{t:"夜ごと[[ふみ]]を読みて、学びたまふ。",tr:"毎晩書物を読んで、学びなさる。"},{t:"[[ふみ]]読む人、世に少なし。",tr:"書物を読む人は、世に少ない。"},{t:"昼は[[ふみ]]を読み、夜は琴を弾く。",tr:"昼は書物を読み、夜は琴を弾く。"}]}]},
 {w:"ふる（旧る・触る・震る）", pos:"動", mean:"年を取る・古くなる／触れる／震える", expl:"同音で複数の意味を持つ語で、文脈により『古びる』『触れる』『震える』を判断する。", mne:"『古（ふ）る』＝時が経って古くなる、を基本義として覚える。", senses:[{m:"古くなる・年を取る",ex:[{t:"松柏年[[古り]]",tr:"松や柏が年を経て古び",s:"奥の細道（立石寺）"},{t:"[[ふり]]にし宿に、人の来たる。",tr:"古くなった家に、人が来た。"},{t:"[[ふり]]にし里に、人も訪はず。",tr:"古くなった里に、人も訪れない。"}]},{m:"触れる",ex:[{t:"袖に[[ふれ]]し人の香ぞする。",tr:"袖に触れた人の香りがする。"},{t:"花に手[[ふれ]]て、香を移す。",tr:"花に手を触れて、香を移す。"},{t:"衣に露の[[ふる]]。",tr:"衣に露が触れる。"}]},{m:"震える",ex:[{t:"寒さに身の[[ふるふ]]。",tr:"寒さに身が震える。"},{t:"寒さに手の[[ふるふ]]。",tr:"寒さに手が震える。"},{t:"恐ろしさに声[[ふるひ]]て、物も言はず。",tr:"恐ろしさに声が震えて、物も言わない。"}]}]},
 {w:"ほい", pos:"名", mean:"本来の意志・本望・かねての願い", expl:"『本意（ほい）』の字を当て、もともと抱いていた願いや意図を指す。", mne:"『本意（ほんい）』の音が変化した語、と漢字から意味をつかむ。", senses:[{m:"本来の願い・本望",ex:[{t:"神へ参るこそ[[本意]]なれと思ひて",tr:"神へ参ることこそ本来の目的であると思って",s:"徒然草（第五十二段）"},{t:"年ごろの[[ほい]]を遂げて、出家す。",tr:"長年の本望を遂げて、出家する。"},{t:"[[ほい]]なくて、家に帰りぬ。",tr:"本望を遂げられずに、家に帰った。"}]}]},
 {w:"ほど", pos:"名", mean:"時間・距離・年齢・程度・身分", expl:"様々な『程合い』を広く指す多義語で、文脈に応じて訳し分けが必要。", mne:"『程（ほど）』は『どれくらいか』を表す万能語、と広く捉えて覚える。", senses:[{m:"時間・ころ",ex:[{t:"この児、養ふ[[ほど]]に、すくすくと大きになりまさる",tr:"この子を養ううちに、すくすくと大きく成長していく",s:"竹取物語"},{t:"丹後に下りける[[ほど]]に",tr:"丹後に下っていた間に",s:"十訓抄（大江山）"},{t:"しばしの[[ほど]]に、日暮れぬ。",tr:"わずかな間に、日が暮れた。"}]},{m:"距離・隔たり",ex:[{t:"都までは、遠き[[ほど]]なり。",tr:"都までは、遠い道のりである。"},{t:"山の麓まで、いと遠き[[ほど]]なり。",tr:"山の麓まで、たいそう遠い道のりである。"},{t:"家と寺とは、近き[[ほど]]なり。",tr:"家と寺とは、近い距離である。"}]},{m:"年齢",ex:[{t:"[[ほど]]よりは大人びたる人なり。",tr:"年齢のわりには大人びた人である。"},{t:"年の[[ほど]]二十ばかりの女なり。",tr:"年のころ二十ほどの女である。"},{t:"[[ほど]]よりは、いたく老いて見ゆ。",tr:"年齢のわりには、ひどく老けて見える。"}]},{m:"身分・程度",ex:[{t:"比叡の山を二十ばかり重ね上げたらむ[[ほど]]して",tr:"比叡山を二十ほど重ね上げたくらいの高さで",s:"伊勢物語（東下り）"},{t:"[[ほど]]に応じて、衣を調ふ。",tr:"身分に応じて、衣装を整える。"},{t:"身の[[ほど]]知らぬ振る舞ひをす。",tr:"身分をわきまえない振る舞いをする。"}]}]},
 {w:"まいて", pos:"副", mean:"まして・なおさら", expl:"前の事柄と比較して、さらに程度が強まることを表す副詞。", mne:"『まして』の古い形とそのまま対応させて覚える。", senses:[{m:"まして・なおさら",ex:[{t:"[[まいて]]雁などのつらねたるが、いと小さく見ゆるは",tr:"ましてや雁などが連なっているのが、たいそう小さく見えるのは",s:"枕草子（春はあけぼの・秋）"},{t:"聞きしよりも[[まして]]、言ふかひなくぞこぼれ破れたる",tr:"聞いていたよりもまして、言いようもなく壊れ傷んでいる",s:"土佐日記"},{t:"子ひとり失ひて悲し。[[まいて]]二人失はば、いかばかりぞ。",tr:"子ひとりを失っても悲しい。まして二人を失ったら、どれほどだろう。"}]}]},
 {w:"まうく", pos:"動（下二段）", mean:"準備する・用意する", expl:"何かのために前もって物事を整えておくことを表す。", mne:"『設（まう）く』＝『設置』の『設』、と漢字から『準備』を覚える。", senses:[{m:"準備する・用意する",ex:[{t:"客人のために、饗を[[まうけ]]たり。",tr:"客人のために、ご馳走を用意した。"},{t:"客のために酒を[[まうけ]]たり。",tr:"客のために酒を用意した。"},{t:"旅の用意を[[まうく]]。",tr:"旅の準備をする。"}]}]},
 {w:"まうづ", pos:"動（下二段）", mean:"参上する・参詣する（謙譲）", expl:"目上の人のもとや神社仏閣へ出向くことをへりくだって表す謙譲語。", mne:"『詣（まう）づ』＝『初詣』の『詣』、と漢字から『参詣する』を覚える。", senses:[{m:"参上する・参詣する",ex:[{t:"ただひとり、徒歩より[[まうで]]けり",tr:"ただ一人で、徒歩で参詣したのだった",s:"徒然草（第五十二段）"},{t:"初瀬の寺に[[まうで]]て、祈る。",tr:"初瀬の寺に参詣して、祈る。"},{t:"宮に[[まうで]]て、事を申す。",tr:"宮に参上して、事を申し上げる。"}]}]},
 {w:"まかる", pos:"動（四段）", mean:"退出する（謙譲）", expl:"貴人の御前から下がる、また地方などへ出て行くことをへりくだって表す。", mne:"『罷（まか）る』＝『罷免』の『罷』、貴人の前から『退く』と覚える。", senses:[{m:"退出する",ex:[{t:"御前より[[まかり]]て、家に帰る。",tr:"御前から退出して、家に帰る。"},{t:"御前を[[まかり]]て、局に入る。",tr:"御前を退出して、局に入る。"},{t:"暇を賜りて、[[まかり]]出づ。",tr:"暇を賜って、退出する。"}]}]},
 {w:"まくらことば（修辞法）", pos:"名（修辞法）", mean:"枕詞（特定の語の前に置かれる五音の修飾語）", expl:"特定の語を導くために置かれる、意味よりも音や語調を整える修辞技法。", mne:"『あしひきの→山』のように決まった語を導く『枕』の言葉、と覚える。", senses:[{m:"特定の語を導く五音の修飾語",ex:[{t:"「あしひきの」を山に冠するは、[[まくらことば]]なり。",tr:"「あしひきの」を「山」にかぶせるのは、枕詞である。"},{t:"「ひさかたの」は光にかかる[[まくらことば]]なり。",tr:"「ひさかたの」は「光」にかかる枕詞である。"},{t:"歌の調べを整ふる[[まくらことば]]あり。",tr:"歌の調子を整える枕詞がある。"}]}]},
 {w:"まさなし", pos:"形", mean:"よくない・道理に合わない・見苦しい", expl:"正しくない、あるいは体裁が悪いことを表す評価語。", mne:"『正（まさ）無し』＝正しくない、と漢字から否定的評価を覚える。", senses:[{m:"よくない・見苦しい",ex:[{t:"[[まさなき]]こともあり",tr:"見苦しいこともある",s:"源氏物語（桐壺）"},{t:"[[まさなき]]振る舞ひをば、人も笑ふ。",tr:"よくない振る舞いを、人も笑う。"},{t:"[[まさなき]]言葉を口にして、人に咎めらる。",tr:"よくない言葉を口にして、人に咎められる。"}]}]},
 {w:"まな", pos:"名", mean:"漢字・漢文（真名）", expl:"『真名』の字を当て、漢字・漢文を指す。仮名（かな）に対する語で、『まなの書』などと使われる。", mne:"『真名（まな）』＝正式な（本物の）文字＝漢字、『仮名（かな）』＝仮の文字、と対で覚える。", senses:[{m:"漢字・漢文（真名）",ex:[{t:"[[まな]]にて書ける文は、女の読みがたし。",tr:"漢字で書かれた手紙は、女性には読みにくい。"},{t:"[[まな]]にて書きたる書を読む。",tr:"漢字で書いた書物を読む。"},{t:"女は[[まな]]を学ぶべからずといふ世なり。",tr:"女は漢字を学ぶべきでないという世である。"}]}]},
 {w:"まほなり", pos:"形動", mean:"完全だ・きちんとしている", expl:"欠けたところがなく整っている様子を表す。", mne:"『真秀（まほ）なり』＝『真（まこと）に秀でている』＝完全、と覚える。", senses:[{m:"完全だ・整っている",ex:[{t:"[[まほなる]]姿にて、少しの欠けもなし。",tr:"完全に整った姿で、少しの欠点もない。"},{t:"[[まほなる]]御手にて、書きたまふ。",tr:"整った見事なお手で、お書きになる。"},{t:"[[まほに]]見えぬ月の影なり。",tr:"完全には見えない月の光である。"}]}]},

 {w:"まめまめし（まめやかなり）", pos:"形", mean:"まじめだ・誠実だ・実用的だ", expl:"『まめ』を重ねて強めた語で、浮ついたところのない実直さや実用性を表す。", mne:"現代語『まめに働く』の『まめ』を強めた形、と覚える。", senses:[{m:"まじめだ・誠実だ",ex:[{t:"[[まめまめしく]]仕へて、主の信頼を得たり。",tr:"まじめに実直に仕えて、主の信頼を得た。"},{t:"[[まめまめしく]]学びて、師に認めらる。",tr:"まじめに学んで、師に認められる。"},{t:"[[まめまめしき]]心ばへの人なり。",tr:"誠実な心づかいの人である。"}]},{m:"実用的だ",ex:[{t:"[[まめまめしき]]贈り物に、人々喜ぶ。",tr:"実用的な贈り物に、人々は喜ぶ。"},{t:"[[まめまめしき]]品を選びて、贈る。",tr:"実用的な品を選んで、贈る。"},{t:"[[まめまめしく]]役立つ道具なり。",tr:"実際によく役立つ道具である。"}]}]},
 {w:"まもる", pos:"動（四段）", mean:"じっと見守る・じっと見つめる", expl:"現代語『守る（保護する）』よりも、視線を離さずじっと見つめる意味が中心。", mne:"『目守（まも）る』＝目を離さず見つめる、と漢字から本義を覚える。", senses:[{m:"じっと見つめる・見守る",ex:[{t:"子の寝顔を[[まもり]]て、夜を明かす。",tr:"子の寝顔をじっと見つめて、夜を明かす。"},{t:"空を[[まもり]]て、動かず。",tr:"空をじっと見つめて、動かない。"},{t:"病む子の顔を[[まもる]]。",tr:"病む子の顔を見守る。"}]}]},
 {w:"まらうど", pos:"名", mean:"客人", expl:"よそから訪れてきた客を指す語。", mne:"『客人（まろうど）』の古い読み、と現代語の名残から覚える。", senses:[{m:"客人",ex:[{t:"遠き国より[[まらうど]]来たりぬ。",tr:"遠い国から客人が来た。"},{t:"[[まらうど]]を座に請じて、酒を勧む。",tr:"客人を座に招いて、酒を勧める。"},{t:"山の寺に[[まらうど]]の来たる。",tr:"山の寺に客人が来た。"}]}]},
 {w:"まゐる", pos:"動（四段）", mean:"参上する（謙譲）／召し上がる・お乗りになる（尊敬）", expl:"貴人のもとへ行く謙譲語のほか、『食ふ・飲む・着る』などの尊敬語としても使われる。", mne:"『参（まゐ）る』は基本は謙譲だが、『召し上がる』の尊敬用法もあると覚える。", senses:[{m:"参上する（謙譲）",ex:[{t:"宮に[[まゐる]]。",tr:"宮のもとへ参上する。"},{t:"宮の御前に[[まゐる]]。",tr:"宮の御前に参上する。"},{t:"院に[[まゐり]]て、事を申す。",tr:"院のもとに参上して、事を申し上げる。"}]},{m:"召し上がる（尊敬）",ex:[{t:"帝、御粥を[[まゐり]]たまふ。",tr:"帝は、お粥を召し上がる。"},{t:"宮、御酒を[[まゐる]]。",tr:"宮は、お酒を召し上がる。"},{t:"姫君、果物を[[まゐり]]たまふ。",tr:"姫君は、果物を召し上がる。"}]}]},
 {w:"みそかなり", pos:"形動", mean:"こっそりと・ひそかだ", expl:"人目を避けてひそかに物事を行う様子を表す。", mne:"『密（みそ）かなり』＝『密か』とほぼ同じ漢字・意味で覚えやすい。", senses:[{m:"こっそり・ひそかだ",ex:[{t:"[[みそかに]]通ひて、人に知らせず。",tr:"こっそり通って、人に知らせない。"},{t:"[[みそかに]]家を出でて、野に遊ぶ。",tr:"こっそり家を出て、野に遊ぶ。"},{t:"[[みそかなる]]文を、人に託す。",tr:"ひそかな手紙を、人に託す。"}]}]},
 {w:"みゆ", pos:"動（下二段）", mean:"見える・姿を見せる／結婚する", expl:"自然に目に入る意味のほか、女性のもとに男性が姿を見せる＝結婚を表す用法がある。", mne:"『見ゆ』は基本『見える』、恋愛文脈では『結婚する』に転じると覚える。", senses:[{m:"見える",ex:[{t:"京には[[見え]]ぬ鳥なれば、みな人見知らず",tr:"京には見られない鳥なので、誰も見知らない",s:"伊勢物語（東下り）"},{t:"いとよくありさま[[見ゆ]]",tr:"たいそうよく様子が見える",s:"土佐日記"},{t:"遠き山の端に、月の[[みゆ]]。",tr:"遠くの山の端に、月が見える。"}]},{m:"（男女が）結ばれる・結婚する",ex:[{t:"女、男に[[みえ]]て、契りを交はす。",tr:"女が男と結ばれて、契りを交わす。"},{t:"男、女に[[みえ]]て、年を経ぬ。",tr:"男が女と結ばれて、年を経た。"},{t:"親の許さぬ男に[[みえ]]けり。",tr:"親が許さない男と結ばれたのだった。"}]}]},
 {w:"むくつけし", pos:"形", mean:"気味が悪い・恐ろしい", expl:"不気味で恐怖を感じさせる様子を表す形容詞。", mne:"語感そのままに『不気味・気味悪い』と丸ごと覚える。", senses:[{m:"気味が悪い・恐ろしい",ex:[{t:"[[むくつけき]]物の影、庭に立つ。",tr:"気味の悪い物の影が、庭に立っている。"},{t:"[[むくつけき]]声して、人を呼ぶ。",tr:"気味の悪い声がして、人を呼ぶ。"},{t:"夜の森の[[むくつけく]]思はる。",tr:"夜の森が恐ろしく思われる。"}]}]},
 {w:"むげなり", pos:"形動", mean:"ひどい・論外だ・むやみだ", expl:"『無下（むげ）なり』の字を当て、程度がはなはだしく良くない様子を表す。", mne:"現代語『無下に扱う』の『無下』と同語源、『ひどい』と覚える。", senses:[{m:"ひどい・あんまりだ",ex:[{t:"[[むげなる]]仕打ちを受けて、泣き伏す。",tr:"ひどい仕打ちを受けて、泣き伏す。"},{t:"[[むげなる]]言葉を投げられ、涙ぐむ。",tr:"ひどい言葉を投げられて、涙ぐむ。"},{t:"親を捨つるは、[[むげなる]]ことなり。",tr:"親を捨てるのは、あんまりなことだ。"}]},{m:"むやみだ・ひどく",ex:[{t:"[[むげに]]幼き子なれば、いかが育てむ。",tr:"むやみに幼い子なので、どう育てようか。"},{t:"[[むげに]]酔ひて、前後も知らず。",tr:"むやみに酔って、前後も分からない。"},{t:"[[むげに]]疲れて、歩きがたし。",tr:"ひどく疲れて、歩きにくい。"}]}]},
 {w:"むつかし", pos:"形", mean:"うっとうしい・気味が悪い・わずらわしい", expl:"現代語『難しい（困難）』とは異なり、不快でうっとうしい感情を表す。", mne:"現代語との意味ずれに注意し、『うっとうしい・不快』を第一に覚える。", senses:[{m:"うっとうしい・不快だ",ex:[{t:"雨降り続きて、[[むつかしき]]ほどなり。",tr:"雨が降り続いて、うっとうしい頃である。"},{t:"梅雨の空、[[むつかしく]]曇れり。",tr:"梅雨の空が、うっとうしく曇っている。"},{t:"[[むつかしき]]客の来て、帰らず。",tr:"うっとうしい客が来て、帰らない。"}]},{m:"気味が悪い・不安だ",ex:[{t:"夜の山道、[[むつかしく]]思ひて急ぐ。",tr:"夜の山道を気味悪く思って、急ぐ。"},{t:"[[むつかしき]]夢を見て、目覚めぬ。",tr:"気味の悪い夢を見て、目が覚めた。"},{t:"暗き山道、[[むつかしく]]思ふ。",tr:"暗い山道を、不安に思う。"}]},{m:"わずらわしい・面倒だ",ex:[{t:"[[むつかしき]]事を頼まるるが苦し。",tr:"面倒なことを頼まれるのがつらい。"},{t:"[[むつかしき]]手続きに、人は倦む。",tr:"面倒な手続きに、人は飽きる。"},{t:"諸々の用、[[むつかし]]。",tr:"さまざまな用事が、わずらわしい。"}]}]},
 {w:"むなしくなる", pos:"連語", mean:"亡くなる（死ぬことの婉曲表現）", expl:"『空しくなる』で、命の火が消えこの世からいなくなることを婉曲に表す。", mne:"『空（むな）しくなる』＝存在が空になる＝死、と婉曲表現として覚える。", senses:[{m:"亡くなる",ex:[{t:"病重く、ついに[[むなしくなり]]たまひぬ。",tr:"病が重く、とうとうお亡くなりになった。"},{t:"大臣、[[むなしくなり]]たまひぬ。",tr:"大臣は、お亡くなりになった。"},{t:"病にて、[[むなしくなる]]人多し。",tr:"病気で、亡くなる人が多い。"}]}]},
 {w:"めざまし", pos:"形", mean:"心外だ（意外で不快）／すばらしい（意外なほど）", expl:"『目覚まし』の字が示す通り、はっと目が覚めるほど意外な様子を、良悪どちらにも使う。", mne:"『目が覚めるほど意外』が基本で、文脈次第で『心外』にも『すばらしい』にもなると覚える。", senses:[{m:"心外だ・気にくわない",ex:[{t:"[[めざましき]]ものにおとしめそねみたまふ",tr:"心外な者として見下しねたみなさる",s:"源氏物語（桐壺）"},{t:"身分低き者に侮らるるは、[[めざまし]]。",tr:"身分の低い者に侮られるのは、心外だ。"},{t:"下の者に侮らるるは、いと[[めざまし]]。",tr:"目下の者に侮られるのは、たいそう心外だ。"}]},{m:"すばらしい・目を見張るほどだ",ex:[{t:"[[めざましき]]ほどの美しさなり。",tr:"目の覚めるほどの美しさである。"},{t:"[[めざましき]]手並みに、人々驚く。",tr:"目を見張るほどの腕前に、人々が驚く。"},{t:"[[めざましく]]舞ひて、座を沸かす。",tr:"見事に舞って、座を沸かせる。"}]}]},
 {w:"めづらし", pos:"形", mean:"すばらしい・新鮮だ・愛すべきだ", expl:"現代語『珍しい（希少）』よりも、新鮮で心惹かれる魅力を表すことが多い。", mne:"『愛（め）づ』（愛でる）＋『らし』＝愛でたくなる＝すばらしい、と語源で覚える。", senses:[{m:"新鮮だ・珍しい",ex:[{t:"[[めづらしき]]さまにもありなむ",tr:"珍しい様子でもあるだろう",s:"蜻蛉日記"},{t:"春来て、[[めづらしき]]鳥の声を聞く。",tr:"春が来て、新鮮な鳥の声を聞く。"},{t:"初物の[[めづらしき]]を、人に分かつ。",tr:"初物の新鮮なのを、人に分ける。"}]},{m:"すばらしい・愛すべきだ",ex:[{t:"[[めづらしき]]御かたちにて、見る人皆愛づ。",tr:"すばらしいお姿で、見る人は皆賞賛する。"},{t:"[[めづらしき]]舞ひに、人々見惚る。",tr:"すばらしい舞に、人々が見とれる。"},{t:"[[めづらしく]]美しき花の色なり。",tr:"愛すべきほど美しい花の色である。"}]}]},
 {w:"めでたし", pos:"形", mean:"すばらしい・立派だ", expl:"現代語『めでたい（祝い事）』よりも広く、称賛すべき見事さ全般を表す。", mne:"『愛（め）づ』＋『甚（いた）し』＝愛でる気持ちが甚だしい＝すばらしい、と覚える。", senses:[{m:"すばらしい・立派だ",ex:[{t:"[[めでたき]]もの。唐錦。飾り太刀。",tr:"すばらしいもの。唐錦。飾り太刀。",s:"枕草子（めでたきもの）"},{t:"桜の[[めでたく]]咲きたりけるに",tr:"桜がすばらしく咲いていたところ",s:"宇治拾遺物語（田舎の児）"},{t:"[[めでたき]]御幸なり。",tr:"すばらしい行幸である。"}]}]},
 {w:"めのと", pos:"名", mean:"乳母", expl:"実母に代わって子に乳を与え養育する女性を指す。", mne:"『め（女）の（の）と（人）』＝乳をやる女性＝乳母、と覚える。", senses:[{m:"乳母",ex:[{t:"大弐の[[乳母]]のいたくわづらひて",tr:"大弐の乳母がひどく患って",s:"源氏物語（夕顔）"},{t:"[[めのと]]、若君を抱きて参る。",tr:"乳母が、若君を抱いて参上する。"},{t:"[[めのと]]、幼き君に乳を参らす。",tr:"乳母が、幼い君に乳を差し上げる。"}]}]},
 {w:"めやすし", pos:"形", mean:"感じがよい・見た目に感じがよい", expl:"『目安し』の字を当て、見た目に不快感がなく好ましい様子を表す。", mne:"『目』に『安（やす）し』＝見て安心できる＝感じがよい、と漢字で覚える。", senses:[{m:"感じがよい・見苦しくない",ex:[{t:"[[めやすき]]人柄にて、誰にも好まる。",tr:"感じのよい人柄で、誰からも好かれる。"},{t:"[[めやすき]]装ひにて、宮に参る。",tr:"感じのよい装いで、宮中に参上する。"},{t:"[[めやすく]]もてなして、人に好かる。",tr:"感じよく振る舞って、人に好かれる。"}]}]},
]},
{id:16, words:[
 {w:"～もがな（てしが・にしが）", pos:"終助", mean:"～があればなあ（願望）", expl:"体言や連用形などに付いて、実現を願う気持ちを表す終助詞。", mne:"『てしが・にしが』も同じ願望のグループとしてまとめて覚える。", senses:[{m:"～があればなあ（願望）",ex:[{t:"いかでこのかぐや姫を得[[てしが]]な",tr:"なんとかしてこのかぐや姫を妻にしたいものだ",s:"竹取物語"},{t:"友[[もがな]]、語らひてこの夜を明かさむ。",tr:"友がいればなあ。語り合ってこの夜を明かそう。"},{t:"あはれ、翼[[もがな]]、故郷へ飛ばむ。",tr:"ああ、翼があればなあ、故郷へ飛ぼう。"}]}]},
 {w:"もとより", pos:"副", mean:"はじめから・もちろん・元来", expl:"物事の最初から、あるいは当然のこととして、という意味を表す。", mne:"『本（もと）より』＝根本から、と漢字イメージで『はじめから』を覚える。", senses:[{m:"はじめから・もちろん",ex:[{t:"[[もとより]]友とする人、ひとりふたりして",tr:"もともと友としていた人、一人二人と一緒に",s:"伊勢物語（東下り）"},{t:"[[もとより]]知りたる事なり。",tr:"はじめから知っていたことである。"},{t:"[[もとより]]かかる世と知りたり。",tr:"はじめからこんな世だと知っていた。"}]}]},
 {w:"ものす", pos:"動（サ変）", mean:"いる・行く・する（さまざまな動詞の代用）", expl:"具体的な動詞を婉曲に言い換える際に使われる、文脈依存の代動詞。", mne:"『もの＋す』＝『何かをする』の万能代動詞、と便利さで覚える。", senses:[{m:"いる・来る・行く",ex:[{t:"宮、かしこに[[ものし]]たまふ。",tr:"宮は、あちらにいらっしゃる。"},{t:"宮、山の寺に[[ものし]]たまふ。",tr:"宮は、山の寺にいらっしゃる。"},{t:"人の家に[[ものす]]る折に、雨降りぬ。",tr:"人の家を訪れていた折に、雨が降った。"}]},{m:"する・書く・言う（動詞の代用）",ex:[{t:"かく文を[[ものし]]て、送りたまふ。",tr:"このように手紙を書いて、お送りになる。"},{t:"心を込めて文を[[ものし]]て、送る。",tr:"心を込めて手紙を書いて、送る。"},{t:"あやしき物を食らひ[[ものす]]。",tr:"変な物を食べる。"}]}]},
 {w:"やうやう", pos:"副", mean:"だんだん・しだいに", expl:"物事が徐々に変化していく様子を表す副詞。", mne:"現代語『ようやく』の語源だが意味は『だんだん』と覚える。", senses:[{m:"だんだん・しだいに",ex:[{t:"[[やうやう]]白くなりゆく山際",tr:"だんだん白くなっていく山際",s:"枕草子（第一段・冒頭）"},{t:"翁[[やうやう]]豊かになりゆく",tr:"翁はだんだん豊かになっていく",s:"竹取物語"},{t:"[[やうやう]]涼しき風のけはひに",tr:"だんだん涼しくなる風の様子に",s:"紫式部日記"}]}]},
 {w:"やがて", pos:"副", mean:"すぐに・そのまま", expl:"現代語『やがて（しばらくして）』とは異なり、時間差なく即座に、の意味が中心。", mne:"現代語との時間感覚のズレに注意し、『すぐに・間を置かず』を覚える。", senses:[{m:"すぐに",ex:[{t:"帰り来て、[[やがて]]出でたまふ。",tr:"帰ってきて、すぐにお出かけになる。"},{t:"客の来るを見て、[[やがて]]迎へに出づ。",tr:"客が来るのを見て、すぐに迎えに出る。"},{t:"文を読みて、[[やがて]]返事を書く。",tr:"手紙を読んで、すぐに返事を書く。"}]},{m:"そのまま",ex:[{t:"衣を[[やがて]]着て、寝たまふ。",tr:"着物をそのまま着て、お休みになる。"},{t:"旅の姿の[[やがて]]宮に参る。",tr:"旅の姿のまま宮中に参上する。"},{t:"着たる衣[[やがて]]臥しぬ。",tr:"着ていた衣のまま寝てしまった。"}]}]},
 {w:"やさし", pos:"形", mean:"つらい・恥ずかしい／優美だ・けなげだ", expl:"『痩さし』（身が痩せるほどつらい）が原義で、そこから『優美だ』の意味にも発展した。", mne:"現代語『優しい』とは違い、まず『つらい・恥ずかしい』の意味を覚える。", senses:[{m:"つらい・恥ずかしい",ex:[{t:"身も細るほど[[やさし]]と思ふ。",tr:"身も細るほどつらく恥ずかしいと思う。"},{t:"人目に立ちて、[[やさし]]と思ふ。",tr:"人目に立って、恥ずかしいと思う。"},{t:"身も細るやうに[[やさしく]]思ひぬ。",tr:"身も細るほどにつらく思った。"}]},{m:"優美だ・上品だ",ex:[{t:"[[やさしき]]心ばへの人なり。",tr:"優美でけなげな心がけの人である。"},{t:"[[やさしき]]歌を詠む女房なり。",tr:"優美な歌を詠む女房である。"},{t:"[[やさしく]]振る舞ひて、人に好かる。",tr:"優美に振る舞って、人に好かれる。"}]}]},
 {w:"やつす", pos:"動（四段）", mean:"目立たなくする・みすぼらしく姿を変える", expl:"身なりを地味にしたり、姿を変えて正体を隠すことを表す。", mne:"『やつれる』の他動詞形と考え、『わざと目立たなくする』と覚える。", senses:[{m:"目立たなくする・みすぼらしくする",ex:[{t:"身を[[やつし]]て、忍びて出でたまふ。",tr:"身をやつして、人目を忍んでお出かけになる。"},{t:"僧の姿に身を[[やつし]]て、旅す。",tr:"僧の姿に身をやつして、旅をする。"},{t:"[[やつし]]て出でたまふ君、いとあはれなり。",tr:"目立たぬ姿で出かけなさる君は、たいそうしみじみとした感じである。"}]}]},
 {w:"やまと", pos:"名", mean:"大和（日本の国、また奈良地方）", expl:"日本という国そのもの、または奈良地方を指す地名で、『やまとことば』などの複合語でも頻出する。", mne:"『大和（やまと）』＝日本の古い呼び名、と漢字からそのまま覚える。", senses:[{m:"日本・大和（奈良）",ex:[{t:"[[やまと]]歌は、人の心を種として",tr:"和歌は、人の心を種として",s:"古今和歌集（仮名序）"},{t:"唐の国より、[[やまと]]に渡り来たる。",tr:"唐の国から、日本に渡ってきた。"},{t:"[[やまと]]の国は、水清き国なり。",tr:"日本の国は、水の清い国である。"}]}]},
 {w:"やむごとなし", pos:"形", mean:"高貴だ・格別だ・捨て置けない", expl:"『止む事無し』が語源で、放っておけないほど重要・高貴な様子を表す。", mne:"『止（や）む事（こと）無し』＝そのままにできない＝格別、と語構成で覚える。", senses:[{m:"高貴だ・身分が高い",ex:[{t:"いと[[やむごとなき]]際にはあらぬが",tr:"それほど高貴な身分ではない方が",s:"源氏物語（桐壺）"},{t:"[[やむごとなき]]人の御子なり。",tr:"高貴な方のお子様である。"},{t:"[[やむごとなき]]宮の御子なり。",tr:"高貴な宮の御子である。"}]},{m:"格別だ・放っておけない",ex:[{t:"[[やむごとなき]]事ありて、参りがたし。",tr:"放っておけない大事なことがあって、参上しにくい。"},{t:"[[やむごとなき]]用ありて、参りがたし。",tr:"放っておけない用事があって、参上しにくい。"},{t:"[[やむごとなき]]大事を、人に任す。",tr:"重大な大事を、人に任せる。"}]}]},
 {w:"やる", pos:"動（四段）", mean:"（気持ちを）晴らす／行かせる・遣わす／遠くへ～する", expl:"心のもやもやを発散させる意味や、人や物を先方へ送る意味を持つ。", mne:"『心を晴らす』『人を遣わす』の二つの用法をセットで覚える。", senses:[{m:"（気持ちを）晴らす",ex:[{t:"心を[[やり]]て、野に遊ぶ。",tr:"気持ちを晴らして、野に遊ぶ。"},{t:"憂さを[[やる]]べく、野に遊ぶ。",tr:"憂さを晴らそうと、野に遊ぶ。"},{t:"心[[やり]]て、歌を詠む。",tr:"気持ちを晴らして、歌を詠む。"}]},{m:"行かせる・送る",ex:[{t:"使ひを都へ[[やる]]。",tr:"使者を都へ行かせる。"},{t:"子を都へ[[やり]]て、学ばしむ。",tr:"子を都へ行かせて、学ばせる。"},{t:"使ひを[[やり]]て、安否を問はす。",tr:"使者を行かせて、安否を尋ねさせる。"}]},{m:"（遠くへ）～する",ex:[{t:"南ははるかに野の方[[見やら]]る",tr:"南ははるか遠くまで野の方が見渡される",s:"更級日記"},{t:"はるかに見[[やる]]。",tr:"はるか遠くを見やる。"},{t:"沖の方を[[見やれ]]ば、船の見ゆ。",tr:"沖の方をはるかに見ると、船が見える。"}]}]},
 {w:"やをら", pos:"副", mean:"そっと・静かに", expl:"音を立てずに静かに動作を行う様子を表す。", mne:"『やをら』＝そっと動く、と語感そのままで覚える。", senses:[{m:"そっと・静かに",ex:[{t:"[[やをら]]立ちて、几帳の後ろへ入る。",tr:"そっと立って、几帳の後ろへ入る。"},{t:"[[やをら]]戸を開けて、中をうかがふ。",tr:"そっと戸を開けて、中をうかがう。"},{t:"[[やをら]]入りて、几帳の陰に隠る。",tr:"そっと入って、几帳の陰に隠れる。"}]}]},
 {w:"ゆかし", pos:"形", mean:"見たい・知りたい・聞きたい（心ひかれる）", expl:"対象に強く心惹かれ、もっと知りたい・近づきたいと思う気持ちを表す。", mne:"『行かし』＝心がそちらへ行きたくなる、と語源イメージで覚える。", senses:[{m:"見たい・知りたい",ex:[{t:"いとど[[ゆかしさ]]まされど",tr:"ますます見たい気持ちがまさるけれど",s:"更級日記"},{t:"何事かありけん、[[ゆかしかり]]しかど",tr:"何事があったのだろう、見たかったけれど",s:"徒然草（第五十二段）"},{t:"都の様子の[[ゆかしく]]て、上りたまふ。",tr:"都の様子が見たくて、上京なさる。"}]},{m:"心ひかれる・慕わしい",ex:[{t:"[[ゆかしき]]人柄にて、心ひかる。",tr:"心ひかれる人柄で、慕わしく思う。"},{t:"[[ゆかしき]]人柄にて、誰にも好まる。",tr:"心ひかれる人柄で、誰からも好かれる。"},{t:"山の奥の[[ゆかしく]]て、分け入りぬ。",tr:"山の奥が慕わしくて、分け入った。"}]}]},
 {w:"ゆくりなし", pos:"形", mean:"突然だ・思いがけない・軽率だ", expl:"予期せぬ突発的な出来事や、深く考えない軽率さを表す。", mne:"『ゆくり』＝前触れなく、と語感から『突然・不意に』を覚える。", senses:[{m:"突然だ・思いがけない",ex:[{t:"[[ゆくりなく]]風吹きて",tr:"突然風が吹いて",s:"土佐日記"},{t:"[[ゆくりなく]]風吹きて、船流されぬ。",tr:"突然風が吹いて、船が流された。"},{t:"[[ゆくりなく]]客の来て、あわてぬ。",tr:"突然客が来て、あわてた。"}]},{m:"軽率だ・軽はずみだ",ex:[{t:"[[ゆくりなき]]言葉を口にして、後に悔ゆ。",tr:"軽はずみな言葉を口にして、後に後悔する。"},{t:"[[ゆくりなき]]振る舞ひを、後に悔ゆ。",tr:"軽はずみな振る舞いを、後に後悔する。"},{t:"[[ゆくりなく]]約束して、守りがたし。",tr:"軽率に約束して、守りにくい。"}]}]},
 {w:"ゆふされば", pos:"連語", mean:"夕方になると", expl:"『夕さり来（く）れば』が縮約した表現で、夕暮れが訪れる意を表す。", mne:"『夕（ゆふ）さる』＝夕方になる、が『されば』の形になったと覚える。", senses:[{m:"夕方になると",ex:[{t:"[[ゆふされば]]野辺に風立つ。",tr:"夕方になると、野辺に風が立つ。"},{t:"[[ゆふされば]]、人々家路を急ぐ。",tr:"夕方になると、人々は家路を急ぐ。"},{t:"[[ゆふされば]]、野に霧立つ。",tr:"夕方になると、野に霧が立つ。"}]}]},
 {w:"ゆゆし", pos:"形", mean:"恐れ多い・不吉だ／（程度が）はなはだしい・すばらしい", expl:"神聖・不吉のどちらの意味でも『触れてはならないほど』の強い程度を表す評価語。", mne:"『忌（い）む』に通じ、『触れてはならないほど』の強さ、善悪どちらにも使うと覚える。", senses:[{m:"不吉だ・恐れ多い",ex:[{t:"[[ゆゆしき]]事なれば、人にも語らず。",tr:"不吉なことなので、人にも語らない。"},{t:"[[ゆゆしき]]夢を見て、人に語らず。",tr:"不吉な夢を見て、人に語らない。"},{t:"神の[[ゆゆしき]]所に、足を踏み入れず。",tr:"神の畏れ多い所に、足を踏み入れない。"}]},{m:"はなはだしい・すばらしい",ex:[{t:"[[ゆゆしく]]信起こしたり",tr:"ひどく信心を起こした",s:"徒然草（第二百三十六段）"},{t:"[[ゆゆしく]]美しき姫君なり。",tr:"たいそう美しい姫君である。"},{t:"[[ゆゆしき]]大事に、人々恐る。",tr:"たいへんな大事に、人々が恐れる。"}]}]},

{id:17, words:[

 {w:"ようせずは", pos:"連語", mean:"悪くすると・下手をすると", expl:"事がうまくいかなかった場合を想定して述べる表現。", mne:"『よう（よく）せずは』＝うまくいかなければ、と直訳から覚える。", senses:[{m:"悪くすると・下手をすると",ex:[{t:"坊にも、[[ようせずは]]、この御子のゐたまふべきなめり",tr:"皇太子の位にも、悪くすると、この御子がおつきになるのだろう",s:"源氏物語（桐壺）"},{t:"[[ようせずは]]、命も危ふからむ。",tr:"下手をすると、命も危ないだろう。"},{t:"[[ようせずは]]、雨に降り込められなむ。",tr:"悪くすると、雨に降り込められるだろう。"}]}]},
 {w:"よし（由・良し・縦し）", pos:"名／形／副", mean:"理由・いわれ（由）／良い（良し）／たとえ～としても（縦し）", expl:"同音で三つの異なる語を持つため、文脈でどの『よし』かを見極める必要がある。", mne:"『由・良し・縦し』の三役を持つ語、とまとめて三つ並べて覚える。", senses:[{m:"理由・事情",ex:[{t:"春日の里にしる[[よし]]して",tr:"春日の里に領地を持つ縁があって",s:"伊勢物語（初段）"},{t:"かかる[[よし]]を申し上げむ。",tr:"このような事情を申し上げよう。"},{t:"かく遅れたる[[よし]]を、申し上ぐ。",tr:"このように遅れた事情を、申し上げる。"}]},{m:"良い・すぐれている",ex:[{t:"[[よき]]人の御子なり。",tr:"身分の高いすぐれた方のお子様である。"},{t:"[[よき]]人に会ひて、教へを受く。",tr:"立派な人に会って、教えを受ける。"},{t:"心[[よき]]者は、人に好かる。",tr:"心のよい者は、人に好かれる。"}]},{m:"たとえ～でも",ex:[{t:"[[よし]]それにても、我は行くべし。",tr:"たとえそうであっても、私は行くつもりだ。"},{t:"[[よし]]人は笑ふとも、我は行かむ。",tr:"たとえ人が笑っても、私は行こう。"},{t:"[[よし]]さなくとも、心は変はらじ。",tr:"たとえそうでなくても、心は変わらない。"}]}]},
 {w:"よのなか", pos:"名", mean:"世間・治世／男女の仲", expl:"社会全体を指すほか、恋愛関係・夫婦関係を指す用法がある。", mne:"『世の中』は『世間』のほか『男女の仲』も指すと文脈で覚える。", senses:[{m:"世間・世の中",ex:[{t:"[[世の中]]にある人と栖と、またかくのごとし",tr:"世間にいる人と住まいとは、またこのようなものである",s:"方丈記（ゆく河の流れ）"},{t:"[[世の中]]にいとものはかなく",tr:"世の中でたいそう頼りなく",s:"蜻蛉日記"},{t:"[[よのなか]]をうしと思ひて、山に入る。",tr:"世の中をつらいと思って、山に入る。"}]},{m:"男女の仲・夫婦仲",ex:[{t:"二人の[[よのなか]]、いかにかなりぬらむ。",tr:"二人の仲は、どうなってしまったのだろう。"},{t:"二人の[[よのなか]]、人に知られじ。",tr:"二人の仲は、人に知られまい。"},{t:"[[よのなか]]を恨めしく思ふ女なり。",tr:"夫婦の仲を恨めしく思う女である。"}]}]},
 {w:"よに～ず（よも～じ）", pos:"連語", mean:"決して～ない（よに～ず）／まさか～ないだろう（よも～じ）", expl:"どちらも強い打消・打消推量を表す呼応表現で、対で覚えると効率的。", mne:"『よに＋ず』＝決して～ない、『よも＋じ』＝まさか～まい、と対にして覚える。", senses:[{m:"決して～ない",ex:[{t:"このこと、[[よに]]人に語らず。",tr:"このことは、決して人に語らない。"},{t:"その恥は、[[よに]]忘れじ。",tr:"その恥は、決して忘れまい。"},{t:"[[よに]]人に語らず。",tr:"決して人に語らない。"}]},{m:"まさか～ないだろう",ex:[{t:"[[よも]]かかることはあらじ。",tr:"まさかこんなことはないだろう。"},{t:"[[よも]]さることはあらじ。",tr:"まさかそのようなことはないだろう。"},{t:"[[よも]]知らざらむ。",tr:"まさか知らないだろう。"}]}]},

 {w:"らうたし", pos:"形", mean:"かわいい・いたわりたい", expl:"弱く守ってあげたくなるような、いじらしい可愛らしさを表す。", mne:"『労（らう）たし』＝いたわりたくなるほど可愛い、と漢字で覚える。", senses:[{m:"かわいい・いたわりたい",ex:[{t:"[[らうたき]]稚児の、母にすがりぬ。",tr:"かわいらしい幼子が、母にすがりついた。"},{t:"[[らうたき]]子の、泣きて寄り来る。",tr:"かわいい子が、泣いて寄ってくる。"},{t:"[[らうたく]]思ひて、手放さず。",tr:"かわいく思って、手放さない。"}]}]},
 {w:"らうらうじ", pos:"形", mean:"洗練されている・熟練している", expl:"物事に慣れ、手際よく上品にこなせる様子を表す。", mne:"『らうらうじ』＝『労（らう）』を重ねた語で、熟練の技と覚える。", senses:[{m:"洗練されている・手慣れている",ex:[{t:"[[らうらうじき]]手つきにて、琴を弾く。",tr:"洗練された手つきで、琴を弾く。"},{t:"[[らうらうじき]]言葉遣ひの女房なり。",tr:"洗練された言葉遣いの女房である。"},{t:"[[らうらうじく]]舞ひて、人を驚かす。",tr:"手慣れて見事に舞って、人を驚かす。"}]}]},
 {w:"れいの", pos:"連体詞", mean:"いつもの・例の", expl:"普段通りであることを指し示す語。", mne:"『例（れい）の』＝『いつもの例の』と現代語とほぼ同じで覚えやすい。", senses:[{m:"いつもの・例の",ex:[{t:"[[例の]]ことどもみなし終へて",tr:"例のしきたりのことどもをすべてし終えて",s:"土佐日記"},{t:"[[例の]]絶えせぬ水の音なひ",tr:"いつもの絶えることのない遣水の音",s:"紫式部日記"},{t:"[[れいの]]所に、人々集ふ。",tr:"いつもの場所に、人々が集まる。"}]}]},
 {w:"わざと", pos:"副", mean:"わざわざ・特別に・本格的に", expl:"現代語『わざと（故意に）』よりも、丁寧・本格的に事を行う意味が中心。", mne:"現代語との意味ずれに注意し、『わざわざ・特別に』を第一に覚える。", senses:[{m:"わざわざ",ex:[{t:"[[わざと]]ならぬ匂ひしめやかにうち薫りて",tr:"わざとらしくない（さりげない）香りがしっとりと薫って",s:"徒然草（第三十二段）"},{t:"[[わざと]]使ひをやりて、問はす。",tr:"わざわざ使いを送って、尋ねさせる。"},{t:"[[わざと]]出で迎へて、客を請ず。",tr:"わざわざ出迎えて、客を招く。"}]},{m:"格別に・本格的に",ex:[{t:"[[わざと]]めでたき紙に書きて、奉る。",tr:"格別にすばらしい紙に書いて、献上する。"},{t:"[[わざと]]選びたる品を贈る。",tr:"特別に選んだ品を贈る。"},{t:"[[わざと]]ねんごろに書きたる文なり。",tr:"格別に丁寧に書いた手紙である。"}]}]},
 {w:"わびし", pos:"形", mean:"つらい・興ざめだ・貧しくみすぼらしい", expl:"心細く、やるせない気持ちや、みすぼらしい様子を表す。", mne:"『わぶ（動詞）』の形容詞形、とセットで『つらい・わびしい』を覚える。", senses:[{m:"つらい・心細い",ex:[{t:"旅の空、いと[[わびし]]。",tr:"旅の空は、とてもつらく心細い。"},{t:"一人の旅の夜、[[わびし]]。",tr:"一人旅の夜は、つらく心細い。"},{t:"訪ふ人もなく、[[わびしく]]思ふ。",tr:"訪れる人もなく、心細く思う。"}]},{m:"貧しい・みすぼらしい",ex:[{t:"[[わびしき]]住まひなれど、心は豊かなり。",tr:"貧しいみすぼらしい住まいだが、心は豊かである。"},{t:"[[わびしき]]家に、年を重ぬ。",tr:"貧しい家で、年を重ねる。"},{t:"[[わびしき]]衣を着て、物乞ふ。",tr:"みすぼらしい着物を着て、物乞いをする。"}]},{m:"興ざめだ・がっかりだ",ex:[{t:"興あるべき宴の、[[わびしく]]なりぬ。",tr:"楽しいはずの宴が、興ざめになった。"},{t:"雨降りて、遊びも[[わびし]]。",tr:"雨が降って、遊びも興ざめだ。"},{t:"興なくして、[[わびしく]]なりぬ。",tr:"興が尽きて、がっかりした。"}]}]},
 {w:"わぶ", pos:"動（上二段）", mean:"困る・つらく思う・嘆く", expl:"物事がうまくいかず困惑し、嘆く様子を表す動詞。", mne:"『わびし』の動詞形として、名詞・形容詞・動詞をセットで覚える。", senses:[{m:"困る・困り果てる",ex:[{t:"道に迷ひて、ほとほと[[わび]]ぬ。",tr:"道に迷って、すっかり困り果てた。"},{t:"道を失ひて、[[わび]]ぬ。",tr:"道を見失って、困り果てた。"},{t:"金なくて、[[わび]]たる人なり。",tr:"金がなくて、困っている人である。"}]},{m:"嘆く・つらく思う",ex:[{t:"嘆き[[わび]]つつ明かし暮らすほどに",tr:"嘆き悲しみつつ明かし暮らすうちに",s:"和泉式部日記"},{t:"世を[[わび]]て、山に籠もる。",tr:"世を嘆いて、山に籠もる。"},{t:"別れを[[わび]]て、涙す。",tr:"別れを嘆いて、涙を流す。"}]}]},
 {w:"わりなし", pos:"形", mean:"道理に合わない・どうしようもない・（程度が）甚だしい", expl:"『理（わり）無し』で、筋が通らない、対処しようのない様子を表す。", mne:"『割（わり）無し』＝割り切れない＝どうしようもない、と覚える。", senses:[{m:"道理に合わない・無理だ",ex:[{t:"[[わりなき]]仰せ言なり。",tr:"道理に合わない無理なお言葉である。"},{t:"[[わりなき]]仰せに、人々困る。",tr:"道理に合わないお言葉に、人々が困る。"},{t:"[[わりなく]]責めたてて、人を苦しむ。",tr:"無理に責めたてて、人を苦しめる。"}]},{m:"どうしようもない・たまらない",ex:[{t:"別れの悲しさ、[[わりなく]]思ひたまふ。",tr:"別れの悲しさを、たまらなくお思いになる。"},{t:"恋しさに[[わりなく]]、涙ぐむ。",tr:"恋しさにたまらなく、涙ぐむ。"},{t:"暑さ[[わりなし]]。",tr:"暑さがたまらない。"}]}]},
 {w:"われかのけしき", pos:"連語", mean:"茫然自失の様子・我を忘れた様子", expl:"『我か（我か人か分からないほどの）様子』の意で、放心状態を表す。", mne:"『我か（我なのか）』分からなくなるほどの放心、とそのまま覚える。", senses:[{m:"茫然自失の様子",ex:[{t:"[[われかのけしき]]にて、立ち尽くす。",tr:"茫然自失の様子で、立ち尽くす。"},{t:"親の死を聞きて、[[われかのけしき]]なり。",tr:"親の死を聞いて、茫然自失の様子である。"},{t:"[[われかのけしき]]にて、物も言はず。",tr:"茫然自失の様子で、物も言わない。"}]}]},

 {w:"ゐる", pos:"動（上一段）", mean:"座る・存在する／（人を）連れて行く", expl:"『をり』に近く座って存在することを表すほか、人を伴って行く『率る』の意味も持つ。", mne:"『ゐる』＝座って『いる』、または人を『率（ゐ）る』＝連れていく、と二つの漢字で覚える。", senses:[{m:"座る・いる",ex:[{t:"いとうつくしうて[[ゐ]]たり",tr:"たいそうかわいらしくて座っている",s:"竹取物語"},{t:"はや夜も明けなむと思ひつつ[[ゐ]]たりけるに",tr:"早く夜も明けてほしいと思いながら座っていたところ",s:"伊勢物語（芥川）"},{t:"縁に[[ゐ]]て、月を見る。",tr:"縁に座って、月を見る。"}]},{m:"連れて行く",ex:[{t:"芥川といふ川を[[率]]て行きければ",tr:"芥川という川を連れて行ったところ",s:"伊勢物語（芥川）"},{t:"供人を[[ゐ]]て、都へ上る。",tr:"供の者を連れて、都へ上る。"},{t:"子を[[ゐ]]て、都に上る。",tr:"子を連れて、都に上る。"}]}]},
 {w:"をかし", pos:"形", mean:"趣がある・すばらしい／こっけいだ", expl:"知的で明るい興味・関心を引く趣を表す語で、『あはれ』（しみじみ）と対比される美意識。", mne:"『あはれ』としみじみ系、『をかし』は明るい興味系、と対比で覚える。", senses:[{m:"趣がある・風情がある",ex:[{t:"ほのかにうち光りて行くも[[をかし]]。",tr:"ほのかに光って飛んでいくのも趣がある。",s:"枕草子（第一段・夏）"},{t:"前栽の露はこぼるばかり濡れかかりたるも、いと[[をかし]]。",tr:"庭の植え込みの露がこぼれるほど濡れかかっているのも、たいそう趣がある。",s:"枕草子（九月ばかり）"},{t:"すべてをりにつけつつ、一年ながら[[をかし]]。",tr:"すべて折にふれて、一年中趣がある。",s:"枕草子（ころは）"}]},{m:"こっけいだ・おもしろい",ex:[{t:"言ひたりしこそ、[[をかしかり]]しか",tr:"言ったことこそ、おもしろかったことだ",s:"徒然草（第三十一段）"},{t:"男の言ふこと、[[をかしく]]て、人々笑ひぬ。",tr:"男の言うことがこっけいで、人々は笑った。"},{t:"猿の真似をする童、[[をかしく]]て人笑ふ。",tr:"猿の真似をする子どもが、おもしろくて人が笑う。"}]},{m:"かわいらしい",ex:[{t:"[[をかしき]]稚児の、笑みて寄り来たり。",tr:"かわいらしい幼子が、笑って寄ってきた。"},{t:"[[をかしき]]雀の子、掌に遊ぶ。",tr:"かわいらしい雀の子が、掌で遊ぶ。"},{t:"[[をかしげなる]]児の、手を振る。",tr:"かわいらしい子どもが、手を振る。"}]}]},
 {w:"をこがまし", pos:"形", mean:"ばかげている・差し出がましい", expl:"愚かしく見える様子や、出しゃばった振る舞いを表す。", mne:"『痴（をこ）』＝愚か、が語源、と漢字イメージで覚える。", senses:[{m:"ばかげている・差し出がましい",ex:[{t:"[[をこがましき]]ふるまひをして、人に笑はる。",tr:"ばかげたふるまいをして、人に笑われる。"},{t:"[[をこがましき]]ことを言ひて、人に笑はる。",tr:"ばかげたことを言って、人に笑われる。"},{t:"知らぬに、知り顔する、[[をこがまし]]。",tr:"知らないのに、知り顔をするのは、ばかげている。"}]}]},
 {w:"をさをさ", pos:"副", mean:"めったに～ない・ほとんど～ない", expl:"下に打消を伴って、ほとんど起こらないことを強調する呼応の副詞。", mne:"『をさをさ』を見たら文末の打消とセットで『めったに～ない』と訳す。", senses:[{m:"めったに～ない・ほとんど～ない",ex:[{t:"[[をさをさ]]訪ふ人もなし。",tr:"訪ねてくる人もめったにいない。"},{t:"[[をさをさ]]人の訪はぬ山里なり。",tr:"めったに人の訪れない山里である。"},{t:"[[をさをさ]]見えぬ人なれば、懐かし。",tr:"めったに姿を見せない人なので、懐かしい。"}]}]},

/* ---------- small helpers ---------- */
function numToKanji(n){
  const d = ['','一','二','三','四','五','六','七','八','九'];
  if(n<10) return d[n];
  if(n===10) return '十';
  if(n<20) return '十'+d[n-10];
  return String(n);
}
function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function circled(n){ return '①②③④⑤⑥⑦⑧⑨'[n-1] || '('+n+')'; }
function markHit(t){ return t.replace(/\[\[(.+?)\]\]/, '<span class="hit">$1</span>'); }
function plainSentence(t){ return t.replace(/\[\[(.+?)\]\]/, '$1'); }
function questionCount(round){ return round.words.reduce((a,w)=>a+w.senses.length,0); }

function spawnRipple(btn, e){
  const rect = btn.getBoundingClientRect();
  const r = document.createElement('span');
  r.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size + 'px';
  const x = (e.clientX ?? rect.left+rect.width/2) - rect.left - size/2;
  const y = (e.clientY ?? rect.top+rect.height/2) - rect.top - size/2;
  r.style.left = x + 'px';
  r.style.top = y + 'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 600);
}

   ===================================================================== */
const modeStage = $('modeStage');
const modeCard = $('modeCard');
const panelStudy = $('panelStudy');
const panelTest = $('panelTest');
let modeRound = null;
let modeBusy = false;
let drag = null;

function openMode(id){
  modeRound = ROUNDS.find(r=>r.id===id);
  if(!modeRound) return;
  $('mcRound').textContent = '第'+numToKanji(id)+'回';
  $('mcMeta').textContent = modeRound.words.length+'語 ・ '+questionCount(modeRound)+'問';
  resetMode();
  showScreen('mode');
}
function resetMode(){
  modeBusy = false;
  drag = null;
  modeStage.classList.remove('dragging','commit-study','commit-test');
  modeCard.style.setProperty('--dx','0px');
  modeCard.style.setProperty('--rot','0deg');
  modeCard.style.opacity = '';
  panelStudy.style.setProperty('--p',0);
  panelTest.style.setProperty('--p',0);
}
function backToMode(){
  clearTestTimers();
  resetMode();
  showScreen('mode');
}
$('backFromMode').addEventListener('click', ()=> showScreen('rounds'));

function applyDrag(dx){
  const W = modeStage.clientWidth;
  const lim = W*0.44;
  const d = lim * Math.tanh(dx/lim);          // ゴムのように重くなる
  const th = W*0.2;
  modeCard.style.setProperty('--dx', d+'px');
  modeCard.style.setProperty('--rot', (d/lim*6)+'deg');
  panelStudy.style.setProperty('--p', Math.min(1, Math.max(0, d/th)));
  panelTest.style.setProperty('--p', Math.min(1, Math.max(0, -d/th)));
}
modeStage.addEventListener('pointerdown', (e)=>{
  if(modeBusy) return;
  if(e.target.closest('.hint-btn')) return;
  drag = { id:e.pointerId, x0:e.clientX, dx:0, active:false, samples:[] };
});
modeStage.addEventListener('pointermove', (e)=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dx = e.clientX - drag.x0;
  if(!drag.active){
    if(Math.abs(dx) < 8) return;
    drag.active = true;
    modeStage.classList.add('dragging');
    try{ modeStage.setPointerCapture(e.pointerId); }catch(_){}
  }
  drag.dx = dx;
  drag.samples.push({t:performance.now(), x:e.clientX});
  if(drag.samples.length > 6) drag.samples.shift();
  applyDrag(dx);
});
function endDrag(cancel){
  if(!drag) return;
  const d = drag; drag = null;
  modeStage.classList.remove('dragging');
  if(!d.active) return;
  const W = modeStage.clientWidth;
  const th = W*0.2;
  let v = 0;
  if(d.samples.length >= 2){
    const a = d.samples[0], b = d.samples[d.samples.length-1];
    v = (b.x-a.x)/Math.max(1, b.t-a.t);
  }
  if(!cancel && (d.dx < -th || (v < -0.7 && d.dx < -40))) commitMode('test');
  else if(!cancel && (d.dx > th || (v > 0.7 && d.dx > 40))) commitMode('study');
  else { modeCard.style.setProperty('--dx','0px'); modeCard.style.setProperty('--rot','0deg'); panelStudy.style.setProperty('--p',0); panelTest.style.setProperty('--p',0); }
}
modeStage.addEventListener('pointerup', ()=>endDrag(false));
modeStage.addEventListener('pointercancel', ()=>endDrag(true));

function commitMode(kind){
  if(modeBusy || !modeRound) return;
  modeBusy = true;
  const W = modeStage.clientWidth;
  const dir = (kind==='test') ? -1 : 1;
  modeCard.style.setProperty('--dx', (dir*W*1.05)+'px');
  modeCard.style.setProperty('--rot', (dir*14)+'deg');
  modeCard.style.opacity = '0';
  (kind==='test' ? panelTest : panelStudy).style.setProperty('--p', 1);
  modeStage.classList.add(kind==='test' ? 'commit-test' : 'commit-study');
  setTimeout(()=>{
    if(kind==='test') startTest(modeRound.id);
    else openStudy(modeRound.id);
  }, 560);
}
$('hintStudy').addEventListener('click', ()=> commitMode('study'));
$('hintTest').addEventListener('click', ()=> commitMode('test'));
document.addEventListener('keydown', (e)=>{
  if(isActive('mode') && !modeBusy){
    if(e.key==='ArrowLeft') commitMode('test');       // 右→左 = テスト
    else if(e.key==='ArrowRight') commitMode('study'); // 左→右 = 学習
  }
});

  const round = ROUNDS.find(r=>r.id===id);

  currentRoundData = round;
  wordsContainer.innerHTML = '';

  round.words.forEach((w,i)=>{
    const page = document.createElement('section');

    const headSpans = [...w.w].map((ch,ci)=>'<span class="ch" style="animation-delay:'+(ci*0.07)+'s">'+ch+'</span>').join('');

    const items = w.senses.map((s,si)=>
      s.ex.map(e=>
        '<div class="ex-item">'
        + (w.senses.length>1 ? '<span class="ex-no">'+circled(si+1)+'</span>' : '')
        + '<span class="ex-text">'+markHit(e.t)+'</span><br>'
        + '<span class="ex-trans secret">'+e.tr+'</span>'
        + (e.s ? '<br><span class="ex-src">'+e.s+'</span>' : '')
        + '</div>'
      ).join('')
    ).join('');

    page.innerHTML =
      '<div class="tate-flow">'

      + '<p class="tate-meaning secret">'+w.mean+'</p>'
      + '<div class="tate-block expl" style="animation-delay:.15s"><span class="tag">解説</span><br><span class="secret">'+w.expl+'</span></div>'
      + '<div class="tate-block mne" style="animation-delay:.3s"><span class="tag">覚え方</span><br><span class="secret">'+w.mne+'</span></div>'
      + '<div class="tate-block ex" style="animation-delay:.45s"><span class="tag">例文</span><br>'+items+'</div>'
      + '</div>'
      + '<div class="page-idx-mark">第'+numToKanji(round.id)+'回 ・ '+(i+1)+' / '+round.words.length+'</div>'

    wordsContainer.appendChild(page);
  });

  showScreen('words');

}

function updateProgress(round, i){
  currentIndex = i;
  progressLabel.textContent = '第'+numToKanji(round.id)+'回 ・ '+(i+1)+' / '+round.words.length;
  progressFill.style.height = (((i+1)/round.words.length)*100)+'%';
}

function setupObserver(round){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio > 0.55){
        entry.target.classList.add('active');
        const idx = Number(entry.target.dataset.index);
        updateProgress(round, idx);
      } else {
        entry.target.classList.remove('active');
      }
    });
  }, { root: wordsContainer, threshold: [0, 0.55, 1] });

  document.querySelectorAll('.page').forEach(p=>observer.observe(p));
}

   TEST (テスト)
   ===================================================================== */
const LABELS = ['ア','イ','ウ','エ'];

/* --- distractor pool & similarity --- */
function posGroup(pos){
  if(pos.startsWith('名')) return 'n';
  if(pos.includes('動')) return 'v';
  if(pos.startsWith('形')) return 'a';
  return 'o';
}
const POOL = [];
ROUNDS.forEach(r=>r.words.forEach(w=>w.senses.forEach(s=>{
  POOL.push({ word:w.w, m:s.m, g:posGroup(w.pos) });
})));
function tokensOf(m){
  return m.replace(/[（）()～~]/g,'・').split(/[・／、\s]+/).map(x=>x.trim()).filter(x=>x.length>=2);
}
function squash(s){ return s.replace(/[（）()～~・／、\s「」]/g,''); }
function similar(a,b){
  const ta = tokensOf(a), tb = tokensOf(b);
  if(ta.some(x=>tb.includes(x))) return true;
  const na = squash(a), nb = squash(b);
  for(let i=0;i+4<=na.length;i++){ if(nb.includes(na.substr(i,4))) return true; }
  return false;
}
function makeOptions(q){
  const correct = q.s.m;
  const g = posGroup(q.w.pos);
  const picked = [];
  const tryAdd = (m)=>{
    if(picked.length>=3) return;
    if(similar(m, correct)) return;
    if(picked.some(x=>similar(x, m))) return;
    picked.push(m);
  };
  // 同じ語の別の意味を1つ混ぜる（意味の使い分けを問う）
  const sib = shuffle(q.w.senses.filter((x,i)=> i!==q.si).map(x=>x.m));
  if(sib.length && Math.random()<0.6) tryAdd(sib[0]);
  const others = POOL.filter(p=>p.word!==q.w.w);
  shuffle(others.filter(p=>p.g===g)).forEach(p=>tryAdd(p.m));
  shuffle(others.filter(p=>p.g!==g)).forEach(p=>tryAdd(p.m));
  return shuffle([{m:correct, ok:true}].concat(picked.map(m=>({m, ok:false}))));
}
function buildQuestions(round, onlyKeys){
  let qs = [];
  round.words.forEach(w=>w.senses.forEach((s,si)=>{
    qs.push({ w, s, si, key:w.w+'#'+si, ex:s.ex[Math.floor(Math.random()*s.ex.length)] });
  }));
  if(onlyKeys) qs = qs.filter(q=>onlyKeys.includes(q.key));
  qs = shuffle(qs);
  qs.forEach(q=>{ q.options = makeOptions(q); });
  return qs;
}


/* 赤ペンで描く「◯」：少しずれて重なる手描き風の楕円 */
function maruPath(W,H){
  const cx = W/2, cy = H/2, rx = W/2 + 6, ry = H/2 + 6, n = 72;
  const a0 = Math.PI*0.96;
  let d = '';
  for(let k=0;k<=n;k++){
    const u = k/n;
    const a = a0 + u*Math.PI*2.14;
    const sc = 0.97 + 0.06*u;
    const x = cx + Math.cos(a)*rx*sc;
    const y = cy + Math.sin(a)*ry*sc - 4*Math.sin(u*Math.PI);
    d += (k?'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  }
  return d;
}

/* --- state --- */
const T = { round:null, qs:[], i:0, correct:0, streak:0, best:0, wrong:[], locked:true, timers:[], review:false };
function later(fn, ms){ const id = setTimeout(fn, ms); T.timers.push(id); return id; }
function clearTestTimers(){ T.timers.forEach(clearTimeout); T.timers = []; }

const qWrap = $('qWrap'), qNo = $('qNo'), qSentence = $('qSentence'), qChoices = $('qChoices'), qFeedback = $('qFeedback');
const testIntro = $('testIntro'), testResult = $('testResult');

function startTest(roundId, onlyKeys){
  const round = ROUNDS.find(r=>r.id===roundId);
  if(!round) return;
  clearTestTimers();
  T.round = round;
  T.qs = buildQuestions(round, onlyKeys);
  T.i = 0; T.correct = 0; T.streak = 0; T.best = 0; T.wrong = []; T.locked = true;
  T.review = !!onlyKeys;

  testResult.classList.remove('show');
  $('testCorrect').textContent = '0';
  $('testStreak').classList.remove('on');
  $('testBarFill').style.width = '0%';
  qFeedback.classList.remove('show'); qFeedback.innerHTML = '';
  qChoices.innerHTML = ''; qSentence.innerHTML = '';
  qNo.textContent = '';
  $('testProgressLabel').textContent = '第'+numToKanji(round.id)+'回 ・ '+(T.review?'おさらい':'テスト');

  // intro（画面が切り替わってから文字が並ぶ）
  testIntro.classList.add('hide');
  showScreen('test');
  const title = '第'+numToKanji(round.id)+'回　'+(T.review?'おさらい':'力試し');
  $('tiTitle').innerHTML = [...title].map((ch,i)=>'<span class="c" style="animation-delay:'+(0.4+i*0.09).toFixed(2)+'s">'+(ch==='　'?'&nbsp;&nbsp;':ch)+'</span>').join('');
  $('tiSub').textContent = '全 '+T.qs.length+' 問';
  void testIntro.offsetWidth;
  testIntro.classList.remove('hide');

  later(()=>{ testIntro.classList.add('hide'); renderQuestion(true); }, 3000);
}

function renderQuestion(first){
  const q = T.qs[T.i];
  const N = T.qs.length;
  T.locked = true;
  qFeedback.classList.remove('show'); qFeedback.innerHTML = '';
  qWrap.classList.remove('leaving');
  qWrap.classList.remove('entering'); void qWrap.offsetWidth; qWrap.classList.add('entering');

  qNo.textContent = '問 '+(T.i+1)+' ／ '+N;
  $('testProgressLabel').textContent = '第'+numToKanji(T.round.id)+'回 ・ '+(T.review?'おさらい':'テスト')+' ・ '+(T.i+1)+' / '+N;
  $('testBarFill').style.width = ((T.i)/N*100)+'%';

  // sentence (char-by-char reveal + underline sweep)
  const m = q.ex.t.match(/^([\s\S]*?)\[\[([\s\S]+?)\]\]([\s\S]*)$/);
  const pre = m[1], hit = m[2], post = m[3];
  const step = 0.028;
  let n = 0;
  const mk = (s)=>[...s].map(ch=>'<span class="c" style="animation-delay:'+((n++)*step).toFixed(3)+'s">'+ch+'</span>').join('');
  const preH = mk(pre);
  const hitH = mk(hit);
  const postH = mk(post);
  const ud = (n*step + 0.12).toFixed(2);
  $('qSrc').textContent = q.ex.s || '';
  qSentence.innerHTML = preH + '<span class="q-hit" style="--ud:'+ud+'s">'+hitH+'</span>' + postH;

  // choices
  const base = n*step + 0.55;
  qChoices.classList.remove('ready');
  qChoices.innerHTML = q.options.map((o,i)=>
    '<button class="choice" data-i="'+i+'" style="--cd:'+(base+i*0.09).toFixed(2)+'s">'
    + '<span class="lab">'+LABELS[i]+'</span><span class="txt">'+o.m+'</span></button>'
  ).join('');
  qChoices.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click', ()=> answer(Number(btn.dataset.i)));
  });
  later(()=>{ qChoices.classList.add('ready'); T.locked = false; }, (base + 3*0.09 + 0.45)*1000);
}

function answer(i){
  if(T.locked) return;
  T.locked = true;
  const q = T.qs[T.i];
  const N = T.qs.length;
  const chosen = q.options[i];
  const ok = !!chosen.ok;
  const btns = [...qChoices.querySelectorAll('.choice')];
  const ci = q.options.findIndex(o=>o.ok);

  btns.forEach((b,bi)=>{ b.classList.add('locked'); if(bi!==i && bi!==ci) b.classList.add('dim'); });

  const addMaru = (b, delay)=>{
    const W = b.offsetWidth, H = b.offsetHeight;
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','mark maru');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', maruPath(W,H)); p.setAttribute('pathLength','1');
    p.style.animationDelay = delay+'s';
    svg.appendChild(p); b.appendChild(svg);
  };
  const addBatsu = (b)=>{
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','mark batsu');
    svg.setAttribute('viewBox','0 0 40 40');
    ['M 6 6 L 34 34','M 34 6 L 6 34'].forEach(d=>{
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', d); p.setAttribute('pathLength','1');
      svg.appendChild(p);
    });
    b.appendChild(svg);
  };

  if(ok){
    btns[i].classList.add('correct');
    addMaru(btns[i], 0.05);
    T.correct++; T.streak++; T.best = Math.max(T.best, T.streak);
  } else {
    btns[i].classList.add('wrong');
    addBatsu(btns[i]);
    later(()=>{ btns[ci].classList.add('correct'); btns[ci].classList.remove('dim'); addMaru(btns[ci], 0); }, 520);
    T.streak = 0;
    T.wrong.push({ key:q.key, w:q.w.w, m:q.s.m, tr:q.ex.tr });
  }

  const cEl = $('testCorrect');
  cEl.textContent = String(T.correct);
  cEl.classList.remove('pop'); void cEl.offsetWidth; if(ok) cEl.classList.add('pop');
  const sEl = $('testStreak');
  if(T.streak >= 2){ sEl.textContent = '🔥 '+T.streak+' 連続'; sEl.classList.add('on'); }
  else { sEl.classList.remove('on'); }
  $('testBarFill').style.width = ((T.i+1)/N*100)+'%';

  const last = (T.i+1 >= N);
  const fbDelay = ok ? 450 : 900;
  later(()=>{
    qFeedback.innerHTML =
      '<div class="fb-inner">'
      + '<div class="fb-verdict '+(ok?'ok':'ng')+'">'+(ok?'正解！':'残念…')+'</div>'
      + '<div class="fb-body">'
      +   '<b>訳</b>　'+q.ex.tr+'<br>'
      +   '<span class="fb-w">'+q.w.w+'</span> ＝ '+q.w.mean+'<br>'
      +   '<b>覚え方</b>　'+q.w.mne
      + '</div>'
      + '<button class="fb-next" id="fbNext">'+(last?'結果を見る':'つぎへ')+'<span class="ar">▷</span></button>'
      + '</div>';
    $('fbNext').addEventListener('click', nextQuestion);
    requestAnimationFrame(()=> qFeedback.classList.add('show'));
    later(()=>{
      const st = $('testStage');
      if(st.scrollHeight > st.clientHeight + 4) st.scrollTo({ top: st.scrollHeight, behavior:'smooth' });
    }, 320);
    T.locked = 'fb';
  }, fbDelay);
}

function nextQuestion(){
  if(T.locked !== 'fb') return;
  T.locked = true;
  if(T.i+1 >= T.qs.length){ showResult(); return; }
  qWrap.classList.remove('entering');
  qWrap.classList.add('leaving');
  later(()=>{ T.i++; renderQuestion(); }, 380);
}

document.addEventListener('keydown', (e)=>{
  if(!isActive('test')) return;
  if(testResult.classList.contains('show')) return;
  if(['1','2','3','4'].includes(e.key) && T.locked===false){ answer(Number(e.key)-1); }
  else if((e.key==='Enter' || e.key===' ' || e.key==='ArrowRight') && T.locked==='fb'){ e.preventDefault(); nextQuestion(); }
});

/* --- result --- */
function showResult(){
  const N = T.qs.length;
  const pct = Math.round(T.correct / N * 100);
  $('rsOf').textContent = '／ '+N+' 問';
  $('rsKicker').textContent = '第'+numToKanji(T.round.id)+'回　'+(T.review?'おさらい':'テスト')+' 結果';
  let comment = '';
  if(pct===100) comment = '全問正解！お見事です。';
  else if(pct>=90) comment = 'ほぼ完璧。あと一歩！';
  else if(pct>=70) comment = 'いい調子。もう一息です。';
  else if(pct>=50) comment = '半分は越えました。復習しましょう。';
  else comment = 'まずは学習でおさらいしよう。';
  $('rsComment').textContent = comment;
  $('rsPct').textContent = '正答率 '+pct+' ％　／　最高連続正解 '+T.best;

  const wrongBox = $('rsWrongBox'), wrongEl = $('rsWrong');
  wrongEl.innerHTML = '';
  if(T.wrong.length){
    wrongBox.style.display = '';
    T.wrong.forEach((x,k)=>{
      const row = document.createElement('div');
      row.className = 'wi'; row.style.setProperty('--wd', (0.9+k*0.07).toFixed(2)+'s');
      row.innerHTML = '<b>'+x.w+'</b><span>'+x.m+'</span>';
      wrongEl.appendChild(row);
    });
    $('rsRetryWrong').style.display = '';
  } else {
    wrongBox.style.display = 'none';
    $('rsRetryWrong').style.display = 'none';
  }

  $('rsNum').textContent = '0';
  const fg = $('rsFg');
  fg.style.transition = 'none'; fg.style.strokeDashoffset = '1'; void fg.getBoundingClientRect(); fg.style.transition = '';
  testResult.classList.add('show');
  requestAnimationFrame(()=>{ fg.style.strokeDashoffset = String(1 - T.correct/N); });

  // count-up
  const t0 = performance.now(), dur = 1300, target = T.correct;
  (function tick(now){
    const p = Math.min(1, (now - t0 - 350)/dur);
    if(p > 0) $('rsNum').textContent = String(Math.round(target * (1 - Math.pow(1-p,3))));
    if(p < 1) requestAnimationFrame(tick); else $('rsNum').textContent = String(target);
  })(performance.now());

  if(pct >= 90) burstPetals();
}
function burstPetals(){
  for(let i=0;i<30;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random()*100)+'%';
    p.style.animationDuration = (3.2+Math.random()*2.6)+'s';
    p.style.animationDelay = (0.4+Math.random()*1.4)+'s';
    p.style.setProperty('--dr', (Math.random()*160-80)+'px');
    p.style.width = p.style.height = (9+Math.random()*10)+'px';
    testResult.appendChild(p);
    setTimeout(()=>p.remove(), 8000);
  }
}

$('rsRetryAll').addEventListener('click', ()=> startTest(T.round.id));
$('rsRetryWrong').addEventListener('click', ()=> startTest(T.round.id, T.wrong.map(x=>x.key)));
$('rsToStudy').addEventListener('click', ()=>{ testResult.classList.remove('show'); openStudy(T.round.id); });
$('rsToRounds').addEventListener('click', ()=>{ testResult.classList.remove('show'); clearTestTimers(); showScreen('rounds'); });
$('backFromTest').addEventListener('click', ()=>{ testResult.classList.remove('show'); backToMode(); });

/* ---------- init ---------- */
// 画面外のはみ出しで外枠が勝手にスクロールしないように固定
const appEl = $('app');
appEl.addEventListener('scroll', ()=>{ if(appEl.scrollTop || appEl.scrollLeft) appEl.scrollTo(0,0); });
buildRoundGrid();
</script>
