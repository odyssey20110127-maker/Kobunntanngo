<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>古文単語試験対策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Old+Mincho:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2ead9;
    --paper-deep:#e9dfc7;
    --ink:#454138;
    --ink-soft:#4a4235;
    --shu:#a3392a;
    --shu-deep:#7f2a1f;
    --ai:#33506e;
    --gold:#a3803f;
    --line:#c9b98f;
    --card:#faf5e8;
    --night:#1c1712;
    --night-card:#241f18;
    --vh:1vh;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%; overscroll-behavior:none;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Shippori Mincho','Zen Old Mincho',serif;
    line-height:1.9;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(74,66,53,0.025) 0px, rgba(74,66,53,0.025) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
    z-index:0;
  }
  button{font-family:inherit;}

  #app{ position:relative; width:100%; height:calc(var(--vh, 1vh) * 100); overflow:hidden; overflow:clip; }

  .screen{
    position:absolute; inset:0;
    height:calc(var(--vh, 1vh) * 100);
    opacity:0;
    pointer-events:none;
    transform:translateY(14px) scale(.99);
    transition:opacity .55s cubic-bezier(.2,.7,.3,1), transform .55s cubic-bezier(.2,.7,.3,1);
    z-index:1;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0) scale(1);
    z-index:2;
  }

  /* ============ TITLE SCREEN ============ */
  #screen-title{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(163,57,42,0.07), transparent 60%),
      var(--paper);
    cursor:pointer;
  }
  .title-stage{
    text-align:center;
    position:relative;
  }
  .title-frame{
    border:1.5px solid var(--gold);
    padding:clamp(20px,4vh,46px) clamp(18px,4vw,34px);
    position:relative;
    display:inline-block;
  }
  .title-frame::before, .title-frame::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    border:2px solid var(--shu);
  }
  .title-frame::before{ top:-8px; left:-8px; border-right:none; border-bottom:none; }
  .title-frame::after{ bottom:-8px; right:-8px; border-left:none; border-top:none; }
  .title-vertical{
    display:flex;
    flex-direction:row-reverse;
    align-items:flex-start;
    gap:clamp(0.4em, 3vw, 0.9em);
    margin:0;
  }
  .title-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(0.12em, 1.1vh, 0.28em);
  }
  .title-vertical .ch{
    display:block;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(1.5rem, 6.5vh, 2.7rem);
    line-height:1;
    color:var(--ink);
    opacity:0;
    filter:blur(4px);
    animation:chIn .6s ease forwards;
  }
  @keyframes chIn{
    to{ opacity:1; filter:blur(0); }
  }
  .tap-hint{
    margin:clamp(14px,3vh,26px) 0 0;
    font-size:0.78rem;
    letter-spacing:0.4em;
    color:var(--ink-soft);
    opacity:0;
    animation:hintIn 1s ease forwards 1.9s, blinkHint 2s ease-in-out infinite 2.9s;
  }
  @keyframes hintIn{ to{ opacity:0.85; } }
  @keyframes blinkHint{ 0%,100%{opacity:0.85;} 50%{opacity:0.25;} }

  /* ============ ROUND SELECT SCREEN ============ */
  #screen-rounds{
    background:var(--paper);
    display:flex; flex-direction:column;
    padding:0 22px;
  }
  .rounds-header{
    display:flex; align-items:center; gap:14px;
    padding:22px 2px 18px;
    border-bottom:2px double var(--gold);
    flex-shrink:0;
  }
  .rounds-header h2{
    font-size:1.15rem;
    letter-spacing:0.18em;
    margin:0;
    color:var(--ink);
    font-weight:600;
  }
  .nav-back{
    background:none; border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    width:36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem;
    cursor:pointer;
    transition:transform .15s, border-color .15s, color .15s, background .15s;
    flex-shrink:0;
  }
  .nav-back:hover{ border-color:var(--shu); color:var(--shu-deep); }
  .nav-back:active{ transform:scale(.9); }

  .round-scroll{ flex:1; overflow-y:auto; padding:26px 2px 40px; }
  .round-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:14px;
  }
  .round-btn{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:clamp(12px,2.6vh,20px) 4px clamp(10px,2vh,16px);
    font-size:0.86rem;
    cursor:pointer;
    text-align:center;
    letter-spacing:0.02em;
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(10px);
    animation:riseCard .45s ease forwards;
    transition:border-color .18s, transform .18s, box-shadow .18s;
  }
  @keyframes riseCard{ to{ opacity:1; transform:translateY(0); } }
  .round-btn:hover{ border-color:var(--shu); transform:translateY(-3px); box-shadow:0 8px 18px -10px rgba(36,32,25,.4); }
  .round-btn:active{ transform:translateY(0) scale(.95); }
  .round-btn .n{
    display:block;
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:1.25rem;
    letter-spacing:0.02em;
    white-space:nowrap;
    color:var(--shu);
    margin-bottom:4px;
  }
  .round-btn .cnt{
    display:block;
    font-size:0.68rem;
    white-space:nowrap;
    color:var(--ink-soft);
    opacity:.75;
  }
  .ripple{
    position:absolute; border-radius:50%;
    background:rgba(163,57,42,0.25);
    transform:scale(0);
    animation:rippleAnim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(3.4); opacity:0; } }

  @media (max-height:820px){
    .rounds-header{ padding:14px 2px 12px; }
    .round-scroll{ padding:16px 2px 24px; }
  }

  /* ============ WORD VIEWER SCREEN ============ */
  #screen-words{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(163,57,42,0.06), transparent 55%),
      var(--paper);
    color:var(--ink);
  }
  .words-chrome{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    z-index:5;
    background:linear-gradient(to bottom, rgba(242,234,217,0.92), transparent);
  }
  .words-chrome .nav-back{ border-color:var(--ink-soft); color:var(--ink-soft); }
  .words-chrome .nav-back:hover{ border-color:var(--shu); color:var(--shu-deep); }
  .progress-label{
    font-size:0.72rem;
    letter-spacing:0.15em;
    color:var(--ink-soft);
  }
  .chrome-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .nav-list{
    background:var(--card);
    border:1px solid var(--gold);
    color:var(--shu-deep);
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.15em;
    padding:7px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  .nav-list:hover{ box-shadow:0 4px 12px -6px rgba(163,57,42,0.4); }
  .nav-list:active{ transform:scale(.94); }

  .list-overlay{
    position:absolute; inset:0;
    z-index:20;
    background:rgba(36,32,25,0.42);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .list-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .list-panel{
    width:100%;
    max-width:640px;
    max-height:78%;
    background:var(--paper);
    border-top:3px double var(--gold);
    border-radius:14px 14px 0 0;
    box-shadow:0 -18px 40px -18px rgba(36,32,25,0.5);
    display:flex;
    flex-direction:column;
    transform:translateY(24px);
    transition:transform .35s cubic-bezier(.2,.8,.3,1);
  }
  .list-overlay.open .list-panel{ transform:translateY(0); }
  .list-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .list-panel-header h3{
    margin:0;
    font-size:1rem;
    letter-spacing:0.1em;
    color:var(--ink);
  }
  .list-panel-header .nav-back{ border-color:var(--ink-soft); color:var(--ink-soft); font-size:1.1rem; }
  .list-grid{
    overflow-y:auto;
    padding:16px 18px 28px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
    gap:10px;
  }
  .list-chip{
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--shu);
    padding:10px 12px;
    text-align:left;
    cursor:pointer;
    font-family:'Shippori Mincho',serif;
    transition:border-color .15s, transform .15s, background .15s;
  }
  .list-chip:hover{ border-color:var(--shu); transform:translateY(-2px); }
  .list-chip:active{ transform:translateY(0) scale(.97); }
  .list-chip.current{ background:rgba(163,57,42,0.1); border-left-color:var(--shu-deep); }
  .list-chip .li-idx{
    font-size:0.65rem;
    color:var(--ink-soft);
    letter-spacing:0.1em;
  }
  .list-chip .li-word{
    display:block;
    font-size:1rem;
    font-weight:700;
    color:var(--ink);
    margin:2px 0 3px;
  }
  .list-chip .li-mean{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    line-height:1.5;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .progress-rail{
    position:absolute; top:0; bottom:0; right:6px;
    width:3px;
    background:rgba(74,66,53,0.12);
    z-index:5;
  }
  .progress-fill{
    position:absolute; top:0; left:0; right:0;
    height:0%;
    background:var(--shu);
    transition:height .35s ease;
  }

  .words-container{
    height:100%;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
  }
  .page{
    height:calc(var(--vh, 1vh) * 100);
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:70px 16px 40px;
    opacity:0.28;
    transform:scale(0.92);
    transition:opacity .5s ease, transform .5s ease;
  }
  .page.active{
    opacity:1;
    transform:scale(1);
  }
  .page::before{
    content:"";
    position:absolute; inset:14px;
    border:1px solid rgba(163,128,63,0.28);
    pointer-events:none;
  }
  .page-idx-mark{
    position:absolute;
    bottom:18px; left:50%;
    transform:translateX(-50%);
    font-size:0.68rem;
    letter-spacing:0.3em;
    color:var(--ink-soft);
  }

  .tate-flow{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    height:min(72vh, 560px);
    max-width:88vw;
    columns:1;
    column-width:168px;
    column-gap:30px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:4px 6px;
    scrollbar-width:thin;
  }
  .tate-flow::-webkit-scrollbar{ height:4px; }
  .tate-flow::-webkit-scrollbar-thumb{ background:rgba(201,187,153,0.25); }

  .tate-headword{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(2rem, 7vw, 2.9rem);
    margin:0 0 14px;
    color:var(--ink);
    line-height:1.25;
  }
  .tate-headword .ch{
    opacity:0;
    filter:blur(3px);
  }
  .page.active .tate-headword .ch{
    animation:chInWord .5s ease forwards;
  }
  @keyframes chInWord{
    to{ opacity:1; filter:blur(0); }
  }
  .tate-pos{
    display:inline-block;
    font-size:0.68rem;
    color:var(--ai);
    border:1px solid var(--ai);
    padding:2px 5px;
    margin:0 0 18px;
    border-radius:2px;
  }
  .tate-meaning{
    font-size:1.05rem;
    font-weight:700;
    color:var(--shu-deep);
    margin:0 0 22px;
    line-height:2;
  }
  .tate-block{
    font-size:0.86rem;
    color:var(--ink-soft);
    margin:0 0 22px;
    line-height:2.05;
    opacity:0;
    transform:translateY(8px);
  }
  .page.active .tate-block{
    animation:blockIn .6s ease forwards;
  }
  .tate-block .tag{
    display:inline-block;
    font-size:0.68rem;
    letter-spacing:0.1em;
    color:var(--gold);
    border-bottom:1px solid var(--gold);
    margin-bottom:8px;
    padding-bottom:2px;
  }
  .tate-block.mne .tag{ color:var(--ai); border-color:var(--ai); }
  .tate-block.ex .tag{ color:var(--shu); border-color:var(--shu); }
  .tate-block .ex-text{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:0.98rem;
    color:var(--ink);
    margin:0 0 6px;
  }
  .tate-block .ex-trans{ font-size:0.78rem; color:var(--ink-soft); margin:0; }
  .tate-block .ex-src{
    display:inline-block;
    margin-top:8px;
    font-size:0.64rem;
    color:var(--shu-deep);
    border:1px solid var(--shu);
    padding:1px 6px;
    border-radius:2px;
  }
  @keyframes blockIn{ to{ opacity:1; transform:translateY(0); } }

  .scroll-cue{
    position:absolute;
    bottom:16px; right:22px;
    writing-mode:vertical-rl;
    font-size:0.65rem;
    letter-spacing:0.3em;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
    animation:cueBounce 1.8s ease-in-out infinite;
  }
  @keyframes cueBounce{
    0%,100%{ transform:translateY(0); opacity:.7; }
    50%{ transform:translateY(6px); opacity:1; }
  }

  @media (max-height:820px){
    .page{ padding:56px 16px 30px; }
    .tate-flow{ height:min(68vh, 470px); }
    .tate-headword{ font-size:clamp(1.6rem, 6vw, 2.3rem); margin-bottom:10px; }
    .tate-meaning{ margin-bottom:16px; }
    .tate-block{ margin-bottom:16px; font-size:0.8rem; }
  }


  /* ============ 学習画面：意味を隠す / 例文の下線 ============ */
  .nav-list.toggle{ font-size:0.74rem; padding:7px 12px; }
  .nav-list.on{ background:var(--shu); color:#fbf3e3; border-color:var(--shu-deep); }
  .secret{ transition:color .4s ease, background-color .4s ease; border-radius:2px; }
  body.hide-meaning .secret:not(.shown){
    color:transparent !important;
    background-color:rgba(163,57,42,0.88);
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    animation:maskPulse 2.6s ease-in-out infinite;
  }
  body.hide-meaning .secret:not(.shown) *{ color:transparent !important; }
  @keyframes maskPulse{ 0%,100%{ background-color:rgba(163,57,42,0.9); } 50%{ background-color:rgba(163,57,42,0.72); } }
  body.hide-meaning .list-chip .li-mean{
    color:transparent; background:rgba(163,57,42,0.78); border-radius:2px;
  }
  .hit{
    color:var(--shu-deep);
    font-weight:700;
    text-decoration:underline;
    text-decoration-color:var(--shu);
    text-decoration-thickness:2px;
    text-underline-offset:0.22em;
  }
  .tate-flow .hit{ text-underline-position:right; }
  .tate-block .ex-item{ margin:0 0 14px; }
  .tate-block .ex-no{ color:var(--shu); font-weight:700; margin-right:0.2em; }

  /* ============ モード選択（学習 / テスト） ============ */
  #screen-mode{ background:var(--paper); }
  .mode-chrome{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; gap:14px;
    padding:18px 22px; z-index:8;
  }
  .mode-chrome{ pointer-events:none; }
  .mode-chrome > *{ pointer-events:auto; }
  .mode-chrome-title{ font-size:0.82rem; letter-spacing:0.32em; color:var(--ink-soft); }
  .mode-stage{
    position:absolute; inset:0;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    cursor:grab; overflow:hidden;
  }
  .mode-stage.dragging{ cursor:grabbing; }
  .mode-panel{
    position:absolute; top:0; bottom:0; width:58%;
    display:flex; align-items:center;
    opacity:var(--p,0);
    pointer-events:none;
    transition:opacity .35s ease, width .55s cubic-bezier(.7,0,.3,1);
    z-index:1;
  }
  .mode-stage.dragging .mode-panel{ transition:none; }
  .mode-panel.left{
    left:0; justify-content:flex-start; padding-left:7vw; color:#f4eddc;
    background:linear-gradient(90deg, #33506e 0%, #33506e 55%, rgba(51,80,110,0) 100%);
  }
  .mode-panel.right{
    right:0; justify-content:flex-end; padding-right:7vw; color:#fcf2e2;
    background:linear-gradient(270deg, #a3392a 0%, #a3392a 55%, rgba(163,57,42,0) 100%);
  }
  .mp-inner{ display:flex; align-items:center; gap:clamp(14px,2.4vw,30px); transform:translateX(calc((1 - var(--p,0)) * -46px)); }
  .mode-panel.right .mp-inner{ flex-direction:row-reverse; transform:translateX(calc((1 - var(--p,0)) * 46px)); }
  .mp-vert{
    display:flex; flex-direction:column; align-items:center; gap:0.16em;
    font-family:'Shippori Mincho',serif; font-weight:800;
    font-size:clamp(2.2rem, 8.5vh, 3.8rem); line-height:1;
  }
  .mp-side{ display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .mode-panel.right .mp-side{ align-items:flex-end; }
  .mp-sub{ font-size:0.8rem; letter-spacing:0.28em; opacity:0.9; }
  .mp-arrow{ font-size:1.6rem; letter-spacing:0.1em; opacity:0.95; }
  .mode-stage.commit-study .mode-panel.left{ width:100%; background:#33506e; }
  .mode-stage.commit-test .mode-panel.right{ width:100%; background:#a3392a; }

  .mode-card{
    position:absolute; left:50%; top:46%;
    width:min(480px, 62vw);
    transform:translate(-50%,-50%) translateX(var(--dx,0px)) rotate(var(--rot,0deg));
    transition:transform .5s cubic-bezier(.2,.8,.3,1), opacity .4s ease;
    will-change:transform;
    z-index:3;
  }
  .mode-stage.dragging .mode-card{ transition:none; }
  .screen.active .mode-card{ animation:cardRise .9s cubic-bezier(.2,.8,.3,1) backwards .1s; }
  @keyframes cardRise{
    from{ opacity:0; transform:translate(-50%,-44%) scale(.94) rotate(-1.5deg); }
  }
  .mc-frame{
    background:var(--card);
    border:1px solid var(--line);
    outline:1px solid rgba(163,128,63,0.4); outline-offset:-9px;
    padding:clamp(28px,6vh,48px) 30px clamp(24px,5vh,38px);
    text-align:center;
    box-shadow:0 34px 56px -30px rgba(36,32,25,0.6);
    position:relative;
  }
  .mc-frame::before, .mc-frame::after{
    content:""; position:absolute; width:16px; height:16px; border:2px solid var(--shu);
  }
  .mc-frame::before{ top:-7px; left:-7px; border-right:none; border-bottom:none; }
  .mc-frame::after{ bottom:-7px; right:-7px; border-left:none; border-top:none; }
  .mc-kicker{ font-size:0.74rem; letter-spacing:0.55em; color:var(--ink-soft); }
  .mc-round{
    font-family:'Shippori Mincho',serif; font-weight:800;
    font-size:clamp(2.3rem, 9vh, 3.7rem); letter-spacing:0.14em;
    color:var(--ink); margin:0.3em 0 0.1em;
  }
  .mc-rule{ width:0; height:2px; background:var(--shu); margin:14px auto; }
  .screen.active .mc-rule{ animation:ruleGrow .8s cubic-bezier(.2,.8,.3,1) forwards .6s; }
  @keyframes ruleGrow{ to{ width:64px; } }
  .mc-meta{ font-size:0.88rem; color:var(--ink-soft); letter-spacing:0.22em; }
  .mc-guide{
    margin-top:clamp(14px,3vh,24px);
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.7rem; letter-spacing:0.16em; color:var(--ink-soft);
  }

 {w:"あへなし", pos:"形", mean:"あっけない・どうしようもない", expl:"張り合いがなく、あっけなく終わってしまう様子を表す語。", mne:"『敢へ無し』＝手ごたえが無い→『あっけない』と結びつける。", senses:[{m:"あっけない・張り合いがない",ex:[{t:"頼みし人の[[あへなく]]亡せぬ。",tr:"頼りにしていた人があっけなく亡くなった。"},{t:"敵、[[あへなく]]敗れて逃げ去る。",tr:"敵はあっけなく敗れて逃げ去る。"},{t:"[[あへなき]]最期を遂げたる人なり。",tr:"あっけない最期を遂げた人である。"}]},{m:"どうしようもない・力が抜ける",ex:[{t:"かくなるうへは、[[あへなし]]とて嘆くばかりなり。",tr:"こうなってしまっては、どうしようもないと嘆くばかりである。"},{t:"家焼けて、[[あへなく]]ただ立ち尽くす。",tr:"家が焼けて、どうしようもなくただ立ち尽くす。"},{t:"頼みの綱切れて、[[あへなし]]と思ふ。",tr:"頼みの綱が切れて、力が抜けたと思う。"}]}]},
 {w:"あやし", pos:"形", mean:"不思議だ・身分が低い・粗末だ", expl:"『怪し』（不思議）と『賤し』（身分が低い）の両方の意味を持つ多義語で文脈判断が必要。", mne:"『怪しい人＝身分の低い人』という連想で二つの意味を一度に覚える。", senses:[{m:"不思議だ・怪しい",ex:[{t:"そこはかとなく書きつくれば、[[あやしう]]こそものぐるほしけれ。",tr:"とりとめもなく書きつけると、妙に気が変になったような気持ちがする。",s:"徒然草（序段）"},{t:"[[あやしがり]]て、寄りて見るに、筒の中光りたり。",tr:"不思議に思って、近寄って見ると、筒の中が光っている。",s:"竹取物語"},{t:"夜更けてかかる声の聞こゆるは[[あやしき]]ことなり。",tr:"夜更けにこのような声が聞こえるのは不思議なことだ。"}]},{m:"身分が低い・粗末だ",ex:[{t:"[[あやしき]]しづの家に住まひて、世を過ぐす。",tr:"身分の低い者の粗末な家に住んで、世を過ごす。"},{t:"[[あやしき]]衣を着て、物乞ふ。",tr:"粗末な着物を着て、物乞いをする。"},{t:"[[あやしき]]者なれど、心はいと正し。",tr:"身分の低い者だが、心はたいそう正しい。"}]}]},
 {w:"あやなし", pos:"形", mean:"筋道が立たない・わけがわからない", expl:"『文目（あや）無し』で、物事の道理や模様が乱れて判別できない様子を表す。", mne:"『文目（あや）』＝模様・筋道が『無し』→わけがわからない、と漢字で覚える。", senses:[{m:"筋道が立たない・理屈に合わない",ex:[{t:"[[あやなき]]ことを言ふ人かな。",tr:"筋の通らないことを言う人だなあ。"},{t:"その言ひ分、いと[[あやなし]]。",tr:"その言い分は、まったく筋が通らない。"},{t:"[[あやなき]]疑ひをかけらる。",tr:"理屈に合わない疑いをかけられる。"}]}]},
 {w:"あやにくなり", pos:"形動", mean:"意地が悪い・あいにくだ・（程度が）ひどい", expl:"物事が都合悪く進む様子、また人の性質が意地悪いことを表す。", mne:"現代語『あいにく』の語源で、『都合が悪い』を軸に覚える。", senses:[{m:"意地が悪い",ex:[{t:"[[あやにくなる]]心にて、人を困らせたまふ。",tr:"意地の悪い心で人をお困らせになる。"},{t:"[[あやにくなる]]人の、わざと戸を閉ざす。",tr:"意地の悪い人が、わざと戸を閉ざす。"},{t:"わが願ひをわざと妨ぐるは、[[あやにくなり]]。",tr:"私の願いをわざと妨げるのは、意地が悪い。"}]},{m:"あいにくだ・都合が悪い",ex:[{t:"出でむとするに、[[あやにくに]]雨降りいづ。",tr:"出かけようとすると、あいにく雨が降り出した。"},{t:"訪ねむとせし日、[[あやにくに]]客の来たり。",tr:"訪ねようとした日、あいにく客が来た。"},{t:"[[あやにくなる]]ことに、風さへ吹き出でぬ。",tr:"あいにくなことに、風まで吹き出した。"}]}]},
 {w:"あらぬ", pos:"連体詞", mean:"意外な・思いがけない・別の", expl:"『あり』の未然形『あら』＋打消『ぬ』が連体詞化し、『そうではない』という意外性を表す。", mne:"『あら（ず）＋ぬ』→『そうではない方の』→『意外な・別の』と展開して覚える。", senses:[{m:"意外な・思いがけない",ex:[{t:"[[あらぬ]]ことを言はれて驚きぬ。",tr:"思いがけないことを言われて驚いた。"},{t:"[[あらぬ]]所にて旧き友に会ふ。",tr:"思いがけない所で旧友に会う。"},{t:"[[あらぬ]]ことを聞きて、胸騒ぎす。",tr:"思いがけないことを聞いて、胸が騒ぐ。"}]},{m:"別の・ほかの",ex:[{t:"[[あらぬ]]方を見て知らぬ顔なり。",tr:"別の方を見て知らないふりをしている。"},{t:"呼ばれて、[[あらぬ]]人の返事す。",tr:"呼ばれて、別の人が返事をする。"},{t:"声をかけしに、[[あらぬ]]方へ行きぬ。",tr:"声をかけたのに、別の方へ行ってしまった。"}]}]},
 {w:"あらまし", pos:"名", mean:"前もっての予想・計画・あらすじ", expl:"物事が起こる前にあらかじめ思い描く内容を指す。現代語『あらまし（大要）』にも通じる。", mne:"『あらかじめ』の『あら』から『前もっての予定・概要』を連想する。", senses:[{m:"前もっての予想・計画",ex:[{t:"行く末の[[あらまし]]ばかり語りて日を暮らす。",tr:"将来の計画ばかり語って日を暮らす。"},{t:"家を建つる[[あらまし]]を語る。",tr:"家を建てる計画を語る。"},{t:"心に思ふ[[あらまし]]のみ多くして、事成らず。",tr:"心に思う計画ばかり多くて、事が成らない。"}]},{m:"あらすじ・大体",ex:[{t:"事の[[あらまし]]を人に告ぐ。",tr:"事のあらすじを人に告げる。"},{t:"物語の[[あらまし]]を聞く。",tr:"物語のあらすじを聞く。"},{t:"事の[[あらまし]]ばかり知りて、詳しくは知らず。",tr:"事の大体だけ知って、詳しくは知らない。"}]}]},
 {w:"あらまほし", pos:"形", mean:"理想的だ・そうあってほしい", expl:"『あり』の未然形に願望の助動詞『まほし』が付いた語が形容詞化したもの。", mne:"『あり＋まほし（願望）』＝『こうあってほしい』＝理想的、と語構成から覚える。", senses:[{m:"理想的だ・申し分ない",ex:[{t:"[[あらまほしき]]人の御ありさまなり。",tr:"理想的な方のご様子である。"},{t:"[[あらまほしき]]妻にて、家も栄ゆ。",tr:"理想的な妻で、家も栄える。"},{t:"師は[[あらまほしき]]人にて、学ぶ者多し。",tr:"師は申し分のない人で、学ぶ者が多い。"}]},{m:"そうあってほしい・望ましい",ex:[{t:"少しのことにも、先達は[[あらまほしき]]事なり。",tr:"ちょっとしたことでも、案内人（先達）はあってほしいものだ。",s:"徒然草（第五十二段）"},{t:"世の乱れざるぞ[[あらまほしき]]。",tr:"世が乱れないことこそ望ましい。"},{t:"心静かなる暮らしぞ[[あらまほし]]。",tr:"心静かな暮らしこそあってほしい。"}]}]},
 {w:"ありがたし", pos:"形", mean:"めったにない・貴重だ", expl:"現代語の『感謝』の意味ではなく、『有ることが難しい＝珍しい』が原義。", mne:"『有り難し』＝存在するのが難しい→『めったにない』と原義から覚える。", senses:[{m:"めったにない・珍しい",ex:[{t:"[[ありがたき]]もの。舅にほめらるる婿。",tr:"めったにないもの。舅にほめられる婿。",s:"枕草子（ありがたきもの）"},{t:"かかる友こそ世に[[ありがたき]]ものなれ。",tr:"このような友は世にめったにないものだ。"},{t:"かかる心ばへは、世に[[ありがたし]]。",tr:"このような心づかいは、世にめったにない。"}]}]},
 {w:"ありく", pos:"動（四段）", mean:"歩き回る・動き回る", expl:"単に『歩く』だけでなく、あちこち動き回る様子を表す。", mne:"『あり＋く』で、その場に『あり』続けず動き『く』（行く）イメージ。", senses:[{m:"歩き回る・動き回る",ex:[{t:"月見[[ありく]]こと侍りしに",tr:"月を見て歩き回ることがありましたが",s:"徒然草（第三十二段）"},{t:"夜な夜な野辺を[[ありき]]たまふ。",tr:"夜ごと野辺を歩き回りなさる。"},{t:"子ども、庭に出でて[[ありく]]。",tr:"子どもたちは庭に出て歩き回る。"}]}]},
 {w:"ありつる（ありし）", pos:"連体詞", mean:"先ほどの・以前の", expl:"『あり』の連体形が過去の出来事を指し示す表現として定着したもの。", mne:"『ありつる』＝『あった、あの』と、直前の出来事を指す指示語として覚える。", senses:[{m:"先ほどの・以前の",ex:[{t:"昔[[ありし]]家はまれなり。",tr:"昔あった家はまれである。",s:"方丈記（ゆく河の流れ）"},{t:"かく[[ありし]]時過ぎて",tr:"こうして過ぎ去った以前の時が過ぎて",s:"蜻蛉日記"},{t:"[[ありつる]]人はいづこへ行きぬる。",tr:"先ほどの人はどこへ行ってしまったのか。"}]}]},
 {w:"あるじ（す）", pos:"名／動", mean:"主人／ご馳走する・もてなす", expl:"名詞では『主人』、サ変動詞化すると『饗応する・もてなす』の意味になる。", mne:"『あるじす』は『主人としてもてなす』と動詞化した形で覚える。", senses:[{m:"主人",ex:[{t:"[[あるじ]]出で来て、客を迎ふ。",tr:"主人が出てきて、客を迎える。"},{t:"家の[[あるじ]]、客を迎へて酒を勧む。",tr:"家の主人が、客を迎えて酒を勧める。"},{t:"山寺の[[あるじ]]の僧、茶を点つ。",tr:"山寺の主である僧が、茶を点てる。"}]},{m:"ご馳走する・もてなす",ex:[{t:"遠き旅の人を、いとねんごろに[[あるじし]]たまふ。",tr:"遠方からの旅人を、たいそう丁寧にもてなしなさる。"},{t:"友の来たれば、心ばかりの[[あるじ]]せむ。",tr:"友が来たので、心ばかりのもてなしをしよう。"},{t:"雪の夜、客を[[あるじし]]て、酒を勧む。",tr:"雪の夜、客をもてなして、酒を勧める。"}]}]},
 {w:"いうげんなり", pos:"形動", mean:"優雅だ・上品だ", expl:"優れた美しさ・上品さを称える語で、和歌や人物の趣を評する際に用いられる。", mne:"『優』の字のイメージそのまま『優雅・上品』と覚える。", senses:[{m:"優雅だ・上品だ",ex:[{t:"[[いうげんなる]]姿にて舞ひたまふ。",tr:"優雅な姿でお舞いになる。"},{t:"[[いうげんなる]]舞ひに、人々見入る。",tr:"優雅な舞に、人々が見入る。"},{t:"声[[いうげんなる]]女房なり。",tr:"声の優雅な女房である。"}]}]},
 {w:"いかが", pos:"副", mean:"どう・どのように・どうして", expl:"状態や方法を問う疑問、また反語表現にも用いられる。", mne:"現代語『いかが（ですか）』とほぼ同じ感覚で使える。", senses:[{m:"どう・どのように",ex:[{t:"この事、[[いかが]]すべき。",tr:"このことは、どうしたらよいか。"},{t:"今宵の月、[[いかが]]見たまふ。",tr:"今夜の月を、どのようにご覧になるか。"},{t:"事のなりゆき、[[いかが]]あらむ。",tr:"事の成り行きは、どうだろうか。"}]},{m:"どうして～か（反語）",ex:[{t:"この家にて生まれし女子の、もろともに帰らねば、[[いかが]]は悲しき。",tr:"この家で生まれた女の子が、一緒に帰らないので、どれほど悲しいことか。",s:"土佐日記"},{t:"かかる世に、[[いかが]]頼むべき。",tr:"こんな世の中で、どうして頼りにできようか（いや、できない）。"},{t:"[[いかが]]知らむ、遠き人の心を。",tr:"どうして知ろうか、遠い人の心を。"}]}]},
 {w:"いかで", pos:"副", mean:"どうにかして（願望）／どうして（疑問・反語）", expl:"下に意志・願望表現を伴えば『なんとかして』、疑問語として使えば『どうして』となる。", mne:"下に『ばや・む』などの願望があれば『なんとかして』と訳す、とセットで覚える。", senses:[{m:"なんとかして",ex:[{t:"世の中に物語といふもののあんなるを、[[いかで]]見ばやと思ひつつ",tr:"世の中に物語というものがあるそうなのを、なんとかして見たいと思いながら",s:"更級日記"},{t:"[[いかで]]このかぐや姫を得てしがな",tr:"なんとかしてこのかぐや姫を妻にしたいものだ",s:"竹取物語"},{t:"[[いかで]]この花を見ばや。",tr:"なんとかしてこの花を見たいものだ。"}]},{m:"どうして（疑問・反語）",ex:[{t:"そらに[[いかで]]かおぼえ語らむ。",tr:"そらでどうして覚えて語れようか。",s:"更級日記"},{t:"[[いかで]]かくは言ふべき。",tr:"どうしてこのように言えようか。"},{t:"[[いかで]]人に告げむ、この恥を。",tr:"どうして人に告げようか、この恥を。"}]}]},
]},
{id:3, words:[
 {w:"いかに", pos:"副", mean:"どのように・どんなに", expl:"状態・程度を問う疑問副詞で、会話の呼びかけにも使われる。", mne:"『いかに』は『いかが』の仲間で『どのように』の意味と覚える。", senses:[{m:"どのように",ex:[{t:"今は[[いかに]]なりたまひぬらむ。",tr:"今はどうなっておしまいになったのだろう。"},{t:"この件、[[いかに]]計らひたまふ。",tr:"この件は、どのようにお取り計らいになるか。"},{t:"[[いかに]]して都へ上らむ。",tr:"どのようにして都へ上ろうか。"}]},{m:"どんなに（～だろう）",ex:[{t:"[[いかに]]心もとなく思すらむ。",tr:"どんなにじれったくお思いでしょう。",s:"十訓抄"},{t:"親の心は[[いかに]]嬉しからむ。",tr:"親の心はどんなに嬉しいことだろう。"},{t:"母の悲しみは[[いかに]]深からむ。",tr:"母の悲しみはどんなに深いだろう。"}]}]},
 {w:"いそぎ", pos:"名", mean:"準備・急ぐこと", expl:"何かのために急いで用意を整えることを指す名詞。", mne:"『急ぎ』＝急いで行う『準備』と覚える。", senses:[{m:"準備・急ぐこと",ex:[{t:"旅の[[いそぎ]]に、家の者ども立ち騒ぐ。",tr:"旅の準備に、家の者たちが立ち騒ぐ。"},{t:"年の暮れの[[いそぎ]]に、家々騒がし。",tr:"年の暮れの準備で、家々が騒がしい。"},{t:"祭りの[[いそぎ]]をすとて、人々集ふ。",tr:"祭りの準備をするといって、人々が集まる。"}]}]},
 {w:"いたく", pos:"副", mean:"ひどく・たいそう", expl:"程度の甚だしさを表す副詞。下に打消を伴うと『たいして～ない』となる。", mne:"『甚く（いたく）』＝『痛いほど』ひどく、と語感で覚える。", senses:[{m:"ひどく・たいそう",ex:[{t:"大弐の乳母の[[いたく]]わづらひて尼になりにける",tr:"大弐の乳母がひどく患って尼になったのを",s:"源氏物語（夕顔）"},{t:"風[[いたく]]吹きて、木々の枝折れぬ。",tr:"風がひどく吹いて、木々の枝が折れた。"},{t:"雨[[いたく]]降りて、川の水増さる。",tr:"雨がひどく降って、川の水が増える。"}]},{m:"（打消を伴って）たいして～ない",ex:[{t:"世のおぼえ花やかなる御方々にも[[いたう]]劣らず",tr:"世間の評判が華やかな御方々にもたいして劣らず",s:"源氏物語（桐壺）"},{t:"親の死にも[[いたく]]嘆かざりけり。",tr:"親の死にもたいして嘆かなかった。"},{t:"この雪は[[いたく]]積もらざりけり。",tr:"この雪はたいして積もらなかった。"}]}]},
 {w:"いたづらなり", pos:"形動", mean:"むなしい・無駄だ・することがない", expl:"現代語『いたずら（悪ふざけ）』とは異なり、『空しい・無為だ』を表す。", mne:"『徒（いたづら）』＝実がない→『むなしい・無駄』と覚える。", senses:[{m:"むなしい・無駄だ",ex:[{t:"[[いたづらに]]日を過ぐすこそ惜しけれ。",tr:"むなしく日を過ごすのは惜しいことだ。"},{t:"努め[[いたづらに]]なりぬ。",tr:"努力が無駄になった。"},{t:"[[いたづらなる]]手習ひして、日を暮らす。",tr:"無駄な手習いをして、日を暮らす。"}]},{m:"することがない・ひまだ",ex:[{t:"[[いたづらなる]]身を持て余し、庭に出で居る。",tr:"することのない身を持て余して、庭に出て座っている。"},{t:"[[いたづらなる]]昼間、碁を打ちて遊ぶ。",tr:"することのない昼間、碁を打って遊ぶ。"},{t:"雨の日の[[いたづらなる]]ままに、文を書く。",tr:"雨の日のひまなのにまかせて、手紙を書く。"}]}]},
 {w:"いつく", pos:"動（四段）", mean:"大切にお世話する・大事に育てる／（神に）お仕えする", expl:"『斎く』の字を当て、心身を清めて神に仕える意味から、大切にかしずき育てる意味に広がった語。『かしづく』に近い。", mne:"『斎（いつ）く』＝清らかに大切にする、で『かしづく』とセットで覚える。", senses:[{m:"大切にお世話する・大事に育てる",ex:[{t:"親、姫君を[[いつき]]かしづく。",tr:"親は姫君を大切にお世話し育てる。"},{t:"祖母、孫を[[いつき]]て、育てたまふ。",tr:"祖母が孫を大切に世話して育てなさる。"},{t:"[[いつき]]育てし姫、世に出でぬ。",tr:"大切に育てた姫が、世に出た。"}]},{m:"（神に）お仕えする",ex:[{t:"斎宮、神を[[いつく]]ために、野の宮に籠もりたまふ。",tr:"斎宮が神にお仕えするために、野の宮にお籠もりになる。"},{t:"巫女、神を[[いつく]]ために身を清む。",tr:"巫女が神にお仕えするために身を清める。"},{t:"斎院は、神を[[いつき]]て年を送りたまふ。",tr:"斎院は、神にお仕えして年を送りなさる。"}]}]},
 {w:"いつしか", pos:"副", mean:"早く～したい（願望）／いつの間にか", expl:"下に願望表現を伴えば『早く～したい』、単独では『いつの間にか』の意。", mne:"『いつ＋しか（早く）』で『早くそうなってほしい』という気持ちを表す。", senses:[{m:"早く～したい",ex:[{t:"[[いつしか]]春になれかし。",tr:"早く春になってほしい。"},{t:"[[いつしか]]夜の明けよかし。",tr:"早く夜が明けてほしい。"},{t:"[[いつしか]]友に会はばや。",tr:"早く友に会いたい。"}]},{m:"いつの間にか",ex:[{t:"[[いつしか]]日も暮れにけり。",tr:"いつの間にか日も暮れてしまった。"},{t:"[[いつしか]]花も散りにけり。",tr:"いつの間にか花も散ってしまった。"},{t:"[[いつしか]]子は大人になりぬ。",tr:"いつの間にか子は大人になった。"}]}]},
 {w:"いと（いとど）", pos:"副", mean:"たいそう（／ますます）", expl:"『いと』は程度の甚だしさ、『いとど』はそれがさらに強まる『いよいよ・ますます』。", mne:"『いと』＝とても、『いとど』＝『いと』が『ど』（重なる）でさらに強調、と覚える。", senses:[{m:"たいそう・とても",ex:[{t:"まいて雁などのつらねたるが、[[いと]]小さく見ゆるは、いとをかし。",tr:"ましてや雁などが連なって飛んでいるのが、たいそう小さく見えるのは、とても趣がある。",s:"枕草子（第一段・秋）"},{t:"三寸ばかりなる人、[[いと]]うつくしうてゐたり。",tr:"三寸ほどの人が、たいそうかわいらしくて座っている。",s:"竹取物語"},{t:"[[いと]]美しき花なり。",tr:"たいそう美しい花である。"}]},{m:"ますます・いっそう",ex:[{t:"[[いとど]]ゆかしさまされど",tr:"ますます見たい気持ちがまさるけれど",s:"更級日記"},{t:"[[いとど]]悲しさまさりぬ。",tr:"ますます悲しさが増した。"},{t:"月上りて、[[いとど]]あたり明かし。",tr:"月が上って、いっそうあたりが明るい。"}]}]},
 {w:"いとほし", pos:"形", mean:"かわいそうだ・いとおしい・気の毒だ", expl:"相手への同情や愛情から生まれる、心が痛むような気持ちを表す。", mne:"現代語『いとおしい』の語源で、『かわいそう＋愛しい』の両面を持つ。", senses:[{m:"かわいそうだ・気の毒だ",ex:[{t:"泣く子を見て、[[いとほし]]くて、え捨てず。",tr:"泣く子を見て、かわいそうで、捨てることができない。"},{t:"老いたる親の嘆くを見て、[[いとほし]]と思ふ。",tr:"老いた親が嘆くのを見て、気の毒だと思う。"},{t:"濡れそぼちたる童を、[[いとほし]]がる。",tr:"ずぶ濡れの子どもを気の毒がる。"}]},{m:"いとしい・かわいい",ex:[{t:"[[いとほしき]]妻子を残して旅立つ。",tr:"いとしい妻子を残して旅立つ。"},{t:"幼き子の寝顔の[[いとほしき]]。",tr:"幼い子の寝顔のいとしいこと。"},{t:"[[いとほしく]]思ふ人を、遠くへやる。",tr:"いとしく思う人を、遠くへ行かせる。"}]}]},
 {w:"いぶかし", pos:"形", mean:"気がかりだ・知りたい・不審だ", expl:"はっきりせず疑わしいことを知りたいと思う気持ちを表す。", mne:"『いぶかしい』は現代語にもほぼ同じ形で残っているので直感で覚える。", senses:[{m:"知りたい・見たい",ex:[{t:"事の様子[[いぶかしく]]、人を遣はして問はす。",tr:"事の様子が知りたくて、人を遣わして尋ねさせる。"},{t:"世の人の噂[[いぶかしく]]、尋ね行く。",tr:"世間の人の噂が知りたくて、尋ねて行く。"},{t:"何事のあるにか、[[いぶかしく]]覗き見る。",tr:"何事があるのかと知りたくて、のぞき見る。"}]},{m:"不審だ・気がかりだ",ex:[{t:"夜更けて叩く者あり。[[いぶかし]]とて、戸を開けず。",tr:"夜更けに戸を叩く者がいる。不審だと思って、戸を開けない。"},{t:"見知らぬ者の来るを、[[いぶかし]]と思ふ。",tr:"見知らぬ者が来るのを、不審に思う。"},{t:"戸を叩く者の声[[いぶかし]]。",tr:"戸を叩く者の声が怪しい。"}]}]},
 {w:"いふかひなし", pos:"形", mean:"言ってもしかたない・どうしようもない・取るに足りない", expl:"『言ふ甲斐無し』の意で、言葉にする価値もないほどのひどさ・つまらなさを表す。", mne:"『言ふ＋甲斐（かひ）＋無し』＝言う価値がない、と語構成で覚える。", senses:[{m:"言ってもしかたない・どうしようもない",ex:[{t:"聞きしよりもまして、[[言ふかひなく]]ぞこぼれ破れたる。",tr:"聞いていたよりもまして、言いようもないほどに壊れ傷んでいる。",s:"土佐日記"},{t:"今さら嘆くも[[いふかひなし]]。",tr:"今さら嘆いても言ってもしかたがない。"},{t:"今さら悔ゆとも、[[いふかひなし]]。",tr:"今さら悔やんでも、言ってもしかたがない。"}]},{m:"取るに足りない・身分が低い",ex:[{t:"[[いふかひなき]]下衆の身なれど、心ばへは優れたり。",tr:"取るに足りない卑しい身分だが、心がけは優れている。"},{t:"[[いふかひなき]]者の言ふこと、用ゐられず。",tr:"取るに足りない者の言うことは、取り上げられない。"},{t:"[[いふかひなき]]山賤の家にも宿りぬ。",tr:"身分の低い山人の家にも泊まった。"}]}]},
 {w:"いまやう", pos:"名", mean:"当世風・現代風", expl:"『今様』と書き、その時代の流行・最新のスタイルを指す。", mne:"『今』＋『様（やう）』＝『今どきの様式』とそのまま覚える。", senses:[{m:"当世風・現代風",ex:[{t:"[[いまやう]]の装束いとはなやかなり。",tr:"当世風の装束がたいそう華やかである。"},{t:"[[いまやう]]の髪形、見慣れぬ人も多し。",tr:"当世風の髪形は、見慣れない人も多い。"},{t:"この衣、[[いまやう]]にして目立つ。",tr:"この着物は当世風で目立つ。"}]}]},
 {w:"いみじ", pos:"形", mean:"（程度が）はなはだしい・すばらしい／ひどい", expl:"良い意味にも悪い意味にも使われる、程度の強さだけを表す最重要語。文脈判断が必須。", mne:"善悪どちらにも使う『ものすごい』という万能の強調語と覚える。", senses:[{m:"たいそう・非常に",ex:[{t:"[[いみじく]]心もとなく、ゆかしくおぼゆるままに",tr:"たまらなくじれったく、見たく思われるままに",s:"更級日記"},{t:"[[いみじく]]美しき児なり。",tr:"たいそう美しい子である。"},{t:"[[いみじく]]寒き朝、霜柱立つ。",tr:"たいそう寒い朝、霜柱が立つ。"}]},{m:"すばらしい・立派だ",ex:[{t:"世は定めなきこそ[[いみじけれ]]。",tr:"世は無常であることこそすばらしい。",s:"徒然草（第七段）"},{t:"[[いみじき]]歌を詠みたまひけり。",tr:"すばらしい歌をお詠みになった。"},{t:"[[いみじき]]絵師ありて、名を世に知らる。",tr:"すぐれた絵師がいて、名を世に知られる。"}]},{m:"ひどい・つらい",ex:[{t:"[[いみじき]]目を見て、人に会はず。",tr:"ひどい目にあって、人に会わない。"},{t:"[[いみじき]]別れの悲しみに、涙も出でず。",tr:"ひどい別れの悲しみに、涙も出ない。"},{t:"雨風の[[いみじき]]夜なり。",tr:"雨風のひどい夜である。"}]}]},
 {w:"いやし", pos:"形", mean:"身分が低い・見苦しい・粗末だ", expl:"『賤し』の字を当て、身分の低さと、それに伴う見た目の粗末さの両方を表す。", mne:"現代語『卑しい』とほぼ同じ感覚でよい。", senses:[{m:"身分が低い",ex:[{t:"高き、[[賤しき]]、人の住まひは",tr:"身分の高い者、低い者の住まいは",s:"方丈記（ゆく河の流れ）"},{t:"貴なるも[[賤しき]]も",tr:"高貴な者も身分の低い者も",s:"竹取物語"},{t:"[[いやしき]]身なれど、心清し。",tr:"身分は低いが、心は清らかだ。"}]},{m:"見苦しい・下品だ",ex:[{t:"[[いやしき]]言葉遣ひは、聞きにくし。",tr:"下品な言葉遣いは聞きにくい。"},{t:"[[いやしき]]言葉を使ふ人は、人に避けらる。",tr:"下品な言葉を使う人は、人に避けられる。"},{t:"[[いやしき]]姿にて参るは、恥づかし。",tr:"見苦しい姿で参上するのは、恥ずかしい。"}]}]},
 {w:"うし", pos:"形", mean:"つらい・いやだ", expl:"心情的な苦しさ・嫌悪感を表す形容詞で、『憂し』の字を当てる。", mne:"『憂し（うし）』＝『憂鬱（ゆううつ）』の『憂』とつなげて覚える。", senses:[{m:"つらい・いやだ",ex:[{t:"世の中は[[うし]]と思ひて、山に入る。",tr:"世の中をつらいと思って、山に入る。"},{t:"人の心を[[うし]]と思ひて、都を出づ。",tr:"人の心をつらいと思って、都を出る。"},{t:"かく日を送るも、[[うき]]ことなり。",tr:"こうして日を送るのも、つらいことだ。"}]}]},
 {w:"うしろめたし", pos:"形", mean:"気がかりだ・不安だ", expl:"後ろに何か心配事が控えているような、落ち着かない不安を表す。", mne:"現代語『後ろめたい』（罪悪感）とは少しずれ、古文では単に『不安・心配』。", senses:[{m:"気がかりだ・不安だ",ex:[{t:"行く末[[うしろめたく]]、眠られず。",tr:"将来が気がかりで、眠れない。"},{t:"幼き子を置きて行くは、[[うしろめたし]]。",tr:"幼い子を置いて行くのは、気がかりだ。"},{t:"旅の空の夫、[[うしろめたく]]思はる。",tr:"旅の空の夫が、不安に思われる。"}]}]},
]},
{id:4, words:[
 {w:"うしろやすし", pos:"形", mean:"安心だ", expl:"『うしろめたし』の対義語で、後を任せても安心だという気持ちを表す。", mne:"『うしろめたし』とセットで対義語として覚える（不安⇔安心）。", senses:[{m:"安心だ",ex:[{t:"頼もしき人あれば、[[うしろやすし]]。",tr:"頼もしい人がいるので、安心だ。"},{t:"後ろ見する人のあれば、[[うしろやすし]]。",tr:"後見をする人がいるので、安心だ。"},{t:"子を預くる所、[[うしろやすき]]ほどなり。",tr:"子を預ける所は、安心できるところである。"}]}]},
 {w:"うたてし", pos:"副／形動", mean:"いやな感じに・ますます（悪く）・情けなく", expl:"物事がどんどん悪い方向へ進んでいく、不快な変化を表す語。", mne:"『うたて』＝『うとましい方向へ移っていく』とイメージで覚える。", senses:[{m:"いやだ・情けない",ex:[{t:"この世の有様、[[うたて]]ものうし。",tr:"この世のありさまは、いやでものうい。"},{t:"[[うたてき]]ことのみ多き世なり。",tr:"いやなことばかり多い世の中である。"},{t:"人の悪口を聞くも、[[うたて]]。",tr:"人の悪口を聞くのも、いやなことだ。"}]},{m:"ますます（ひどく）",ex:[{t:"雨風[[うたて]]まさりて、船出づべくもあらず。",tr:"雨風がますますひどくなって、船は出せそうもない。"},{t:"病[[うたて]]重くなりて、起き上がれず。",tr:"病気がますます重くなって、起き上がれない。"},{t:"日暮れて、風[[うたて]]吹きまさる。",tr:"日が暮れて、風がますます吹きつのる。"}]}]},
 {w:"うつくし", pos:"形", mean:"かわいらしい・いとしい", expl:"現代語『美しい』と違い、小さいものや幼い者、愛する者に対する『かわいらしさ・いとしさ』を表す。", mne:"『うつくし』は『美しい』ではなく『かわいい』、と現代語とのズレを意識して覚える。", senses:[{m:"かわいらしい・いとしい",ex:[{t:"[[うつくしき]]もの。瓜にかきたる児の顔。",tr:"かわいらしいもの。瓜に描いた子どもの顔。",s:"枕草子（うつくしきもの）"},{t:"いはけなくかいやりたる額つき、髪ざしいみじう[[うつくし]]。",tr:"あどけなくかき上げた額の様子、髪の生え際がたいそうかわいらしい。",s:"源氏物語（若紫）"},{t:"[[うつくしき]]児の、這ひ出で来たる。",tr:"かわいらしい幼子が、這い出してきた。"}]}]},
 {w:"うつろふ", pos:"動（四段）", mean:"色あせる・衰える・心変わりする", expl:"花や葉の色が変化する様子から転じて、人の心が移り変わることも表す。", mne:"『移ろふ』＝『移る』が続く→色があせ、心も移っていく、と覚える。", senses:[{m:"色あせる・衰える",ex:[{t:"花の色の[[うつろひ]]ゆくこそ悲しけれ。",tr:"花の色が色あせていくのは悲しい。"},{t:"秋深くして、菊の色[[うつろふ]]。",tr:"秋が深まって、菊の色があせる。"},{t:"盛りの花も[[うつろひ]]ぬべし。",tr:"盛りの花も衰えてしまうだろう。"}]},{m:"心変わりする",ex:[{t:"男の心[[うつろひ]]て、通はずなりぬ。",tr:"男の心が変わって、通ってこなくなった。"},{t:"人の心の[[うつろふ]]ことを恨む。",tr:"人の心が変わることを恨む。"},{t:"新しき人に心[[うつろひ]]て、訪れず。",tr:"新しい人に心が移って、訪れない。"}]}]},
 {w:"うるはし", pos:"形", mean:"端正だ・きちんとしている・立派だ", expl:"整然として乱れのない美しさを表す語で、単なる『美しい』より秩序を強調する。", mne:"現代語『麗しい』の語源で、『整った美しさ』とイメージする。", senses:[{m:"端正だ・きちんとしている",ex:[{t:"[[うるはしき]]装束にて参りたまふ。",tr:"きちんと整った装束で参上なさる。"},{t:"[[うるはしき]]文字にて、手紙を書く。",tr:"整った美しい文字で、手紙を書く。"},{t:"衣の紐まで[[うるはしく]]結びたり。",tr:"着物の紐までもきちんと結んでいる。"}]},{m:"立派だ・美しい",ex:[{t:"[[うるはしき]]御かたちにて、見る人目を驚かす。",tr:"立派で美しいお姿で、見る人の目を驚かす。"},{t:"[[うるはしき]]姫君の、世に並びなし。",tr:"立派で美しい姫君が、世に並ぶ者がない。"},{t:"[[うるはしく]]咲きたる桜に、人々見入る。",tr:"美しく咲いた桜に、人々が見入る。"}]}]},
 {w:"うれふ", pos:"動（下二段）", mean:"嘆く・心配する・（正式に）訴える", expl:"心を痛めて嘆いたり、時に朝廷などへ正式に訴え出ることを表す。", mne:"『憂ふ』＝『憂い』を『訴える・嘆く』、と漢字から覚える。", senses:[{m:"嘆く・心配する",ex:[{t:"世のありさまを[[うれへ]]て、涙ぐむ。",tr:"世の中のありさまを嘆いて、涙ぐむ。"},{t:"世の乱るるを[[うれへ]]て、涙を流す。",tr:"世の乱れることを嘆いて、涙を流す。"},{t:"子の病を[[うれふ]]る親の心なり。",tr:"子の病気を心配する親の心である。"}]},{m:"（正式に）訴える",ex:[{t:"国守の悪政を朝廷に[[うれふ]]。",tr:"国守の悪政を朝廷に訴える。"},{t:"民の苦しみを帝に[[うれふ]]。",tr:"民の苦しみを帝に訴える。"},{t:"訴人、官に[[うれへ]]て、裁きを請ふ。",tr:"訴える人が、役所に訴えて、裁きを求める。"}]}]},
 {w:"え（～ず）", pos:"副", mean:"～できない", expl:"下に打消を伴って不可能を表す呼応の副詞。", mne:"『え』を見たら文末に『ず・じ』などの打消を探す、とセットで覚える。", senses:[{m:"～できない（不可能）",ex:[{t:"女の[[え]]得まじかりけるを",tr:"手に入れることができそうになかった女を",s:"伊勢物語（芥川）"},{t:"おぼろけの紙は[[え]]張るまじければ",tr:"並大抵の紙では張ることができそうにないので",s:"枕草子（中納言参りたまひて）"},{t:"[[え]]行かず、立ち尽くしぬ。",tr:"行くことができず、立ち尽くした。"}]}]},
 {w:"えうなし", pos:"形", mean:"必要ない・つまらない・役に立たない", expl:"『用（えう）無し』で、必要性がなく無駄であることを表す。", mne:"『用（えう）』が『無し』＝必要ない、と漢字構成で覚える。", senses:[{m:"必要ない・役に立たない",ex:[{t:"身を[[えうなき]]ものに思ひなして",tr:"わが身を無用のものと思い込んで",s:"伊勢物語（東下り）"},{t:"[[えうなき]]ことに心を砕くな。",tr:"必要のないことに心を砕くな。"},{t:"[[えうなき]]物を買ひて、銭を失ふ。",tr:"必要のない物を買って、金を失う。"}]}]},
 {w:"えならず", pos:"連語", mean:"なんとも言えないほどすばらしい", expl:"『得（え）＋ならず』で、言葉で言い表すことができないほどの称賛を表す。", mne:"『え（言え）』＋『ならず』＝言い表せない→最上級の褒め言葉と覚える。", senses:[{m:"なんとも言えないほどすばらしい",ex:[{t:"[[えならぬ]]香りの漂ふ。",tr:"なんとも言えないほどすばらしい香りが漂う。"},{t:"[[えならぬ]]調べの、風に乗りて聞こゆ。",tr:"なんとも言えないほどすばらしい調べが、風に乗って聞こえる。"},{t:"[[えならず]]美しき錦なり。",tr:"なんとも言えないほど美しい錦である。"}]}]},
 {w:"えんご（修辞法）", pos:"名（修辞法）", mean:"縁語（意味の関連する語を散りばめる技法）", expl:"和歌の中で、ある語と意味的に関連の深い語を意図的に配置する修辞技法。", mne:"『縁』のある語（えんご）をつなげる技法、と漢字の意味から直接覚える。", senses:[{m:"意味の関連する語を散りばめる技法",ex:[{t:"「糸」「縒る」「切る」などを歌に詠み込むは、[[えんご]]なり。",tr:"「糸」「縒る」「切る」などを歌に詠み込むのは、縁語である。"},{t:"「露」「置く」「消ゆ」と続くは、[[えんご]]の例なり。",tr:"「露」「置く」「消ゆ」と続くのは、縁語の例である。"},{t:"歌に[[えんご]]を用ゐて、趣を添ふ。",tr:"歌に縁語を用いて、趣を添える。"}]}]},
 {w:"えんなり", pos:"形動", mean:"艶やかだ・優美だ", expl:"『艶』の字を当て、なまめかしく美しい魅力を表す。", mne:"漢字『艶』のイメージそのまま『艶やか・優美』と覚える。", senses:[{m:"艶やかだ・優美だ",ex:[{t:"大方の空も[[艶なる]]に",tr:"あたり一面の空も優美なのに",s:"紫式部日記"},{t:"[[えんなる]]姿にて、袖ひるがへす。",tr:"艶やかで優美な姿で、袖をひるがえす。"},{t:"[[えんなる]]文を、人に送る。",tr:"艶やかな手紙を、人に送る。"}]}]},
 {w:"おきつ", pos:"動（下二段）", mean:"定める・取り決める", expl:"物事の方針や約束をあらかじめ決めておくことを表す。", mne:"『掟（おきて）』を『つ（作る）』→物事を定める、と関連づける。", senses:[{m:"定める・取り決める",ex:[{t:"人を[[掟て]]て、高き木に登せて梢を切らせしに",tr:"人に指図して、高い木に登らせて梢を切らせたところ",s:"徒然草（第百九段）"},{t:"日ごろ[[おきて]]しことを違へず行ふ。",tr:"前から取り決めたことをたがえず行う。"},{t:"日を[[おきて]]、客を招かむとす。",tr:"日を定めて、客を招こうとする。"}]}]},
 {w:"おくる", pos:"動（下二段）", mean:"先立たれる・死に後れる／見送る", expl:"『後る』の字が示す通り、人に先立たれて自分だけ取り残される意味が重要。", mne:"『後（おく）れる』＝人より後に残される＝先立たれる、と語源から覚える。", senses:[{m:"先立たれる・死に後れる",ex:[{t:"親に[[おくれ]]て、心細く世を過ごす。",tr:"親に先立たれて、心細く世を過ごす。"},{t:"夫に[[おくれ]]て、涙の乾く間もなし。",tr:"夫に先立たれて、涙の乾く間もない。"},{t:"友に[[おくれ]]たる身ぞ、悲しき。",tr:"友に先立たれた身は、悲しい。"}]},{m:"見送る・送る",ex:[{t:"客を門まで[[おくる]]。",tr:"客を門まで見送る。"},{t:"旅立つ友を港まで[[おくる]]。",tr:"旅立つ友を港まで見送る。"},{t:"荷を都へ[[おくる]]。",tr:"荷物を都へ送る。"}]}]},
 {w:"おこす", pos:"動（下二段）", mean:"よこす・こちらへ送ってくる", expl:"相手が自分の方に向けて何かを送ってくる動作を表す。", mne:"『遣（や）る』（あちらへ送る）の対義語として『よこす』とセットで覚える。", senses:[{m:"よこす・こちらへ送ってくる",ex:[{t:"都より文[[おこせ]]たり。",tr:"都から手紙をよこした。"},{t:"山の寺より文を[[おこせ]]たり。",tr:"山の寺から手紙をよこした。"},{t:"使ひを[[おこし]]て、安否を問ふ。",tr:"使者をよこして、安否を尋ねる。"}]}]},
 {w:"おこなひ", pos:"名", mean:"勤行・仏道修行", expl:"仏道に関する日々の勤め・修行そのものを指す仏教用語。", mne:"『行い』が仏道における『お勤め』を指すと文脈から覚える。", senses:[{m:"勤行・仏道修行",ex:[{t:"夜もすがら[[おこなひ]]して、経を読みたまふ。",tr:"一晩中勤行をして、経をお読みになる。"},{t:"朝夕の[[おこなひ]]を怠らず。",tr:"朝夕の勤行を怠らない。"},{t:"山に籠もりて、[[おこなひ]]す。",tr:"山に籠もって、仏道修行をする。"}]}]},
]},
{id:5, words:[
 {w:"おとなし", pos:"形", mean:"大人びている・思慮分別がある", expl:"現代語『おとなしい（従順）』ではなく、『大人（おとな）』らしい成熟や分別を表す。", mne:"『大人（おとな）』＋『し』＝大人らしい、と漢字から直接覚える。", senses:[{m:"大人びている・思慮分別がある",ex:[{t:"年のほどよりは[[おとなしく]]、物の道理を知りたり。",tr:"年の割には大人びていて、物の道理を知っている。"},{t:"幼けれど、[[おとなしく]]ものを言ふ。",tr:"幼いけれど、大人びて物を言う。"},{t:"思慮深く[[おとなしき]]人なり。",tr:"思慮深く分別のある人である。"}]}]},
 {w:"おとなふ", pos:"動（四段）", mean:"訪れる・音を立てる／便りをする", expl:"人を訪ねること、また物音を立てることを表す語で、『訪れ』の語源となった語。", mne:"『音（おと）』を立てて『訪ふ』＝訪れの気配、と語構成で覚える。", senses:[{m:"訪れる・訪問する",ex:[{t:"夜更けて人の[[おとなふ]]音す。",tr:"夜更けに人が訪れる音がする。"},{t:"門を叩きて[[おとなふ]]人あり。",tr:"門を叩いて訪れる人がいる。"},{t:"久しく[[おとなは]]ざりつれば、おぼつかなし。",tr:"長く訪れなかったので、気がかりだ。"}]},{m:"音を立てる・音がする",ex:[{t:"風の[[おとなふ]]音、木の葉を鳴らす。",tr:"風が音を立てて、木の葉を鳴らす。"},{t:"谷川の水の[[おとなふ]]夜なり。",tr:"谷川の水が音を立てる夜である。"},{t:"風の[[おとなひ]]に、目を覚ましぬ。",tr:"風の音に、目を覚ました。"}]}]},
 {w:"おどろおどろし", pos:"形", mean:"気味が悪い・仰々しい・大げさだ", expl:"不気味さや、物事の大げさで誇張された様子を表す。", mne:"『おどろ』を重ねた語で、驚くほど大げさ・不気味、と覚える。", senses:[{m:"気味が悪い・不気味だ",ex:[{t:"[[おどろおどろしき]]物の声、夜ごとに聞こゆ。",tr:"気味の悪い物の声が、夜ごとに聞こえる。"},{t:"[[おどろおどろしき]]声して、犬ほゆ。",tr:"気味の悪い声がして、犬が吠える。"},{t:"[[おどろおどろしく]]雷鳴りて、人々恐る。",tr:"不気味に雷が鳴って、人々は恐れる。"}]},{m:"仰々しい・大げさだ",ex:[{t:"[[おどろおどろしく]]祈りののしる。",tr:"仰々しく祈り騒ぐ。"},{t:"[[おどろおどろしき]]名乗りをして、陣に入る。",tr:"仰々しい名乗りをして、陣に入る。"},{t:"[[おどろおどろしく]]言ひ立つるな。",tr:"大げさに言い立てるな。"}]}]},
 {w:"おどろく・おどろかす", pos:"動", mean:"はっと気づく・目を覚ます／びっくりさせる・気づかせる", expl:"現代語の『驚く（びっくり）』よりも『はっと気づく』意味が古文では中心。", mne:"『驚く』はまず『ハッと目覚める・気づく』を第一義として思い出す。", senses:[{m:"はっと気づく・目を覚ます",ex:[{t:"夜半にふと[[おどろき]]て、月を見る。",tr:"夜中にふと目を覚まして、月を見る。"},{t:"風の音に[[おどろき]]て、起き出づ。",tr:"風の音にはっと目を覚まして、起き出す。"},{t:"夢[[おどろき]]て、ただ涙ぐむ。",tr:"夢から覚めて、ただ涙ぐむ。"}]},{m:"気づかせる・起こす",ex:[{t:"人を[[おどろかし]]て、起こさせたまふ。",tr:"人に気づかせて、起こさせなさる。"},{t:"うたた寝の人を[[おどろかす]]。",tr:"うたた寝の人を起こす。"},{t:"鐘の音ぞ、人を[[おどろかす]]。",tr:"鐘の音が、人を目覚めさせる。"}]}]},
 {w:"おのづから", pos:"副", mean:"自然に・ひとりでに／たまたま", expl:"人為でなく自然のなりゆきで物事が起こる様子を表す。", mne:"『自（おの）づから』＝『自ずから』とほぼ同じ漢字で覚えやすい。", senses:[{m:"自然に・ひとりでに",ex:[{t:"げに[[おのづから]]慰みゆく",tr:"本当に自然と気持ちが慰められていく",s:"更級日記"},{t:"[[おのづから]]軽き方にも見えしを",tr:"自然と軽い身分のようにも見えたが",s:"源氏物語（桐壺）"},{t:"[[おのづから]]心の晴れゆく。",tr:"自然と心が晴れていく。"}]},{m:"たまたま・偶然",ex:[{t:"[[おのづから]]昔の友に出で逢ひぬ。",tr:"たまたま昔の友に出会った。"},{t:"[[おのづから]]道にて昔の人に会ふ。",tr:"たまたま道で昔の人に会う。"},{t:"[[おのづから]]聞きしことを、人に語る。",tr:"たまたま聞いたことを、人に語る。"}]}]},
 {w:"おはす", pos:"動", mean:"いらっしゃる（尊敬）", expl:"『あり・をり・行く・来』の尊敬語として幅広く使われる最重要敬語動詞。", mne:"『おはす』は『いる・行く・来る』何でも『いらっしゃる』と訳す万能敬語。", senses:[{m:"いらっしゃる",ex:[{t:"尊くこそ[[おはしけれ]]",tr:"尊くいらっしゃったのだなあ",s:"徒然草（第五十二段）"},{t:"五条なる家尋ねて[[おはしたり]]",tr:"五条にある家を尋ねていらっしゃった",s:"源氏物語（夕顔）"},{t:"宮、御簾の内に[[おはします]]。",tr:"宮は、御簾の内にいらっしゃる。"}]}]},
 {w:"おぼえ", pos:"名", mean:"評判・寵愛・記憶", expl:"人からどう思われているか、特に主君からの寵愛の程度を表すことが多い。", mne:"『覚え』＝『人からの覚え（評価）がよい』という現代語の言い回しから覚える。", senses:[{m:"評判・寵愛",ex:[{t:"世の[[おぼえ]]花やかなる御方々にも",tr:"世間の評判が華やかな御方々にも",s:"源氏物語（桐壺）"},{t:"帝の御[[おぼえ]]めでたき人なり。",tr:"帝のご寵愛が厚い人である。"},{t:"師の[[おぼえ]]めでたき弟子なり。",tr:"師の覚えのめでたい弟子である。"}]}]},
 {w:"おぼす", pos:"動（四段）", mean:"お思いになる（尊敬）", expl:"『思ふ』の尊敬語で、貴人の心中を敬って表す最重要敬語動詞の一つ。", mne:"『思ふ』の尊敬語として『思ふ→おぼす』と対応させて覚える。", senses:[{m:"お思いになる",ex:[{t:"いと心ことに[[思ほし]]おきてたれば",tr:"たいそう格別にお考えおきになっていたので",s:"源氏物語（桐壺）"},{t:"いかに心もとなく[[思す]]らむ",tr:"どんなにじれったくお思いでしょう",s:"十訓抄"},{t:"帝、いと心苦しと[[おぼし]]て、使ひを遣はす。",tr:"帝は、たいそう心苦しいとお思いになって、使者を遣わす。"}]}]},
 {w:"おぼつかなし", pos:"形", mean:"はっきりしない・気がかりだ・待ち遠しい", expl:"物事の正体や先行きが不明瞭で、不安や焦れったさを感じる様子を表す。", mne:"現代語『おぼつかない（足取りがあやふや）』のイメージから『不明瞭・不安』を覚える。", senses:[{m:"はっきりしない・ぼんやりしている",ex:[{t:"過ぎにし年月ごろのことも[[おぼつかなかり]]ければ",tr:"過ぎ去った年月のこともはっきりしなかったので",s:"蜻蛉日記"},{t:"月影[[おぼつかなく]]、道も見えず。",tr:"月の光がぼんやりして、道も見えない。"},{t:"霞こめて、山の姿[[おぼつかなし]]。",tr:"霞がたちこめて、山の姿がぼんやりしている。"}]},{m:"気がかりだ・待ち遠しい",ex:[{t:"御覧じだに送らぬ[[おぼつかなさ]]",tr:"お見送りさえおできにならない気がかりな思い",s:"源氏物語（桐壺）"},{t:"便りの絶えて久しければ、[[おぼつかなく]]思ふ。",tr:"便りが長く絶えているので、気がかりに思う。"},{t:"行方知れぬ子の身、[[おぼつかなし]]。",tr:"行方知れずの子の身が、気がかりだ。"}]}]},
 {w:"おほとのごもる", pos:"動", mean:"お休みになる（尊敬）", expl:"貴人が眠る・休むことを表す最高敬語の一つ。", mne:"『大殿（おほとの）ごもる』＝殿でお休みになる、と漢字イメージで覚える。", senses:[{m:"お休みになる",ex:[{t:"ある時には[[大殿籠もり]]過ぐして",tr:"ある時にはお休みになりすごして",s:"源氏物語（桐壺）"},{t:"夜更けて、帝[[おほとのごもり]]ぬ。",tr:"夜が更けて、帝はお休みになった。"},{t:"帝、早く[[おほとのごもらせ]]たまふ。",tr:"帝は、早くお休みになる。"}]}]},
 {w:"おぼゆ", pos:"動（下二段）", mean:"思われる・感じられる・似る", expl:"自発の意味が中心で、自然にそう感じられる・思い出されることを表す。", mne:"『おぼゆ』＝『覚（おぼ）ゆ』＝自然と心に浮かぶ、と自発の意味で覚える。", senses:[{m:"思われる・感じられる",ex:[{t:"いみじく心もとなく、ゆかしく[[おぼゆる]]ままに",tr:"たまらなくじれったく、見たく思われるままに",s:"更級日記"},{t:"日ごろは何とも[[おぼえ]]ぬ鎧が、今日は重うなったるぞや",tr:"ふだんは何とも感じない鎧が、今日は重くなったことよ",s:"平家物語（木曽最期）"},{t:"何となく心細く[[おぼゆ]]。",tr:"なんとなく心細く思われる。"}]},{m:"思い出される",ex:[{t:"おのづからなどは、そらに[[おぼえ]]浮かぶを",tr:"自然と、そらで思い浮かんでくるのを",s:"更級日記"},{t:"昔のことの[[おぼえ]]て、涙ぐむ。",tr:"昔のことが思い出されて、涙ぐむ。"},{t:"古き歌の、夜半に[[おぼえ]]て、口ずさむ。",tr:"古い歌が、夜中に思い出されて、口ずさむ。"}]},{m:"似る",ex:[{t:"母君に[[おぼえ]]たる御かたちなり。",tr:"母君に似ているお姿である。"},{t:"兄に[[おぼえ]]たる声なり。",tr:"兄に似ている声である。"},{t:"亡き人に[[おぼえ]]たる子を見て、涙ぐむ。",tr:"亡き人に似ている子を見て、涙ぐむ。"}]}]},
 {w:"おもしろし", pos:"形", mean:"趣がある・風情がある・楽しい", expl:"現代語の『笑える』ではなく、景色や物事に心惹かれる趣深さを表す。", mne:"『面（おも）＋白し』＝目の前がぱっと明るく感じる趣深さ、とイメージする。", senses:[{m:"趣がある・風情がある",ex:[{t:"雪の[[おもしろう]]降りたりし朝",tr:"雪が趣深く降った朝",s:"徒然草（第三十一段）"},{t:"かきつばたいと[[おもしろく]]咲きたり",tr:"かきつばたがたいそう趣深く咲いている",s:"伊勢物語（東下り）"},{t:"雪の降る夜の庭、いと[[おもしろし]]。",tr:"雪の降る夜の庭は、とても趣がある。"}]},{m:"楽しい・愉快だ",ex:[{t:"管弦の遊びに人々集ひ、[[おもしろく]]夜を明かす。",tr:"管弦の遊びに人々が集まり、楽しく夜を明かす。"},{t:"笛・琴の音に合はせて、[[おもしろく]]遊ぶ。",tr:"笛や琴の音に合わせて、楽しく遊ぶ。"},{t:"旅の友と語らへば、[[おもしろし]]。",tr:"旅の友と語り合うと、楽しい。"}]}]},
 {w:"おもておこし", pos:"名", mean:"面目が立つこと・名誉を得ること", expl:"体面・評判が良い方向に立つことを表す。", mne:"『面（顔）』を『起こす』＝顔が立つ＝面目が立つ、と覚える。", senses:[{m:"面目が立つこと・名誉",ex:[{t:"かかる出世は、親の[[おもておこし]]なり。",tr:"このような出世は、親の面目が立つことだ。"},{t:"優れたる子を持ちて、[[おもておこし]]とす。",tr:"優れた子を持って、面目が立つと思う。"},{t:"賞を賜りて、家の[[おもておこし]]なり。",tr:"賞をいただいて、家の名誉である。"}]}]},
 {w:"おもてぶせ", pos:"名", mean:"面目を失うこと・恥をかくこと", expl:"『おもておこし』の対義語で、体面をつぶされることを表す。", mne:"『面（顔）』を『伏せる』＝顔向けできない＝恥、と対義語セットで覚える。", senses:[{m:"面目を失うこと・恥",ex:[{t:"人の前にて咎めらるるは、[[おもてぶせ]]なり。",tr:"人前で咎められるのは、面目を失うことだ。"},{t:"大勢の前にて過ちをするは、[[おもてぶせ]]なり。",tr:"大勢の前で過ちをするのは、面目を失うことだ。"},{t:"[[おもてぶせ]]なることをして、人に会はず。",tr:"恥となることをして、人に会わない。"}]}]},
]},
{id:6, words:[
 {w:"おろかなり", pos:"形動", mean:"いいかげんだ・おろそかだ", expl:"現代語『愚か（ばか）』ではなく、物事への扱いが不十分・おろそかなことを表す。『～もおろかなり』で『～では言い尽くせない』の意にもなる。", mne:"『疎か（おろそか）』と同源、と考えて『扱いが不十分』を覚える。", senses:[{m:"いいかげんだ・おろそかだ",ex:[{t:"世話を[[おろかに]]して、病を重くしぬ。",tr:"世話をおろそかにして、病気を重くしてしまった。"},{t:"宿題を[[おろかに]]して、師に叱らる。",tr:"宿題をいいかげんにして、師に叱られる。"},{t:"客をもてなすこと[[おろかなり]]。",tr:"客をもてなすことがおろそかだ。"}]},{m:"（～も）言い尽くせない",ex:[{t:"うれしさは言葉にも[[おろかなり]]。",tr:"うれしさは言葉でも言い尽くせない。"},{t:"嬉しさは言ふも[[おろかなり]]。",tr:"嬉しさは言うまでもなく言い尽くせない。"},{t:"その悲しみは、筆にも[[おろかなり]]。",tr:"その悲しみは、筆でも書き尽くせない。"}]}]},
 {w:"かぎり", pos:"名", mean:"限度・限界・最期（死）", expl:"物事の限界点を表し、特に人の命の終わり＝『死』を婉曲に指すことがある。", mne:"『限り』が『命の限り』＝『最期』を意味する用法に注意して覚える。", senses:[{m:"限度・限り",ex:[{t:"[[限り]]あれば、さのみもえとどめさせたまはず",tr:"決まりがあるので、そうそうお引き止めになることもおできにならず",s:"源氏物語（桐壺）"},{t:"満座興に入ること[[限り]]なし。",tr:"満座の人々が興に入ることこの上ない。",s:"徒然草（第五十三段）"},{t:"命の[[かぎり]]思ひを尽くす。",tr:"命の限り思いを尽くす。"}]},{m:"最期（死）",ex:[{t:"今は[[かぎり]]と見えければ、人々泣き騒ぐ。",tr:"今はもう最期と見えたので、人々は泣き騒ぐ。"},{t:"今は[[かぎり]]と見えて、人々泣く。",tr:"今はもう最期と見えて、人々が泣く。"},{t:"[[かぎり]]の時に、子を呼びたまふ。",tr:"最期の時に、子をお呼びになる。"}]}]},
 {w:"かくる", pos:"動（下二段）", mean:"隠れる・（貴人が）お亡くなりになる", expl:"姿を隠すことから転じて、高貴な人の死を婉曲に表す表現になる。", mne:"『隠（かく）る』＝この世から姿を隠す＝亡くなる、と婉曲表現として覚える。", senses:[{m:"隠れる",ex:[{t:"月の雲に[[かくれ]]て、あたりも暗し。",tr:"月が雲に隠れて、あたりも暗い。"},{t:"鬼の影に怖ぢて、柱の陰に[[かくれ]]ぬ。",tr:"鬼の姿に怖がって、柱の陰に隠れた。"},{t:"山の端に日の[[かくる]]るころなり。",tr:"山の端に日が隠れる頃である。"}]},{m:"（貴人が）お亡くなりになる",ex:[{t:"帝、昨夜[[かくれ]]させたまひぬ。",tr:"帝は昨夜お亡くなりになった。"},{t:"院、昨夜[[かくれ]]させたまひぬ。",tr:"院は昨夜お亡くなりになった。"},{t:"大臣[[かくれ]]たまひて、世の人悲しむ。",tr:"大臣がお亡くなりになって、世の人が悲しむ。"}]}]},
 {w:"かけことば（修辞法）", pos:"名（修辞法）", mean:"掛詞（同音の語に二つの意味を持たせる技法）", expl:"一つの音に複数の意味を掛けて和歌の表現を豊かにする修辞技法。", mne:"『松（まつ）』に『待つ』を掛ける、のような例で漢字通りに覚える。", senses:[{m:"同音で二つの意味を持たせる技法",ex:[{t:"「ながめ」に「眺め」と「長雨」とを持たすは、[[かけことば]]なり。",tr:"「ながめ」に「眺め」と「長雨」の二つの意味を持たせるのは、掛詞である。"},{t:"「まつ」に「松」と「待つ」を掛くるは、[[かけことば]]なり。",tr:"「まつ」に「松」と「待つ」を掛けるのは、掛詞である。"},{t:"歌に[[かけことば]]を用ゐて、心を深くす。",tr:"歌に掛詞を用いて、心を深くする。"}]}]},
 {w:"かしこし", pos:"形", mean:"恐れ多い・優れている・利口だ", expl:"神仏や貴人に対する畏れ多さと、能力の優秀さの両方を表す。", mne:"現代語『賢い』に加え、『恐れ多い』の意味もセットで覚える。", senses:[{m:"恐れ多い・もったいない",ex:[{t:"[[かしこき]]仰せ言を、謹みて承る。",tr:"恐れ多いお言葉を、謹んでお受けする。"},{t:"[[かしこき]]御前に、うちかしこまる。",tr:"恐れ多い御前に、かしこまる。"},{t:"神の[[かしこき]]ところに、人みな額づく。",tr:"神の畏れ多い所に、人は皆ひれ伏す。"}]},{m:"すぐれている・賢い",ex:[{t:"いにしへの[[賢き]]御世には",tr:"昔の賢明な御世には",s:"方丈記"},{t:"[[かしこき]]人の、世に隠れ居たり。",tr:"賢い人が、世に隠れ住んでいた。"},{t:"[[かしこき]]師に学びて、才を伸ばす。",tr:"すぐれた師に学んで、才能を伸ばす。"}]}]},
 {w:"かしづく", pos:"動（四段）", mean:"大切に育てる・世話をする", expl:"特に親が子（多くは娘）を大切に養育する様子を表す頻出語。", mne:"『傅（かしづ）く』＝かしずいて大切に世話する、とそのまま覚える。", senses:[{m:"大切に育てる・世話をする",ex:[{t:"世に[[もてかしづき]]聞こゆれど",tr:"世間で大切にお世話申し上げているけれど",s:"源氏物語（桐壺）"},{t:"親、一人の姫君を[[かしづき]]たまふ。",tr:"親は、ひとりの姫君を大切に育てなさる。"},{t:"祖父母、孫を[[かしづき]]て、手放さず。",tr:"祖父母が孫を大切に育てて、手放さない。"}]}]},
 {w:"かたくななり", pos:"形動", mean:"頑固だ・偏屈だ・無風流だ", expl:"考えが固く融通が利かない、また風流を解さない様子を表す。", mne:"現代語『頑（かたく）な』とほぼ同じ、『頑固』をそのまま覚える。", senses:[{m:"頑固だ・偏屈だ",ex:[{t:"年老いて[[かたくななる]]心になりぬ。",tr:"年を取って頑固な心になった。"},{t:"[[かたくななる]]翁、人の言ふことを聞かず。",tr:"頑固な翁が、人の言うことを聞かない。"},{t:"[[かたくななる]]心を改めよ。",tr:"頑固な心を改めよ。"}]},{m:"無風流だ・教養がない",ex:[{t:"花の心を知らぬ[[かたくななる]]人。",tr:"花の風情を理解しない無風流な人。"},{t:"月の光を愛でぬは、[[かたくななり]]。",tr:"月の光を愛でないのは、無風流だ。"},{t:"[[かたくななる]]人は、歌の心を知らず。",tr:"教養のない人は、歌の心を知らない。"}]}]},
 {w:"かたし", pos:"形", mean:"難しい・めったにない", expl:"『難し』の字を当て、実現困難・希少であることを表す。", mne:"『有り難し』の『難し』と同源、『めったにない』とつなげて覚える。", senses:[{m:"難しい・困難だ",ex:[{t:"心を変へざるは、いと[[かたき]]ことなり。",tr:"心を変えないのは、たいそう難しいことだ。"},{t:"思ひ通りに事を成すは、[[かたし]]。",tr:"思い通りに事を成すのは、難しい。"},{t:"人の心を知ること、[[かたき]]ものなり。",tr:"人の心を知ることは、難しいものである。"}]}]},
 {w:"かたじけなし", pos:"形", mean:"もったいない・ありがたい・恐れ多い", expl:"相手の厚意や身分の高さに対して、身に余るほどの感謝・畏れを表す。", mne:"現代語『かたじけない』とほぼ同じ意味なので直感で覚えられる。", senses:[{m:"もったいない・恐れ多い",ex:[{t:"[[かたじけなき]]御心ばへのたぐひなきを頼みにて交じらひたまふ",tr:"もったいないお心づかいが比類ないのを頼みにして宮仕えなさる",s:"源氏物語（桐壺）"},{t:"帝の[[かたじけなき]]仰せを承る。",tr:"帝のもったいないお言葉を承る。"},{t:"宮の[[かたじけなき]]御言葉を、頂く。",tr:"宮のもったいないお言葉を、頂く。"}]},{m:"ありがたい・感謝している",ex:[{t:"情けある御心ざし、[[かたじけなく]]思ひたまふ。",tr:"ご厚情を、ありがたく思います。"},{t:"親切に[[かたじけなく]]思ふ。",tr:"親切をありがたく思う。"},{t:"御手づから賜りて、[[かたじけなし]]。",tr:"直々にいただいて、ありがたい。"}]}]},
 {w:"かたたがへ", pos:"名", mean:"方違へ（凶の方角を避けて前夜別の場所に泊まる風習）", expl:"陰陽道に基づき、目的地の方角が悪い場合に一度別方向へ移動してから向かう習慣。", mne:"『方（かた）』を『違（たが）へ』る＝方角を変える、と漢字通りに覚える。", senses:[{m:"凶の方角を避けて別の所に泊まること",ex:[{t:"内裏より出でて、[[かたたがへ]]にあなたの家に泊まる。",tr:"宮中から出て、方違えのためにあちらの家に泊まる。"},{t:"方角悪しとて、[[かたたがへ]]に友の家に泊まる。",tr:"方角が悪いといって、方違えのために友の家に泊まる。"},{t:"[[かたたがへ]]して、明け方に帰りぬ。",tr:"方違えをして、明け方に帰った。"}]}]},
 {w:"かたち", pos:"名", mean:"容貌・容姿", expl:"現代語の『形』よりも、人の顔立ち・見た目の美しさを指すことが多い。", mne:"『かたち』は『姿かたち』の意で、まず『容貌』を思い出す。", senses:[{m:"容貌・容姿",ex:[{t:"[[かたち]]とても人にも似ず",tr:"容貌とても人並みでなく",s:"蜻蛉日記"},{t:"うつくしげなる[[容貌]]なり",tr:"かわいらしい顔だちである",s:"源氏物語（若紫）"},{t:"[[かたち]]すぐれたる女房なり。",tr:"容貌のすぐれた女房である。"}]}]},
 {w:"かたはらいたし", pos:"形", mean:"そばで見ていて気の毒だ・きまりが悪い・苦々しい", expl:"『傍ら（かたわら）』＋『痛し』で、そばで見ている側が感じる気まずさを表す。", mne:"『傍らが痛い』＝横で見ていて心が痛む＝気の毒・きまり悪い、と覚える。", senses:[{m:"（そばで見て）気の毒だ",ex:[{t:"人の恥づかしめらるるを見るも、[[かたはらいたし]]。",tr:"人が恥をかかされるのを見るのも、気の毒でいたたまれない。"},{t:"人の恥をかくを見るは、[[かたはらいたし]]。",tr:"人が恥をかくのを見るのは、いたたまれない。"},{t:"叱らるる子を見て、[[かたはらいたく]]思ふ。",tr:"叱られる子を見て、気の毒に思う。"}]},{m:"きまりが悪い・苦々しい",ex:[{t:"[[かたはらいたき]]もの。客人などに会ひて物言ふに",tr:"きまりが悪いもの。客人などに会って話をしている時に",s:"枕草子（かたはらいたきもの）"},{t:"下手なる歌を人に聞かするは、[[かたはらいたし]]。",tr:"下手な歌を人に聞かせるのは、きまりが悪い。"},{t:"下手なる琴を弾くは、[[かたはらいたし]]。",tr:"下手な琴を弾くのは、きまりが悪い。"}]}]},
 {w:"かたほなり", pos:"形動", mean:"未熟だ・不完全だ", expl:"『片（かた）＋秀（ほ）なり』で、まだ十分に整っていない様子を表す。", mne:"『片』（不完全）＋『秀』で『まだ半人前』とイメージする。", senses:[{m:"未熟だ・不完全だ",ex:[{t:"[[かたほなる]]手を人に見するは恥づかし。",tr:"未熟な筆跡を人に見せるのは恥ずかしい。"},{t:"[[かたほなる]]技を人に見せじ。",tr:"未熟な技を人に見せまい。"},{t:"学問まだ[[かたほなり]]。",tr:"学問はまだ未熟だ。"}]}]},
 {w:"かたみに", pos:"副", mean:"互いに", expl:"双方が同じように何かをし合う様子を表す副詞。", mne:"『互（かたみ）に』は現代語『互いに』とほぼ同形で覚えやすい。", senses:[{m:"互いに",ex:[{t:"[[かたみに]]文を取り交はして、心を慰む。",tr:"互いに手紙を取り交わして、心を慰める。"},{t:"[[かたみに]]心を通はす。",tr:"互いに心を通わせる。"},{t:"二人[[かたみに]]語りて、夜を明かす。",tr:"二人が互いに語って、夜を明かす。"}]}]},
 {w:"かたらふ", pos:"動（四段）", mean:"親しく語り合う・言い寄る・仲間に引き入れる", expl:"単なる会話でなく、深く語り合う、または恋愛的に言い寄る意味を持つ。", mne:"『語る』の継続形『語らふ』＝繰り返し語り合う仲＝親密な関係、と覚える。", senses:[{m:"親しく語り合う",ex:[{t:"友と夜もすがら[[かたらひ]]て、別れを惜しむ。",tr:"友と一晩中語り合って、別れを惜しむ。"},{t:"夜通し友と[[かたらひ]]て、笑ふ。",tr:"夜通し友と語り合って、笑う。"},{t:"人々[[かたらひ]]て、旅の話をす。",tr:"人々が語り合って、旅の話をする。"}]},{m:"言い寄る・契りを結ぶ",ex:[{t:"男、女を[[かたらひ]]て、ついに忍び入る。",tr:"男が女に言い寄って、ついに忍び込む。"},{t:"姫君を[[かたらふ]]男、絶えず。",tr:"姫君に言い寄る男が、絶えない。"},{t:"女に[[かたらひ]]つきて、通ひ始めぬ。",tr:"女と親しくなって、通い始めた。"}]},{m:"仲間に引き入れる",ex:[{t:"勢ひある者を[[かたらひ]]て、味方とす。",tr:"有力な者を仲間に引き入れて、味方にする。"},{t:"勇士を[[かたらひ]]て、軍を起こす。",tr:"勇士を仲間に引き入れて、軍を起こす。"},{t:"味方を[[かたらふ]]べくもあらず。",tr:"味方に引き入れることもできそうにない。"}]}]},
]},
{id:7, words:[
 {w:"かづく", pos:"動", mean:"（水を）かぶる／褒美を頭からかぶせる・与える", expl:"四段では『かぶる』、下二段では『褒美を与える』の意味になる。", mne:"『被（かづ）く』＝頭に被せる→自分が被れば『かぶる』、人に被せれば『与える』。", senses:[{m:"（頭に）かぶる",ex:[{t:"頭に[[かづき]]たれば",tr:"頭にかぶったところ",s:"徒然草（第五十三段）"},{t:"頭に衣を[[かづき]]て、顔を隠す。",tr:"頭に衣をかぶって、顔を隠す。"},{t:"雨ゆゑ、笠を[[かづき]]て行く。",tr:"雨なので、笠をかぶって行く。"}]},{m:"褒美を与える",ex:[{t:"舞ひたる人に、衣を[[かづく]]。",tr:"舞った人に、衣を褒美として与える。"},{t:"歌よみたる人に、衣を[[かづく]]。",tr:"歌を詠んだ人に、着物を褒美として与える。"},{t:"功ありし者に、禄を[[かづけ]]たまふ。",tr:"功のあった者に、禄をお与えになる。"}]}]},
 {w:"かどかどし", pos:"形", mean:"才気がある・角が立つほど鋭い", expl:"知的で鋭さのある様子を表し、良い意味での才気煥発を指すことが多い。", mne:"『角（かど）』が立つほど鋭い才気、と漢字イメージで覚える。", senses:[{m:"才気がある・利発だ",ex:[{t:"[[かどかどしき]]人にて、ものの道理をよく知る。",tr:"才気のある人で、物の道理をよく心得ている。"},{t:"[[かどかどしき]]童なり、人みな驚く。",tr:"利発な子どもで、人は皆驚く。"},{t:"[[かどかどしく]]答へて、人を感ぜしむ。",tr:"才気ある答えをして、人を感心させる。"}]}]},
 {w:"かなし", pos:"形", mean:"いとしい・かわいい／悲しい", expl:"『愛し』と『悲し』の両方の漢字が当てられ、強い愛情と強い悲哀の両方を表す。", mne:"愛おしさが極まると悲しさにも通じる、と両義を一つの感情としてまとめて覚える。", senses:[{m:"いとしい・かわいい",ex:[{t:"子を[[かなし]]と思ふ親の心。",tr:"子をいとしいと思う親の心。"},{t:"姫を[[かなし]]と思ふ父の心。",tr:"姫をいとしいと思う父の心。"},{t:"[[かなしき]]妻と別れて旅に出づ。",tr:"いとしい妻と別れて旅に出る。"}]},{m:"悲しい",ex:[{t:"別れの[[かなしく]]て、涙の止まらず。",tr:"別れが悲しくて、涙が止まらない。"},{t:"友の死を聞きて、[[かなしく]]思ふ。",tr:"友の死を聞いて、悲しく思う。"},{t:"別れぞ[[かなしき]]。",tr:"別れが悲しい。"}]}]},
 {w:"かなしうす", pos:"動", mean:"かわいがる", expl:"『かなし（いとしい）』が動詞化した語で、愛情を注ぐ行為を表す。", mne:"『かなし』の動詞形と考え、『いとしく思って可愛がる』と覚える。", senses:[{m:"かわいがる",ex:[{t:"祖母、孫を[[かなしうし]]たまふ。",tr:"祖母は孫をかわいがりなさる。"},{t:"孫を[[かなしうし]]て、膝に抱く。",tr:"孫をかわいがって、膝に抱く。"},{t:"親、末の子を[[かなしうす]]。",tr:"親は末の子をかわいがる。"}]}]},
 {w:"かる", pos:"動（下二段）", mean:"離れる・疎遠になる・涸れる", expl:"人間関係が疎遠になることと、水などが涸れることの両方を表す。", mne:"『離（か）る』＝離れる、『涸（か）る』＝涸れる、と同音でセットに覚える。", senses:[{m:"離れる・疎遠になる",ex:[{t:"訪ふ人もなく、人目も[[かれ]]ぬ。",tr:"訪れる人もなく、人の出入りも遠ざかった。"},{t:"疎くなりて、足も[[かれ]]ぬ。",tr:"疎遠になって、足も遠のいた。"},{t:"男の訪れ[[かれ]]て、久し。",tr:"男の訪れが絶えて、久しい。"}]},{m:"枯れる・涸れる",ex:[{t:"冬になりて、草も[[かれ]]ぬ。",tr:"冬になって、草も枯れた。"},{t:"日照り続きて、井戸も[[かれ]]ぬ。",tr:"日照りが続いて、井戸も涸れた。"},{t:"霜降りて、野辺の草[[かれ]]ぬ。",tr:"霜が降りて、野辺の草が枯れた。"}]}]},
 {w:"かへり（かへし）", pos:"名", mean:"返歌・返事", expl:"和歌のやり取りで、相手の歌に対して返す歌や返答を指す。", mne:"『返す』の名詞形と考えて『返歌・返事』と直感的に覚える。", senses:[{m:"返歌・返事",ex:[{t:"[[かへし]]に、一首詠みて送りたまふ。",tr:"返事として、一首詠んでお送りになる。"},{t:"友の歌の[[かへし]]をば、すぐにせむ。",tr:"友の歌の返歌は、すぐにしよう。"},{t:"御[[かへり]]を待ち侘ぶ。",tr:"お返事を待ちわびる。"}]}]},
 {w:"からし", pos:"形", mean:"つらい・厳しい・（味が）からい", expl:"精神的なつらさや、対応の厳しさを表す形容詞。", mne:"現代語『辛い（からい／つらい）』の両方の読みが残る語と意識する。", senses:[{m:"つらい・ひどい",ex:[{t:"[[からき]]目を見て、泣く泣く帰りぬ。",tr:"つらい目にあって、泣く泣く帰った。"},{t:"[[からき]]世を、泣きながら過ごす。",tr:"つらい世を、泣きながら過ごす。"},{t:"[[からく]]して命ばかりは助かりぬ。",tr:"ひどい目にあって命だけは助かった。"}]},{m:"厳しい",ex:[{t:"師の[[からき]]教へに、心を改む。",tr:"師の厳しい教えに、心を改める。"},{t:"[[からき]]罰を受けて、世に出でず。",tr:"厳しい罰を受けて、世に出ない。"},{t:"師、[[からく]]戒めたまふ。",tr:"師は厳しくお戒めになる。"}]},{m:"（味が）からい",ex:[{t:"この菜は[[からく]]て、食ひがたし。",tr:"この菜は辛くて、食べにくい。"},{t:"[[からき]]汁を飲みて、涙ぐむ。",tr:"辛い汁を飲んで、涙ぐむ。"},{t:"山椒の実の[[からし]]。",tr:"山椒の実は辛い。"}]}]},
 {w:"きこゆ", pos:"動（下二段）", mean:"申し上げる（謙譲）／聞こえる・評判になる", expl:"謙譲の補助動詞として非常によく使われ、また『evaluation（評判）』の意味でも使われる。", mne:"『聞こゆ』＝相手に聞こえるように申し上げる、と謙譲の由来を覚える。", senses:[{m:"申し上げる（謙譲）",ex:[{t:"宮に事の次第を[[きこゆ]]。",tr:"宮に事の次第を申し上げる。"},{t:"帝に事の由を[[きこえ]]させたまふ。",tr:"帝に事の事情を申し上げなさる。"},{t:"事の次第を、院に[[きこゆ]]。",tr:"事の次第を、院に申し上げる。"}]},{m:"聞こえる",ex:[{t:"遠き琴の音の、風に乗りて[[きこゆ]]。",tr:"遠くの琴の音が、風に乗って聞こえる。"},{t:"山の寺の鐘の音、遠く[[きこゆ]]。",tr:"山の寺の鐘の音が、遠く聞こえる。"},{t:"夜更けて、人の声[[きこゆ]]。",tr:"夜が更けて、人の声が聞こえる。"}]},{m:"評判になる・名高い",ex:[{t:"世に[[きこえ]]たる歌人なり。",tr:"世に名高い歌人である。"},{t:"この寺の名は、世に[[きこえ]]たり。",tr:"この寺の名は、世に知られている。"},{t:"[[きこえ]]高き武士なり。",tr:"評判の高い武士である。"}]}]},
 {w:"きは", pos:"名", mean:"身分・程度・端（きわ）", expl:"人の身分階級や物事の程度を表す語で、境目・際（きわ）の意味も持つ。", mne:"現代語『際（きわ）』と同語源、『程度・境目』の意味を軸に覚える。", senses:[{m:"身分・家柄",ex:[{t:"いとやむごとなき[[際]]にはあらぬが",tr:"それほど高貴な身分ではない方が",s:"源氏物語（桐壺）"},{t:"[[きは]]ことなる人の、世に出でたまふ。",tr:"身分の格別に高い人が、世に出ておいでになる。"},{t:"[[きは]]まさりたる人の妻となる。",tr:"身分のまさった人の妻となる。"}]},{m:"程度・限り",ex:[{t:"悲しさは[[きは]]もなし。",tr:"悲しさは際限がない。"},{t:"憂ひの[[きは]]を知らず。",tr:"憂いの限りを知らない。"},{t:"何事も[[きは]]あることなり。",tr:"何事にも限度がある。"}]},{m:"端・そば",ex:[{t:"山の[[きは]]に月かかる。",tr:"山の端に月がかかる。"},{t:"海の[[きは]]に、波の寄す。",tr:"海の端に、波が寄せる。"},{t:"山の[[きは]]、白くなりゆく。",tr:"山の際が、白くなっていく。"}]}]},
 {w:"きよらなり", pos:"形動", mean:"気品があって美しい（最上級の美）", expl:"『きよげなり』よりもさらに上位の、輝くばかりの気品ある美しさを表す。", mne:"『清ら』は美の最上位ランクと覚え、『きよげなり』との格差を意識する。", senses:[{m:"気品があって美しい",ex:[{t:"世になく[[清らなる]]玉の男皇子さへ",tr:"世にまたとなく美しい玉のような皇子まで",s:"源氏物語（桐壺）"},{t:"[[きよらなる]]御かたちにて、光るやうなり。",tr:"この上なく気品高く美しいお姿で、光り輝くようである。"},{t:"[[きよらなる]]姿にて、宮にまゐる。",tr:"気品高く美しい姿で、宮中に参上する。"}]}]},
 {w:"ぐす", pos:"動（サ変）", mean:"伴う・引き連れる・一緒にいる", expl:"『具す』の字を当て、誰かを伴って行動する様子を表す。", mne:"『具（ぐ）す』＝道具のように一緒に備え持つ→『伴う』と覚える。", senses:[{m:"伴う・引き連れる",ex:[{t:"[[具し]]もて行きたるに",tr:"連れて行ったところ",s:"徒然草（第二百三十六段）"},{t:"供人を[[ぐし]]て、野に出でたまふ。",tr:"供の者を引き連れて、野にお出になる。"},{t:"子を[[ぐし]]て、野へ出でぬ。",tr:"子を連れて、野へ出た。"}]}]},
 {w:"くらうど", pos:"名", mean:"蔵人（天皇に近侍し文書や儀式を扱う役人）", expl:"天皇の側近として文書・儀式・雑務を扱う、宮中でも重んじられた官職を指す。", mne:"『蔵（くら）』の『人（うど）』＝宮中の文書を扱う役人、と漢字で覚える。", senses:[{m:"天皇に仕え文書や儀式を扱う役人",ex:[{t:"[[くらうど]]、勅旨を承りて参る。",tr:"蔵人が、天皇のお言葉を承って参上する。"},{t:"[[くらうど]]、帝の仰せを伝ふ。",tr:"蔵人が、帝のお言葉を伝える。"},{t:"[[くらうど]]になりて、宮中に仕ふ。",tr:"蔵人になって、宮中に仕える。"}]}]},
 {w:"けし", pos:"形", mean:"様子が変だ・普通でない", expl:"『怪し』に通じ、何かいつもと違う異変を感じさせる様子を表す。", mne:"『けしからず』の元になる語と考え、『変だ・異常だ』とセットで覚える。", senses:[{m:"様子が変だ・異様だ",ex:[{t:"この家の物音、いと[[けし]]とて、人々恐れぬ。",tr:"この家の物音は、とても異様だと言って、人々は恐れた。"},{t:"その人の振る舞ひ、いと[[けし]]。",tr:"その人の振る舞いは、たいそう変だ。"},{t:"[[けし]]とて、誰も近づかず。",tr:"異様だといって、誰も近づかない。"}]}]},
 {w:"けしからず", pos:"連語", mean:"異様だ・普通でない・よくない", expl:"『け（気）し＋からず』で、現代語『けしからん』のニュアンスに近い非難を表す。", mne:"現代語『けしからん』とほぼ同じ使い方なので直感で覚えやすい。", senses:[{m:"異様だ・よくない",ex:[{t:"[[けしからぬ]]振る舞ひをして、人に笑はる。",tr:"よくない振る舞いをして、人に笑われる。"},{t:"[[けしからず]]、人に笑はるる姿なり。",tr:"異様で、人に笑われる姿である。"},{t:"かく言ふは[[けしからぬ]]ことなり。",tr:"このように言うのはよくないことである。"}]}]},
 {w:"けしき", pos:"名", mean:"様子・機嫌・態度", expl:"現代語『景色』ではなく、人の表情や態度、その場の雰囲気を指すことが多い。", mne:"『気色（けしき）』＝『気（心）の色（現れ）』＝様子・機嫌、と漢字から覚える。", senses:[{m:"様子・ありさま",ex:[{t:"空の[[けしき]]、ただならず。",tr:"空の様子が尋常でない。"},{t:"雲の[[けしき]]、ただならず。",tr:"雲の様子が、尋常でない。"},{t:"山のあたりの[[けしき]]、いと静かなり。",tr:"山のあたりの様子は、たいそう静かだ。"}]},{m:"機嫌・態度",ex:[{t:"主の[[けしき]]悪しければ、人々も控へたり。",tr:"主の機嫌が悪いので、人々も控えている。"},{t:"親の[[けしき]]悪しければ、物も言はず。",tr:"親の機嫌が悪いので、物も言わない。"},{t:"主の[[けしき]]をうかがひて、近寄る。",tr:"主人の機嫌をうかがって、近寄る。"}]}]},

 {w:"けしきばかり", pos:"連語", mean:"形ばかり・ほんの少し", expl:"『けしき（様子）』が『ばかり（だけ）』であることから、実質を伴わない形式的な様子を表す。", mne:"『様子だけ』＝中身が伴わない『形ばかり』と覚える。", senses:[{m:"形ばかり・ほんの少し",ex:[{t:"[[けしきばかり]]の饗応を、人々喜びぬ。",tr:"形ばかりのもてなしを、人々は喜んだ。"},{t:"[[けしきばかり]]の贈り物を、懐に入る。",tr:"形ばかりの贈り物を、懐に入れる。"},{t:"[[けしきばかり]]雨の降りて、すぐやみぬ。",tr:"ほんの少し雨が降って、すぐにやんだ。"}]}]},
 {w:"げに", pos:"副", mean:"なるほど・本当に", expl:"人の言うことや評判を実際に確かめて納得する気持ちを表す副詞。", mne:"『実（げ）に』＝『実際に』確かにそうだ、と漢字から覚える。", senses:[{m:"なるほど・本当に",ex:[{t:"げに[[おのづから]]慰みゆく",tr:"本当に自然と気持ちが慰められていく",s:"更級日記"},{t:"[[げに]]ことわりと見えたり",tr:"なるほどもっともだと見えた",s:"源氏物語（桐壺）"},{t:"[[げに]]さもありぬべし。",tr:"なるほど、確かにそうであろう。"}]}]},
 {w:"けはひ", pos:"名", mean:"気配・様子", expl:"目には見えないが感じ取れる雰囲気・存在感を表す。", mne:"現代語『気配（けはい）』とほぼ同じ発音・意味で覚えやすい。", senses:[{m:"気配",ex:[{t:"秋の[[けはひ]]入り立つままに",tr:"秋の気配が深まるにつれて",s:"紫式部日記"},{t:"人の[[けはひ]]して、門のほとりに立つ。",tr:"人の気配がして、門のあたりに立つ。"},{t:"物の[[けはひ]]して、人々目を覚ます。",tr:"何かの気配がして、人々は目を覚ます。"}]},{m:"様子・雰囲気",ex:[{t:"忍びたる[[けはひ]]、いとものあはれなり",tr:"ひっそりとした様子は、たいそうしみじみと趣深い",s:"徒然草（第三十二段）"},{t:"やうやう涼しき風の[[けはひ]]に",tr:"だんだん涼しくなる風の様子に",s:"紫式部日記"},{t:"あたりの[[けはひ]]、いと心細し。",tr:"あたりの様子は、たいそう心細い。"}]}]},
 {w:"こうず", pos:"動（サ変）", mean:"疲れる・困る・弱る", expl:"『困ず』の字を当て、心身が疲れ果てる様子を表す。", mne:"『困（こう）ず』＝『困る』の古い形、と漢字から覚える。", senses:[{m:"疲れる・困り果てる",ex:[{t:"道を歩き[[こうじ]]て、木の下に臥す。",tr:"道を歩き疲れて、木の下に横になる。"},{t:"山道を越えて、[[こうじ]]果てぬ。",tr:"山道を越えて、疲れ果てた。"},{t:"事の成らぬを[[こうじ]]て、座り込む。",tr:"事がうまくいかないのに困り果てて、座り込む。"}]}]},
 {w:"ここら（ここだ、そこら）", pos:"副", mean:"たくさん・非常に", expl:"数量や程度の多さを表す副詞で、現代語の『あたり』の意味ではない点に注意。", mne:"『ここら』は場所でなく『数量の多さ』を表すと意識して覚える。", senses:[{m:"たくさん・非常に",ex:[{t:"[[ここら]]の人々集ひて、いと騒がし。",tr:"たくさんの人々が集まって、とても騒がしい。"},{t:"[[ここら]]の花、風に散りぬ。",tr:"たくさんの花が、風に散った。"},{t:"[[ここら]]悲しき目を見てけり。",tr:"非常に悲しい目を見たのだった。"}]}]},
 {w:"こころぐるし", pos:"形", mean:"気の毒だ・心配だ", expl:"相手の状況を見て心が痛む、思いやりの気持ちを表す。", mne:"『心』が『苦（ぐる）し』＝心が痛む＝気の毒、と漢字構成で覚える。", senses:[{m:"気の毒だ・心配だ",ex:[{t:"病に臥したる母を見て、[[こころぐるし]]と思ふ。",tr:"病に臥している母を見て、気の毒で心配だと思う。"},{t:"子を失ひし人の嘆きを見て、[[こころぐるし]]。",tr:"子を失った人の嘆きを見て、気の毒だ。"},{t:"旅に出づる子を思へば、[[こころぐるし]]。",tr:"旅に出る子を思うと、心配だ。"}]}]},
 {w:"こころづくし", pos:"名", mean:"あれこれと物思いをすること", expl:"心を尽くして悩む・思い悩む状態を表す名詞。", mne:"『心を尽くす』ほど思い悩む、と語構成から覚える。", senses:[{m:"あれこれ物思いをすること",ex:[{t:"秋は[[こころづくし]]の季節なり。",tr:"秋はあれこれと物思いをする季節である。"},{t:"遠き人を思ふ[[こころづくし]]の夜なり。",tr:"遠くの人を思うあれこれ物思いをする夜である。"},{t:"月見れば、[[こころづくし]]に堪へず。",tr:"月を見ると、あれこれ物思いして堪えられない。"}]}]},
 {w:"こころなし", pos:"形", mean:"思いやりがない・情趣を解さない", expl:"人情や風流を理解しない、無風流・無情な様子を表す。", mne:"『心が無い』＝思いやりも風流心も無い、とそのまま覚える。", senses:[{m:"情趣を解さない・風流心がない",ex:[{t:"花を見ても感ぜぬ[[こころなき]]人。",tr:"花を見ても感動しない、情趣を解さない人。"},{t:"[[こころなき]]者は、花の色も見ず。",tr:"風流心のない者は、花の色も見ない。"},{t:"月の夜を寝て過ごす、[[こころなし]]。",tr:"月の夜を寝て過ごすとは、風流心がない。"}]},{m:"思いやりがない",ex:[{t:"[[こころなく]]言ひ放ちて、人を傷つけぬ。",tr:"思いやりもなく言い放って、人を傷つけた。"},{t:"[[こころなき]]言葉に、人は傷つく。",tr:"思いやりのない言葉に、人は傷つく。"},{t:"病む人の前に笑ふは、[[こころなし]]。",tr:"病む人の前で笑うのは、思いやりがない。"}]}]},
 {w:"こころにくし", pos:"形", mean:"奥ゆかしい・上品で心ひかれる", expl:"現代語『心憎い（皮肉）』とは異なり、好ましい奥ゆかしさを表すプラス評価語。", mne:"『心』が『憎い』ほど（強く）ひかれる＝奥ゆかしい、と覚える。", senses:[{m:"奥ゆかしい・上品で心ひかれる",ex:[{t:"[[こころにくき]]心ばへの人なり。",tr:"奥ゆかしい心づかいの人である。"},{t:"[[こころにくき]]心づかひの人と見ゆ。",tr:"奥ゆかしい心づかいの人と見える。"},{t:"簾の内の人、[[こころにくし]]。",tr:"簾の内の人は、奥ゆかしい。"}]}]},
 {w:"こころもとなし", pos:"形", mean:"待ち遠しい・気がかりだ・はっきりしない", expl:"心のよりどころが定まらず、じれったく不安な気持ちを表す。", mne:"『心の元（もと）』が『無し』＝心が落ち着かない＝待ち遠しい、と覚える。", senses:[{m:"待ち遠しい・じれったい",ex:[{t:"いみじく[[心もとなく]]、ゆかしくおぼゆるままに",tr:"たまらなく待ち遠しく、見たく思われるままに",s:"更級日記"},{t:"いかに[[心もとなく]]思すらむ",tr:"どんなに待ち遠しくお思いでしょう",s:"十訓抄"},{t:"いつ来たまふと、[[こころもとなく]]待つ。",tr:"いつおいでになるかと、待ち遠しく待つ。"}]},{m:"気がかりだ・不安だ",ex:[{t:"子の行方[[こころもとなし]]。",tr:"子の行方が気がかりだ。"},{t:"病む母の身、[[こころもとなし]]。",tr:"病む母の身が、気がかりだ。"},{t:"船の便り絶えて、[[こころもとなく]]思ふ。",tr:"船の便りが絶えて、不安に思う。"}]},{m:"はっきりしない・ぼんやりしている",ex:[{t:"[[こころもとなき]]月の影に、道も見えず。",tr:"ぼんやりとした月の光で、道もはっきり見えない。"},{t:"夜明けの空、[[こころもとなく]]曇れり。",tr:"夜明けの空が、ぼんやりと曇っている。"},{t:"物の形[[こころもとなし]]。",tr:"物の形がはっきりしない。"}]}]},
 {w:"こちたし", pos:"形", mean:"うるさいほど多い・大げさだ", expl:"物事の量や評判があまりに多く、煩わしく感じられる様子を表す。", mne:"『言（こと）＋甚（いた）し』＝言葉が甚だしい＝うるさいほど多い、と覚える。", senses:[{m:"うるさいほど多い",ex:[{t:"世のうはさ[[こちたく]]立ちぬ。",tr:"世間のうわさがうるさいほど多く立った。"},{t:"人の口[[こちたく]]、世に広まりぬ。",tr:"人の口がうるさいほど多く、世に広まった。"},{t:"[[こちたき]]ほどに、文の来たる。",tr:"うるさいほどに、手紙が来る。"}]},{m:"大げさだ・仰々しい",ex:[{t:"[[こちたき]]ほどに言葉を飾る。",tr:"大げさなほどに言葉を飾る。"},{t:"[[こちたき]]自慢の言葉に、人は呆る。",tr:"大げさな自慢話に、人はあきれる。"},{t:"[[こちたく]]飾りたる姿なり。",tr:"仰々しく飾った姿である。"}]}]},
 {w:"こと（事・異・言）", pos:"名", mean:"事柄／別のこと／言葉", expl:"同音で『事・異（こと）・言』の三つの意味を持つため文脈判断が必要な多義語。", mne:"『こと』は『事・異・言』の三役をこなす、と三つまとめて覚える。", senses:[{m:"事柄・出来事",ex:[{t:"あまたの[[こと]]ども起こりぬ。",tr:"たくさんの出来事が起こった。"},{t:"世に珍しき[[こと]]ありて、人々騒ぐ。",tr:"世に珍しい出来事があって、人々が騒ぐ。"},{t:"さまざまの[[こと]]を思ひ続く。",tr:"さまざまな事柄を思い続ける。"}]},{m:"別の・ほかの",ex:[{t:"[[こと]]人には見せじ。",tr:"ほかの人には見せまい。"},{t:"[[こと]]所へ行かむと思ふ。",tr:"別の所へ行こうと思う。"},{t:"[[こと]]ざまに言ひなして、とどめぬ。",tr:"別の言い方にして、引き止めた。"}]},{m:"言葉",ex:[{t:"やまと歌は、人の心を種として、よろづの[[言]]の葉とぞなれりける。",tr:"和歌は、人の心を種として、さまざまな言葉となったのである。",s:"古今和歌集（仮名序）"},{t:"御[[こと]]を承りて、直ちに参りぬ。",tr:"お言葉を承って、すぐに参上した。"},{t:"師の[[こと]]を、心に刻む。",tr:"師の言葉を、心に刻む。"}]}]},
 {w:"ことごとし", pos:"形", mean:"仰々しい・大げさだ", expl:"必要以上に大がかりで、わざとらしい様子を表す。", mne:"『事々し』＝『事』が重なるほど大げさ、と語感で覚える。", senses:[{m:"仰々しい・大げさだ",ex:[{t:"[[ことごとしき]]行列にて、都へ入る。",tr:"仰々しい行列で、都へ入る。"},{t:"[[ことごとしき]]名乗りをして、陣に入る。",tr:"仰々しい名乗りをして、陣に入る。"},{t:"[[ことごとしく]]構へて、人を驚かす。",tr:"大げさに構えて、人を驚かす。"}]}]},
 {w:"ことわり", pos:"名", mean:"道理・理由", expl:"物事の理にかなった筋道を指す語で、『ことわりなり』で『もっともだ』の意にもなる。", mne:"現代語『理（ことわり）』とほぼ同じ意味なので直感的に覚えられる。", senses:[{m:"道理・筋道",ex:[{t:"盛者必衰の[[ことわり]]をあらはす",tr:"栄えた者が必ず衰えるという道理をあらわしている",s:"平家物語（冒頭）"},{t:"世の[[ことわり]]を知る人なり。",tr:"世の道理を知っている人である。"},{t:"物の[[ことわり]]を知らぬ人なり。",tr:"物の道理を知らない人である。"}]},{m:"もっともなこと・当然だ",ex:[{t:"[[ことわり]]と思ひつつ",tr:"当然だと思いながら",s:"蜻蛉日記"},{t:"げに[[ことわり]]と見えたり",tr:"なるほどもっともだと見えた",s:"源氏物語（桐壺）"},{t:"泣きたまふも[[ことわり]]なり。",tr:"お泣きになるのももっともなことである。"}]}]},

 {w:"ざえ", pos:"名", mean:"学才・技能（特に漢学の才）", expl:"『才（ざえ）』の字を当て、主に学問・漢籍の才能を指す。", mne:"『才（ざえ）』は『才能』の古い読み方、と漢字そのままで覚える。", senses:[{m:"学才・技能",ex:[{t:"[[ざえ]]ある人なれば、世に用ゐらる。",tr:"学才のある人なので、世に重んじられる。"},{t:"[[ざえ]]すぐれたる人、世に重んぜらる。",tr:"学才のすぐれた人は、世に重んじられる。"},{t:"[[ざえ]]を磨きて、官に仕ふ。",tr:"学才を磨いて、官職に仕える。"}]}]},
 {w:"さかし", pos:"形", mean:"利口だ・賢い（時に生意気だ）", expl:"知的で優れている様子を表すが、時に『でしゃばりだ』という否定的ニュアンスも持つ。", mne:"『賢し』＝賢い、ただし『さかしら』は『利口ぶる』とマイナスにもなると覚える。", senses:[{m:"賢い・利口だ",ex:[{t:"[[さかしき]]人の、世を治む。",tr:"賢い人が、世を治める。"},{t:"[[さかしき]]子と、人にほめらる。",tr:"賢い子と、人にほめられる。"},{t:"[[さかしき]]心もて、国を治む。",tr:"賢い心で、国を治める。"}]},{m:"利口ぶる・生意気だ",ex:[{t:"[[さかしく]]人の事に口出しす。",tr:"利口ぶって、人のことに口出しする。"},{t:"[[さかしく]]言ひ立つる者は、人に憎まる。",tr:"利口ぶって言い立てる者は、人に憎まれる。"},{t:"[[さかしき]]ふりして、人の話に割り入る。",tr:"生意気なふりをして、人の話に割り込む。"}]}]},
 {w:"さがなし", pos:"形", mean:"性質が悪い・いたずらだ", expl:"『性（さが）』＋『無し』で、生まれつきの性質が良くない様子を表す。", mne:"『性（さが）』が『無し』＝良い性質が無い＝性悪、と語構成で覚える。", senses:[{m:"性質が悪い・いたずらだ",ex:[{t:"[[さがなき]]童部ども、犬を追ふ。",tr:"いたずらな子どもたちが、犬を追う。"},{t:"[[さがなき]]者の言葉に、心傷つく。",tr:"性質の悪い者の言葉に、心が傷つく。"},{t:"[[さがなき]]童、猫を追ひまはす。",tr:"いたずらな子どもが、猫を追いまわす。"}]}]},
 {w:"さすがなり", pos:"形動", mean:"そうはいってもやはり・そうかといって", expl:"前の事情を認めつつも、それだけでは割り切れない気持ちを表す。", mne:"現代語『さすがに（そうは言っても）』とほぼ同じ感覚で使える。", senses:[{m:"そうはいってもやはり",ex:[{t:"恨めしけれど、[[さすがに]]捨てがたし。",tr:"恨めしいけれど、そうはいってもやはり見捨てがたい。"},{t:"憎けれど、[[さすがに]]見捨てがたし。",tr:"憎いけれど、そうはいってもやはり見捨てがたい。"},{t:"雪の降るも、[[さすがに]]をかし。",tr:"雪が降るのも、そうはいってもやはり趣がある。"}]}]},
 {w:"さながら", pos:"副", mean:"そのまま・すべて・まるで", expl:"状態がそのまま変わらないこと、また全部・すっかりの意を表し、比喩的に『まるで』の意にもなる。", mne:"現代語『さながら（まるで）』ともつながる語、『そのまま・すっかり』を軸に覚える。", senses:[{m:"そのまま",ex:[{t:"また衣着ぬ妻子なども、[[さながら]]内にありけり。",tr:"また衣を着ていない妻子なども、そのまま家の中にいた。",s:"宇治拾遺物語（絵仏師良秀）"},{t:"昔の[[さながら]]にて残れり。",tr:"昔のままで残っている。"},{t:"昔の家、[[さながら]]の姿を保てり。",tr:"昔の家が、そのままの姿を保っている。"}]},{m:"すべて・残らず",ex:[{t:"家の財を[[さながら]]失ひぬ。",tr:"家の財産をすべて失った。"},{t:"財を[[さながら]]人に与へつ。",tr:"財をすべて人に与えた。"},{t:"[[さながら]]燃え失せて、跡もなし。",tr:"すべて燃えてなくなり、跡形もない。"}]},{m:"まるで・ちょうど",ex:[{t:"[[さながら]]絵に描きたるやうなり。",tr:"まるで絵に描いたようである。"},{t:"[[さながら]]夢のごとし。",tr:"まるで夢のようだ。"},{t:"その姿、[[さながら]]仏のごとし。",tr:"その姿は、まるで仏のようだ。"}]}]},
 {w:"さぶらふ", pos:"動", mean:"お仕えする（謙譲）／あります・おります（丁寧）", expl:"貴人のそばに控える意味から、謙譲語・丁寧語の両方に発達した重要敬語動詞。", mne:"『侍（さぶら）ふ』＝『侍る』＝そばに控える、と漢字から覚える。", senses:[{m:"お仕えする・そばに控える",ex:[{t:"女御・更衣あまた[[さぶらひ]]たまひけるなかに",tr:"女御・更衣が大勢お仕えしていらっしゃった中に",s:"源氏物語（桐壺）"},{t:"物語などして集まり[[さぶらふ]]に",tr:"話などをして集まっておそばに控えていると",s:"枕草子（雪のいと高う降りたるを）"},{t:"御前に[[さぶらふ]]人々、皆あはれがる。",tr:"御前にお仕えする人々は、皆しみじみと感動する。"}]},{m:"あります・ございます（丁寧）",ex:[{t:"かく申すは、いかなる人にて[[さぶらふ]]ぞ。",tr:"こうおっしゃるのは、どのような人でございますか。"},{t:"さる事も[[さぶらふ]]。",tr:"そのようなこともございます。"},{t:"山のふもとに家一つ[[さぶらふ]]。",tr:"山のふもとに家が一軒ございます。"}]}]},
 {w:"さまをかふ（かたちをかふ）", pos:"連語", mean:"出家する（姿・形を変える）", expl:"『形（かたち）をかふ』とも言い、俗世の姿から僧侶の姿へ変わることを表す婉曲表現。", mne:"『様（姿）を変える』＝俗世を離れて僧の姿になる＝出家、と婉曲表現として覚える。", senses:[{m:"出家する",ex:[{t:"世を厭ひて、[[さまをかへ]]たまふ。",tr:"世を厭って、出家なさる。"},{t:"親の死にて、[[さまをかへ]]ぬ。",tr:"親が亡くなって、出家した。"},{t:"世を捨てて、[[さまをかへ]]たまふ。",tr:"世を捨てて、出家なさる。"}]}]},
 {w:"さらなり", pos:"形動", mean:"言うまでもない", expl:"『言ふもさらなり』の形で、当然すぎてあえて言う必要もないことを表す。", mne:"『更なり』＝今さら言うまでもない、とそのまま覚える。", senses:[{m:"言うまでもない",ex:[{t:"月のころは[[さらなり]]。",tr:"月の出ている頃は言うまでもない。",s:"枕草子（第一段・夏）"},{t:"月のころは[[さらなり]]、闇もなほ、蛍の多く飛びちがひたる。",tr:"月の出ている頃は言うまでもなく、闇夜もやはり、蛍が多く飛びかっている。",s:"枕草子（春はあけぼの・夏）"},{t:"梅の香は[[さらなり]]、色もまたをかし。",tr:"梅の香りは言うまでもなく、色もまた趣がある。"}]}]},
 {w:"さらに（～ず）", pos:"副", mean:"まったく～ない", expl:"下に打消を伴って、完全な否定を強調する呼応の副詞。", mne:"『さらに』を見たら文末に『ず』を探す、と呼応表現としてセットで覚える。", senses:[{m:"まったく～ない",ex:[{t:"かかる事は、[[さらに]]聞かず。",tr:"このようなことは、まったく聞かない。"},{t:"その人の名は[[さらに]]知らず。",tr:"その人の名はまったく知らない。"},{t:"[[さらに]]驚く気色もなし。",tr:"まったく驚く様子もない。"}]}]},
 {w:"さらぬわかれ", pos:"連語", mean:"避けられない別れ（＝死別）", expl:"『避（さ）らぬ別れ』で、人の力では避けられない永遠の別れ、死別を婉曲に表す。", mne:"『避（さ）らぬ』＝避けられない＋『別れ』＝死別、と婉曲表現で覚える。", senses:[{m:"避けられない別れ（死別）",ex:[{t:"[[さらぬわかれ]]のなくもがな、と思ふ。",tr:"避けられない別れ（死別）がなければよいのに、と思う。"},{t:"[[さらぬわかれ]]のある世を嘆く。",tr:"避けられない別れのある世を嘆く。"},{t:"親との[[さらぬわかれ]]、悲しき。",tr:"親との避けられない別れは、悲しい。"}]}]},
 {w:"さるは", pos:"接続", mean:"そうはいうものの・実は", expl:"前の内容を受けつつ、それに反する事実や補足を述べる接続語。", mne:"『さる（そうである）』＋『は』＝そうであるが実は、と逆接的補足として覚える。", senses:[{m:"実は・そうはいうものの",ex:[{t:"[[さるは]]、たよりごとに物も絶えず得させたり",tr:"実は、機会あるごとに物も絶えず与えていた",s:"土佐日記"},{t:"[[さるは]]、心の内にはいたく恨めしく思ふなり。",tr:"実は、心の内ではたいそう恨めしく思っているのだ。"},{t:"[[さるは]]、わが身も同じ目に遭ひたり。",tr:"実は、わが身も同じ目にあった。"}]}]},
 {w:"しのぶ", pos:"動（四段・上二段）", mean:"我慢する・人目を避けて隠れる／恋しく思う", expl:"『忍ぶ（我慢・隠れる）』と『偲ぶ（懐かしむ）』の両方の意味を持つ多義語。", mne:"『忍ぶ』＝隠れて耐える、『偲ぶ』＝懐かしく思う、と二つの漢字で覚える。", senses:[{m:"我慢する・こらえる",ex:[{t:"涙を[[しのび]]て、笑ひて見す。",tr:"涙をこらえて、笑って見せる。"},{t:"涙を[[しのび]]て、答へず。",tr:"涙をこらえて、答えない。"},{t:"辛さを[[しのぶ]]ほかなし。",tr:"つらさを我慢するほかない。"}]},{m:"人目を避ける・隠れる",ex:[{t:"[[忍び]]たるけはひ、いとものあはれなり",tr:"目立たない、ひっそりとした様子は、たいそうしみじみと趣深い",s:"徒然草（第三十二段）"},{t:"人に知られじと、[[しのび]]て通ひたまふ。",tr:"人に知られまいと、こっそり通いなさる。"},{t:"人目を[[しのび]]て、夜に通ふ。",tr:"人目を避けて、夜に通う。"}]},{m:"恋しく思う・懐かしむ",ex:[{t:"昔を[[しのぶ]]心ぞ深き。",tr:"昔を懐かしむ心が深い。"},{t:"亡き人を[[しのぶ]]夜なり。",tr:"亡き人を懐かしく思う夜である。"},{t:"故郷を[[しのび]]て、涙ぐむ。",tr:"故郷を恋しく思って、涙ぐむ。"}]}]},
 {w:"じょことば（修辞法）", pos:"名（修辞法）", mean:"序詞（ある語句を導くための比喩的な前置き表現）", expl:"和歌で、特定の語を引き出すために置かれる比較的長めの修飾表現。", mne:"『序（じょ）』の『言葉』＝本題を導く前置きの言葉、と漢字通りに覚える。", senses:[{m:"ある語句を導く前置きの表現",ex:[{t:"ある語を導く長めの前置きを、[[じょことば]]といふ。",tr:"ある語を導き出す長めの前置きを、序詞という。"},{t:"ある語を導く前置きは、[[じょことば]]なり。",tr:"ある語を導く前置きは、序詞である。"},{t:"歌に[[じょことば]]を置きて、心を深くす。",tr:"歌に序詞を置いて、心を深くする。"}]}]},

 {w:"すさまじ", pos:"形", mean:"興ざめだ・殺風景だ", expl:"期待や情趣に反して、冷めた気持ちにさせる様子を表す。", mne:"現代語『すさまじい（激しい）』とは違い、まず『興ざめ』を思い出す。", senses:[{m:"興ざめだ・つまらない",ex:[{t:"[[すさまじき]]もの、昼ほゆる犬。",tr:"興ざめなもの、それは昼に吠える犬。",s:"枕草子（すさまじきもの）"},{t:"祭りの果てて、[[すさまじく]]思ふ。",tr:"祭りが終わって、興ざめに思う。"},{t:"時過ぎて来たる使ひこそ、[[すさまじき]]。",tr:"時が過ぎてから来た使者こそ、興ざめだ。"}]},{m:"殺風景だ・荒涼としている",ex:[{t:"冬枯れの野辺の[[すさまじく]]見ゆるころ。",tr:"冬枯れの野辺が殺風景に見える頃。"},{t:"霜枯れの庭、[[すさまじき]]眺めなり。",tr:"霜枯れの庭は、殺風景な眺めである。"},{t:"荒れ果てし宿の[[すさまじく]]見ゆ。",tr:"荒れ果てた宿が殺風景に見える。"}]}]},

 {w:"せ", pos:"名", mean:"夫・兄・恋人（女性から見た親しい男性）", expl:"『背』『兄』『夫』の字を当て、女性が夫・兄弟・恋人など親しい男性を呼ぶ語。対義語は『いも（妹）』。", mne:"『せ（背）』＝女性から見た親しい男性、『いも（妹）』＝男性から見た親しい女性、と対で覚える。", senses:[{m:"夫・恋人（女性から見た男性）",ex:[{t:"[[せ]]の君、旅より帰りたまひぬ。",tr:"あの方（夫）が、旅からお帰りになった。"},{t:"妹、[[せ]]の訪れを待ちわぶ。",tr:"妻（女）は、夫の訪れを待ちわびる。"},{t:"[[せ]]なる人と、夜もすがら語らふ。",tr:"恋人と、一晩中語り合う。"}]},{m:"兄（女性から見た）",ex:[{t:"[[せ]]なる人、妹をいとほしみたまふ。",tr:"兄である人は、妹をいとおしみなさる。"},{t:"妹、[[せ]]の旅立ちを見送りて泣く。",tr:"妹は、兄の旅立ちを見送って泣く。"},{t:"[[せ]]なる人の、妹を気づかふ。",tr:"兄である人が、妹を気づかう。"}]}]},

 {w:"そこはかとなし", pos:"形", mean:"なんとなく・はっきりしない", expl:"特にこれといった理由や対象を特定できない、漠然とした様子を表す。", mne:"『そこ（其処）』が『はか（はっきり）』と『無し』＝場所も理由も不明瞭、と覚える。", senses:[{m:"これといった理由もない・なんとなく",ex:[{t:"[[そこはかとなく]]書きつくれば",tr:"これといった理由もなく書きつけると",s:"徒然草（序段）"},{t:"[[そこはかとなく]]悲しき夕暮れなり。",tr:"なんとなく悲しい夕暮れである。"},{t:"[[そこはかとなき]]思ひに沈む。",tr:"これといった理由もない物思いに沈む。"}]}]},

 {w:"たがふ", pos:"動（四段・下二段）", mean:"食い違う・背く／違える", expl:"物事が一致しない、約束などに背く様子を表す。", mne:"『違（たが）ふ』＝『違う』の古語、とそのまま覚える。", senses:[{m:"食い違う・背く",ex:[{t:"約束に[[たがひ]]て、人に恨まる。",tr:"約束に背いて、人に恨まれる。"},{t:"言ふこととする事と[[たがふ]]。",tr:"言うことと行うこととが食い違う。"},{t:"教へに[[たがひ]]て、身を滅ぼす。",tr:"教えに背いて、身を滅ぼす。"}]},{m:"間違える・違える",ex:[{t:"日取りを[[たがへ]]て、人を待たす。",tr:"日取りを間違えて、人を待たせる。"},{t:"道を[[たがへ]]て、野に迷ふ。",tr:"道を間違えて、野に迷う。"},{t:"約束の日を[[たがへ]]たり。",tr:"約束の日を間違えた。"}]}]},
 {w:"たけし", pos:"形", mean:"勇猛だ・激しい・強い", expl:"武勇や勢いの強さ、猛々しさを表す形容詞。", mne:"『猛（たけ）し』＝『猛々しい』の語源、と漢字から覚える。", senses:[{m:"勇猛だ・強い",ex:[{t:"[[たけき]]者も遂にはほろびぬ",tr:"勢いの盛んな者も、ついには滅びてしまった",s:"平家物語（冒頭）"},{t:"[[猛き]]武士の心をも慰むるは、歌なり",tr:"勇猛な武士の心をも慰めるのは、歌である",s:"古今和歌集（仮名序）"},{t:"[[たけき]]武士も、涙を流しぬ。",tr:"勇猛な武士も、涙を流した。"}]},{m:"激しい",ex:[{t:"[[たけき]]風に、船も進まず。",tr:"激しい風で、船も進まない。"},{t:"[[たけき]]波に、船揺るる。",tr:"激しい波に、船が揺れる。"},{t:"[[たけく]]吹く風に、木々なびく。",tr:"激しく吹く風に、木々がなびく。"}]}]},

 {w:"たのむ", pos:"動（四段・下二段）", mean:"頼りにする／頼りにさせる・あてにさせる", expl:"四段は自分が頼る意味、下二段は相手に自分を頼らせる（期待させる）意味になる点に注意。", mne:"活用の種類で意味が変わる語として『四段＝頼る／下二段＝頼らせる』とセットで覚える。", senses:[{m:"頼りにする・あてにする",ex:[{t:"愚かなる人は、深くものを[[頼む]]ゆゑに、恨み、怒ることあり",tr:"愚かな人は、深く物事をあてにするために、恨み怒ることがある",s:"徒然草（第二百十一段）"},{t:"人の情けを[[たのみ]]て、旅に出づ。",tr:"人の情けをあてにして、旅に出る。"},{t:"友の力を[[たのみ]]て、旅に出づ。",tr:"友の力をあてにして、旅に出る。"}]},{m:"頼りにさせる・あてにさせる",ex:[{t:"行く末を[[たのめ]]て、女のもとを去りぬ。",tr:"将来を期待させて、女のもとを去った。"},{t:"必ず来むと[[たのめ]]て、来ざりけり。",tr:"必ず来ようと期待させて、来なかった。"},{t:"行く末を[[たのむ]]る男の言葉に、頼みを置く。",tr:"将来を期待させる男の言葉に、頼みを置く。"}]}]},

 {w:"つつむ", pos:"動（四段）", mean:"遠慮する・気兼ねする／包む", expl:"『慎む』に通じ、人目を気にして控えめに振る舞うことを表す。", mne:"『包（つつ）む』＝感情を包み隠す＝遠慮する、とイメージで覚える。", senses:[{m:"遠慮する・気兼ねする",ex:[{t:"人目を[[つつみ]]て、昼は出でず。",tr:"人目を気にして、昼は外に出ない。"},{t:"人の見るを[[つつみ]]て、控ふ。",tr:"人が見るのを気にして、控える。"},{t:"恥づかしさに[[つつみ]]て、物も言はず。",tr:"恥ずかしさに遠慮して、物も言わない。"}]},{m:"包み隠す",ex:[{t:"悲しみを心に[[つつみ]]て、笑ひぬ。",tr:"悲しみを心に包み隠して、笑った。"},{t:"涙を袖に[[つつむ]]。",tr:"涙を袖に包み隠す。"},{t:"恋を胸に[[つつみ]]て、年経たり。",tr:"恋を胸に包み隠して、年を経た。"}]}]},
 {w:"つとめて", pos:"名", mean:"早朝・（何かがあった）翌朝", expl:"一般的な早朝のほか、特に後朝（きぬぎぬ）の翌朝を指すことが多い。", mne:"『努（つと）めて』早起きする時間＝早朝、と語感で覚える。", senses:[{m:"早朝",ex:[{t:"冬は[[つとめて]]。",tr:"冬は早朝がよい。",s:"枕草子（春はあけぼの・冬）"},{t:"[[つとめて]]起きて、庭を掃く。",tr:"早朝に起きて、庭を掃く。"},{t:"[[つとめて]]出で立ちて、野に至る。",tr:"早朝に出発して、野に至る。"}]},{m:"（何かあった夜の）翌朝",ex:[{t:"雪の降りし夜の[[つとめて]]、人の来たりぬ。",tr:"雪の降った夜の翌朝、人が来た。"},{t:"逢ひし夜の[[つとめて]]、文を遣る。",tr:"逢った夜の翌朝、手紙を送る。"},{t:"雨降りし夜の[[つとめて]]、庭を見る。",tr:"雨の降った夜の翌朝、庭を見る。"}]}]},
 {w:"つゆ（～ず）", pos:"副", mean:"まったく～ない・少しも～ない", expl:"下に打消を伴い、『つゆほども～ない』と完全否定を強調する。", mne:"『露（つゆ）ほども』＝ほんの少しも～ない、と現代語表現と重ねて覚える。", senses:[{m:"まったく～ない・少しも～ない",ex:[{t:"[[つゆ]]の癖なき。",tr:"少しの癖（欠点）もない（人）。",s:"枕草子（ありがたきもの）"},{t:"その人の来るとは、[[つゆ]]思はざりき。",tr:"その人が来るとは、少しも思わなかった。"},{t:"その道は[[つゆ]]知らざりき。",tr:"その道は少しも知らなかった。"}]}]},
 {w:"つれづれなり", pos:"形動", mean:"することがなく退屈だ・所在ない", expl:"時間を持て余し、手持ち無沙汰でぼんやりしている様子を表す。", mne:"『徒然（つれづれ）』は『徒然草』の題名でも有名、『退屈』と覚える。", senses:[{m:"することがなく退屈だ",ex:[{t:"[[つれづれなる]]ままに、日暮らし硯に向かひて",tr:"することもなく退屈なのにまかせて、一日中硯に向かって",s:"徒然草（序段）"},{t:"[[つれづれなる]]昼間、宵居などに",tr:"退屈な昼間や、夜遅くまで起きている折などに",s:"更級日記"},{t:"日もいと長きに[[つれづれなれ]]ば",tr:"日もたいそう長くて退屈なので",s:"源氏物語（若紫）"}]}]},
 {w:"つれなし", pos:"形", mean:"冷淡だ・そ知らぬ顔だ・平然としている", expl:"相手への配慮や反応を見せず、素っ気ない態度を表す。", mne:"『連れ無し』＝心が連れ添わない＝冷淡、と語感で覚える。", senses:[{m:"冷淡だ・薄情だ",ex:[{t:"[[つれなき]]人の心を恨む。",tr:"冷淡な人の心を恨む。"},{t:"[[つれなき]]人を、なほ恋ひ慕ふ。",tr:"冷淡な人を、なお恋い慕う。"},{t:"訪ふ人も[[つれなく]]なりぬ。",tr:"訪れる人も薄情になった。"}]},{m:"そ知らぬ顔だ・平然としている",ex:[{t:"心の内は苦しけれど、[[つれなく]]もてなす。",tr:"心の内は苦しいけれど、平然とふるまう。"},{t:"[[つれなく]]知らぬふりをす。",tr:"平然と知らぬふりをする。"},{t:"胸痛めど、[[つれなく]]笑ひてをり。",tr:"胸を痛めているが、平然と笑っている。"}]}]},
 {w:"て（手）", pos:"名", mean:"筆跡・書風／腕前", expl:"身体の『手』だけでなく、書いた文字の筆跡や、技能の腕前を指すことがある。", mne:"『手』が上手い＝『筆跡が美しい・腕前が良い』と意味の広がりを覚える。", senses:[{m:"筆跡・書",ex:[{t:"[[て]]よく書く人にて、文もうつくし。",tr:"字を上手に書く人で、手紙も美しい。"},{t:"[[て]]を見て、人の誰か知る。",tr:"筆跡を見て、人が誰かを知る。"},{t:"[[て]]美しき女房なり。",tr:"筆跡の美しい女房である。"}]},{m:"腕前・技量",ex:[{t:"琴の[[て]]、世に並びなし。",tr:"琴の腕前は、世に並ぶ者がない。"},{t:"笛の[[て]]、世に聞こえたり。",tr:"笛の腕前は、世に知られている。"},{t:"[[て]]のほど、人に劣らず。",tr:"腕前は、人に劣らない。"}]}]},

 {w:"としごろ", pos:"名", mean:"長年の間・数年来", expl:"現代語『年頃（適齢期）』ではなく、『長い年月の間』という期間を表す。", mne:"現代語との意味ずれに注意し、『長年の間』をまず覚える。", senses:[{m:"長年の間・数年来",ex:[{t:"[[年ごろ]]思ひつること、果たしはべりぬ",tr:"長年思っていたことを、果たしました",s:"徒然草（第五十二段）"},{t:"[[としごろ]]思ひわたる事なり。",tr:"長年ずっと思い続けてきたことである。"},{t:"[[としごろ]]住みし里を離れぬ。",tr:"長年住んだ里を離れた。"}]}]},
 {w:"とぶらふ", pos:"動（四段）", mean:"訪問する・見舞う／弔う", expl:"人を訪ねる意味と、死者を弔う意味の両方を持つ語。", mne:"『訪（とぶら）ふ』＝訪ねる、生者なら見舞い、死者なら弔い、と使い分けて覚える。", senses:[{m:"訪問する・見舞う",ex:[{t:"[[とぶらは]]むとて、五条なる家尋ねておはしたり",tr:"見舞おうとして、五条にある家を尋ねていらっしゃった",s:"源氏物語（夕顔）"},{t:"人ども来[[とぶらひ]]ければ",tr:"人々が来て見舞ったので",s:"宇治拾遺物語（絵仏師良秀）"},{t:"病の人を[[とぶらひ]]に行く。",tr:"病気の人を見舞いに行く。"}]},{m:"弔う",ex:[{t:"亡き人の後世を[[とぶらふ]]。",tr:"亡き人の後世を弔う。"},{t:"亡き親の墓を[[とぶらふ]]。",tr:"亡き親の墓を弔う。"},{t:"僧を請じて、死者を[[とぶらふ]]。",tr:"僧を招いて、死者を弔う。"}]}]},
 {w:"とみに", pos:"副", mean:"急に・にわかに", expl:"物事が突然に起こる様子を表す副詞で、多く打消を伴って『急には～ない』となる。", mne:"『頓（とみ）に』＝『頓死』の『頓』と同源、急なさまと覚える。", senses:[{m:"急に・にわかに",ex:[{t:"[[とみに]]立ち上がりて、走り出づ。",tr:"急に立ち上がって、走り出す。"},{t:"[[とみに]]風立ちて、波高し。",tr:"急に風が立って、波が高い。"},{t:"[[とみに]]立ち去りて、行方知れず。",tr:"急に立ち去って、行方知れず。"}]}]},
 {w:"なかなかなり", pos:"形動", mean:"中途半端だ・かえって（しない方がよかった）", expl:"生半可な状態がかえってマイナスに働く、というニュアンスを持つ語。", mne:"現代語『なかなか』（かなり）との意味ずれに注意し、『中途半端・かえって』を覚える。", senses:[{m:"中途半端だ",ex:[{t:"[[なかなかなる]]知恵を出して、事をしそこなふ。",tr:"中途半端な知恵を出して、事をしそこなう。"},{t:"[[なかなかなる]]学びは、身につかず。",tr:"中途半端な学びは、身につかない。"},{t:"[[なかなかなる]]親切、かへりて恨まる。",tr:"中途半端な親切は、かえって恨まれる。"}]},{m:"かえって・むしろ",ex:[{t:"[[なかなか]]見ざらましかば、かくは悲しからじ。",tr:"かえって見なかったならば、これほど悲しくはないだろうに。"},{t:"[[なかなか]]言はざらましかば、よかりけむ。",tr:"かえって言わなかったならば、よかっただろう。"},{t:"[[なかなか]]逢はぬ方こそ、心安けれ。",tr:"むしろ逢わない方が、心安らかだ。"}]}]},
 {w:"ながむ", pos:"動（下二段）", mean:"もの思いにふけりながら眺める・詠嘆する", expl:"単に景色を見るだけでなく、物思いにふけりながらぼんやり眺める様子を表す。", mne:"『眺む』は『詠（なが）む』にも通じ、もの思いを込めた行為と覚える。", senses:[{m:"物思いにふけって眺める",ex:[{t:"月を[[ながめ]]て、夜を明かす。",tr:"月を物思いにふけりながら眺めて、夜を明かす。"},{t:"縁に出でて、月を[[ながめ]]けり。",tr:"縁に出て、月を物思いに眺めた。"},{t:"雨の日、物思ひて[[ながむ]]。",tr:"雨の日、物思いにふけって眺める。"}]}]},
 {w:"な～そ", pos:"連語", mean:"～するな（禁止）", expl:"『な』と『そ』で動詞の連用形（カ変・サ変は未然形）を挟み、禁止を表す呼応表現。", mne:"『な』と『そ』で挟んだら『～するな』と機械的に訳す、と型で覚える。", senses:[{m:"～するな（禁止）",ex:[{t:"このこと、人に[[な語りそ]]。",tr:"このことを、人に話すな。"},{t:"ここに入り来る[[な来そ]]。",tr:"ここに入って来るな。"},{t:"このこと、人に[[な告げそ]]。",tr:"このことを、人に告げるな。"}]}]},
 {w:"なでふ", pos:"連体詞／副", mean:"どうして・なんという", expl:"驚きや反発を込めて理由を問う語で、反語的に使われることが多い。", mne:"『何（なに）といふ』が縮まった語、と語源から『なんという・どうして』を覚える。", senses:[{m:"どうして・なんという",ex:[{t:"[[なでふ]]事かあらむ。",tr:"どうしてそんなことがあろうか。"},{t:"[[なでふ]]さることのあるべき。",tr:"どうしてそのようなことがあろうか。"},{t:"[[なでふ]]心地すれば、かく悲しき。",tr:"どういう気持ちがするから、こんなに悲しいのか。"}]}]},
 {w:"なにおふ（名に負ふ）", pos:"連語", mean:"評判が高い・名前にふさわしい", expl:"その名の通りの評判・実質を備えていることを表す。", mne:"『名』を『負う』＝名前にふさわしい実質を持つ、と漢字から覚える。", senses:[{m:"評判が高い・名にふさわしい",ex:[{t:"[[なにおふ]]都の桜、見に来たり。",tr:"名高い都の桜を、見に来た。"},{t:"[[なにおふ]]名所を、訪ね歩く。",tr:"名高い名所を、訪ね歩く。"},{t:"[[名に負ふ]]花の色、見る人の足を止む。",tr:"名にふさわしい花の色が、見る人の足を止める。"}]}]},
 {w:"なのめなり", pos:"形動", mean:"いいかげんだ・平凡だ・（打消で）並々でない", expl:"『斜めなり』が語源で、通り一遍の平凡さを表す。打消を伴うと『格別だ』と逆の意味になる点に注意。", mne:"『斜め』＝まっすぐでない＝いい加減、ただし『なのめならず』は『格別』と反転すると覚える。", senses:[{m:"いいかげんだ・並一通りだ",ex:[{t:"[[なのめなる]]心にては、かかる大事は成らず。",tr:"いいかげんな心では、このような大事は成し遂げられない。"},{t:"[[なのめなる]]心にては、成し遂げがたし。",tr:"いいかげんな心では、成し遂げにくい。"},{t:"[[なのめに]]聞き流して、答へず。",tr:"いいかげんに聞き流して、答えない。"}]},{m:"（打消で）並々でない・格別だ",ex:[{t:"[[なのめならず]]喜びたまふ。",tr:"並々でなくお喜びになる。"},{t:"[[なのめならず]]美しき花なり。",tr:"並々でなく美しい花である。"},{t:"喜び[[なのめならず]]。",tr:"喜びは格別である。"}]}]},
 {w:"なほ", pos:"副", mean:"やはり・依然として／さらに", expl:"以前の状態が変わらず続くこと、また程度が一層増すことを表す。", mne:"現代語『なお』とほぼ同じ、『やはり・さらに』で直感的に覚える。", senses:[{m:"やはり・依然として",ex:[{t:"事ある時は、[[なほ]]拠り所なく心細げなり",tr:"事のある時は、やはり頼る所がなく心細そうである",s:"源氏物語（桐壺）"},{t:"闇も[[なほ]]、蛍の多く飛びちがひたる",tr:"闇夜もやはり、蛍が多く飛びかっている",s:"枕草子（春はあけぼの・夏）"},{t:"日経れど、[[なほ]]消息なし。",tr:"日が経っても、依然として便りがない。"}]},{m:"さらに・いっそう",ex:[{t:"[[なほ]]奥つ方に生ひ出でたる人",tr:"さらに奥の方に成長した人",s:"更級日記"},{t:"雨に加へて、[[なほ]]風さへ吹きいでぬ。",tr:"雨に加えて、さらに風まで吹き出した。"},{t:"雪降りて、[[なほ]]寒さまさる。",tr:"雪が降って、さらに寒さがまさる。"}]}]},
